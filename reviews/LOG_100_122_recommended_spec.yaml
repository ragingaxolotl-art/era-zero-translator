  proposal_status: canonical_by_delegated_approval
  proposed_title: completed internal formal evaluation
  invariant_definition: Completion of a formal evaluation that determines the admissibility
    of one reference entity under its applicable internal criterion.
  semantic_center: 'formal evaluation processes: internal evaluation, target constraint
    application, and systemic regime evaluation'
  address_justification:
    first_trit_1: Selects a formal evaluation process that determines admissibility
      rather than the rule entity, a stored representation, a result value, or a formal
      applicability/consequence relation.
    second_trit: 'Selects inward/self scope: one reference entity evaluated under
      its applicable internal criterion and no other Logic-family column.'
    third_trit: Selects the completed phase of the same formal evaluation while leaving
      runtime truth status, result polarity, correctness, observer knowledge, tense,
      probability, and scheduling separate.
  inclusion_boundary: Includes only the completed internal formal evaluation as a
    substrate-neutral process that determines admissibility at inward scope. The process
    evaluates one entity without requiring a distinct external target. Its internal
    criterion, input representation, and result polarity remain separate. It is neutral
    about the rule's storage or authority, acceptance versus rejection, truth, proof
    correctness, physical side effects, observer belief, scheduling, probability,
    timing, and cause.
  excluded_meanings:
  - The formal criterion, target constraint, or shared regime as an entity, and its
    persistent, operative, or dormant status.
  - Acceptance, rejection, true, false, valid, invalid, satisfied, violated, error,
    or any other polarity or result value.
  - Data input, variable, binding, symbol string, record, schema, source code, proof
    object, or stored output.
  - Physical, biological, communicative, structural, restorative, creative, or adverse
    transformation produced alongside evaluation.
  - Authorship, authority, enforcement, sanction, resource use, implementation algorithm,
    performance, or complexity.
  - Applicability, entailment, consistency, computability, intention, plan, readiness,
    queue, schedule, future time, possibility, necessity, probability, or cause.
  nearest_neighbors:
  - LOG:101
  - LOG:102
  - LOG:110
  - LOG:120
  - LOG:100
  - LOG:200
  same_family_contrast: "`LOG:0xx` owns formal constraint entities and their identity
    or operation. `LOG:1xx` owns only the corresponding formal evaluation processes.
    `LOG:2xx` remains reserved for applicability, consequence, consistency, computability,
    or other formal relations and capacities. An operative rule does not entail an
    evaluation, and an evaluation does not entail a positive result or a persistent
    applicability relation. Completed, active, and nonactualized are mutually exclusive
    phases for the same bounded evaluation at one reference time. Lexical nonactualization
    states only that the typed process is not actualized; runtime `[2]/num` separately
    marks uncertainty about any selected phase."
  cross_family_comparisons: &1
    LIF: LIF owns living identities, biological conditions, agents, and social collectives.
      A living agent may perform or undergo a LOG evaluation, but LOG:1xx does not
      encode the agent's life, role, health, or agency.
    MOV: MOV owns position, path, displacement, and motion processes. A LOG evaluation
      may determine whether movement is admissible, but it neither moves anything
      nor constitutes a route, destination, departure, or arrival.
    MAT: MAT owns substance, energy, force, contact, and material change. A sensor
      test may supply evidence to a LOG evaluation, but LOG:1xx does not encode the
      physical measurement, mechanism, or change.
    MIN: MIN owns mental state, attention, belief, reasoning, and cognitive change.
      A thinker may carry out a LOG evaluation, but the formal admissibility-determining
      process is not the thinker's belief, attention shift, or private inference episode.
    CON: CON owns communication, social linkage, interaction, and participation. A
      request, vote, or message may trigger or report a LOG evaluation, but it is
      not the evaluation itself.
    WRN: WRN owns hazards, faults, warnings, and adverse states. A LOG evaluation
      may determine that a constraint is not satisfied, but it does not by itself
      assert danger, failure, diagnosis, prohibition, or harm.
    STR: STR owns arrangements, boundaries, component relations, and structural transitions.
      A workflow may host a LOG evaluation, but LOG:1xx does not encode the workflow
      step, structural transition, or implementation mechanism.
    REP: REP owns restoration conditions, restorative processes, and restorative affordances.
      A LOG evaluation may test whether restoration satisfies a criterion, but it
      is not the restoration, restored state, or recovery capacity.
    DAT: DAT owns information artifacts, values, encodings, and data flow. Data may
      be input to or output from a LOG evaluation, but LOG:1xx is the formal admissibility-determining
      process rather than the data, result record, code, or transmission.
    CRE: CRE owns creation, transformation, generation, and productive capacities.
      A LOG evaluation may constrain a generated product, but it does not create,
      transform, or produce that product.
    ORI: ORI owns temporal, modal, causal, and ontological orientation. Scheduling,
      intention, possibility, necessity, and future placement of a LOG evaluation
      require ORI or compounds; lexical nonactualization does not encode them.
  runtime_state_interpretation:
    '0': Denies that this internal formal evaluation completed; it does not assert
      that the active sibling is still running, that the nonactualized sibling holds,
      or that the result had either polarity.
    '1': Affirms completion of this internal formal evaluation and therefore determination
      of an admissibility result, without asserting acceptance, rejection, proof validity,
      persistence, storage, or enforcement.
    2/num: Leaves unresolved whether this completed internal formal evaluation claim
      holds; runtime uncertainty does not change the lexical root into active or nonactualized
      phase.
  lexical_runtime_distinction: Lexical third trit `0` permanently selects the completed
    phase of this formal evaluation. Runtime `[2]/num` instead leaves the already-selected
    phase claim unresolved; it never changes process phase. Thus a nonactualized root
    affirmed with `[1]` is a confirmed typed-but-nonactualized evaluation, while a
    completed or active root carrying `[2]/num` remains lexically completed or active
    but uncertain as a token claim.
  examples:
  - category: ordinary_conversation
    semantic_graph: LOG:100[1](ENTITY=account,CRITERION=c)
    literal_gloss: affirm completed internal formal evaluation
    natural_english: The formal check for the account finished and determined an admissibility
