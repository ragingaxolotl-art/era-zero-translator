    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or participant whose admissibility is evaluated
      middle: formal evaluation process as the asserted figure
      high: applicable criterion, assigned constraint, or distinct target
      sustained: shared formal regime and multiple participants evaluated together
    use_status: valid
    analysis: Formal evaluation and physical mechanism remain separately typed.
  - category: temporal_or_sequential
    semantic_graph: LOG:100[1](ENTITY=account,CRITERION=c)+ORI(INTERVAL=w)
    literal_gloss: completed formal evaluation during interval w
    natural_english: During interval w, the evaluation has the stated lexical phase.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or participant whose admissibility is evaluated
      middle: formal evaluation process as the asserted figure
      high: applicable criterion, assigned constraint, or distinct target
      sustained: shared formal regime and multiple participants evaluated together
    use_status: valid
    analysis: ORI supplies time and does not replace process phase.
  - category: cross_family_compound
    semantic_graph: DAT(INPUT=d)+LOG:100[1](ENTITY=account,CRITERION=c)
    literal_gloss: represented input plus completed formal evaluation
    natural_english: The data supplies the represented input while LOG supplies the
      admissibility-determining process.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or participant whose admissibility is evaluated
      middle: formal evaluation process as the asserted figure
      high: applicable criterion, assigned constraint, or distinct target
      sustained: shared formal regime and multiple participants evaluated together
    use_status: valid
    analysis: DAT and LOG remain distinct.
  - category: executable_or_programming
    semantic_graph: LOG:100[1](ENTITY=account,CRITERION=c)
    literal_gloss: assert completed formal evaluation
    natural_english: A runtime tracks the evaluation phase without folding in the
      rule record or result polarity.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: reference entity or participant whose admissibility is evaluated
      middle: formal evaluation process as the asserted figure
      high: applicable criterion, assigned constraint, or distinct target
      sustained: shared formal regime and multiple participants evaluated together
    use_status: valid
    analysis: Evaluation, rule, and result remain distinct.
    pseudocode: assert(evaluation.phase == "LOG:100")
  - category: counterexample
    semantic_graph: LOG:001[1](CRITERION=c)
    literal_gloss: operative rule entity
    natural_english: The rule currently governs accepted states, but no evaluation
      is running.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or participant whose admissibility is evaluated
      middle: formal evaluation process as the asserted figure
      high: applicable criterion, assigned constraint, or distinct target
      sustained: shared formal regime and multiple participants evaluated together
    use_status: must_not_use_this_root
    analysis: An operative constraint belongs to LOG:0xx and does not entail a LOG:1xx
      evaluation.
  future_compound_examples:
  - LOG:100 + LOG:0xx supplies the criterion or regime being applied without reducing
