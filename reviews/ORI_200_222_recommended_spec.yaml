  - ORI:200 + MAT/LIF/MIN/CON/CRE supplies physical, living, mental, social, or productive
    mechanisms separately.
  later_era_notes: Later eras may lexicalize causal sufficiency, historical provenance,
    temporal priority, necessity, probability, counterfactual accessibility, world
