  proposal_status: canonical_by_delegated_approval
  proposed_title: persistent source-grounding capacity
  invariant_definition: A persistent ontological capacity of one source to ground
    a specified state of affairs, independently of whether that capacity is presently
    operative.
  semantic_center: 'ontological relations: source-grounding capacity, target-ground
    dependence, and shared-world constraint'
  address_justification:
    first_trit_2: Selects an ontological relation, capacity, dependence, or constraint
      rather than an entity condition or bounded transition.
    second_trit: Selects inward/source orientation and therefore source-grounding
      capacity, not another Origin-family column.
    third_trit: Selects persistent lexical status while leaving token truth, observer
      knowledge, tense, probability, causation, and physical mechanism separate.
  inclusion_boundary: Includes only a persistent source-grounding capacity as a substrate-neutral
    relation in what may obtain within a specified reality. It is neutral about physical
    mechanism, temporal order, probability, intention, observation, representation,
    logical proof, software implementation, social permission, productive agency,
    structural arrangement, danger, and repair. It neither creates its relata nor
    asserts that a formal description is true.
  excluded_meanings:
  - The source-ground, distinct-existence, or shared-world condition itself.
  - A bounded transition that establishes, actualizes, or changes an ontological condition.
  - Causal force, productive method, temporal priority, provenance history, physical
    disposition, biological capacity, mental possibility, permission, or plan.
  - Formal entailment, satisfiability, probability, counterfactual accessibility,
    data dependency, structural dependency, or software constraint without explicit
    ontological scope.
  - Observation, evidence, representation, truth, validity, certainty, consensus,
    authorship, ownership, success, or failure.
  - Any equation of lexical latency with runtime uncertainty, futurity, intention,
    scheduling, or mere ignorance.
  nearest_neighbors:
  - ORI:201
  - ORI:202
  - ORI:210
  - ORI:220
  - ORI:000
  - ORI:100
  same_family_contrast: "`ORI:0xx` owns ontological conditions: source-ground, distinct
    existence, and shared-world condition. `ORI:1xx` owns bounded transitions that
    establish or change those conditions. `ORI:2xx` owns ontological relations and
    capacities: source-grounding capacity, target-ground dependence, and shared-world
    constraint. A relation does not entail that either relatum presently exists, that
    a transition is occurring, or that a causal mechanism has acted. Persistent status
    may coexist with either operative or latent status across compatible reference
    spans; operative and latent are mutually exclusive for the same relation at one
    reference time. Runtime `[2]/num` separately marks uncertainty about whichever
    lexical status was selected."
  cross_family_comparisons: &1
    LIF: LIF owns biological capacities, dependencies, and social roles. ORI relation
      is substrate-neutral ontological grounding, dependence, or world constraint.
    MOV: MOV owns routes, destinations, and movement affordances. ORI relation does
      not encode spatial reachability, travel, direction, or transport.
    MAT: MAT owns physical dispositions, forces, and material dependencies. ORI relation
      does not specify substance, energy, or physical mechanism.
    MIN: MIN owns mental possibility, belief, intention, and attention. Conceivability
      or expectation does not establish an ORI grounding relation.
    CON: CON owns participant linkage, communication, permission, and authority. ORI
      dependence is not a social or communication relationship.
    WRN: WRN owns risk, vulnerability, failure, and harmful propagation. ORI capacity
      and constraint are neutral about danger and failure.
    STR: STR owns component dependency, containment, topology, and architecture. ORI
      dependence concerns what may obtain, not arrangement alone.
    REP: REP owns recoverability, repair prerequisites, and restoration paths. ORI
      relations do not presuppose damage or acceptable prior state.
    LOG: LOG owns formal entailment, satisfiability, proof, and rule evaluation. ORI
      constraint applies to reality, not merely to a formal model or proposition.
    DAT: DAT owns representational schemas, references, and data dependencies. A record
      dependency does not by itself entail ontological dependence of its referent.
    CRE: CRE owns generative capability, authorship, and productive constraints. ORI
      source capacity does not assert an agent, method, artifact, or production event.
  runtime_state_interpretation:
    '0': Denies persistence of this source-grounding capacity; it does not assert
      absence, impossibility, reversal, or the operative or latent sibling.
    '1': Affirms that this source-grounding capacity persists across the relevant
      reference span without asserting that it is presently operative.
    2/num: Leaves persistence of this source-grounding capacity unresolved; runtime
      uncertainty does not change the lexical root into operative or latent status.
  lexical_runtime_distinction: Lexical third trit `0` permanently selects persistent
    status for this source-grounding capacity. Runtime `[2]/num` instead leaves that
    already-selected status claim unresolved. Thus a latent root with `[1]` positively
    asserts latent membership, while any persistent or operative root with `[2]/num`
    remains lexically persistent or operative but uncertain as a token claim.
  examples:
  - category: ordinary_conversation
    semantic_graph: ORI:200[1](SOURCE=s,STATE=q)
    literal_gloss: affirm persistent source-grounding capacity
    natural_english: The source-grounding capacity remains part of the standing ontology.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: referent whose obtaining, capacity, or constraint is qualified
      middle: ontological ground, target, or world relation as figure
      high: specified grounded state, condition, or admissible outcome
      sustained: relevant reality and reference conditions
    use_status: valid
    analysis: Valid ontological-relation claim.
  - category: physical_or_spatial
    semantic_graph: ORI:200[1](SOURCE=s,STATE=q)+MAT(BEARER=m)
    literal_gloss: ontological relation plus material bearer
    natural_english: The physical bearer participates, but the grounding relation
      is stated separately.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: referent whose obtaining, capacity, or constraint is qualified
      middle: ontological ground, target, or world relation as figure
      high: specified grounded state, condition, or admissible outcome
      sustained: relevant reality and reference conditions
    use_status: valid
    analysis: MAT supplies physical mechanism.
  - category: temporal_or_sequential
    semantic_graph: ORI:200[1](SOURCE=s,STATE=q)+ORI(INTERVAL=i)
    literal_gloss: persistent ontological relation during interval i
    natural_english: During interval i, the relation has the selected lexical status.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: referent whose obtaining, capacity, or constraint is qualified
      middle: ontological ground, target, or world relation as figure
      high: specified grounded state, condition, or admissible outcome
      sustained: relevant reality and reference conditions
    use_status: valid
    analysis: Time does not select the third trit.
  - category: cross_family_compound
    semantic_graph: ORI:200[1](SOURCE=s,STATE=q)+LOG(RULE=r)+STR(SYSTEM=x)
    literal_gloss: ontological relation plus rule and system structure
    natural_english: The system models the relation while logic and structure state
      its formal implementation.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: referent whose obtaining, capacity, or constraint is qualified
      middle: ontological ground, target, or world relation as figure
      high: specified grounded state, condition, or admissible outcome
      sustained: relevant reality and reference conditions
    use_status: valid
    analysis: Ontology, logic, and structure remain separate.
  - category: executable_or_programming
    semantic_graph: ORI:200[1](SOURCE=s,STATE=q)
    literal_gloss: assert persistent source-grounding capacity
    natural_english: A runtime records the ontological relation without treating it
      as a Boolean dependency or scheduler edge.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: referent whose obtaining, capacity, or constraint is qualified
      middle: ontological ground, target, or world relation as figure
      high: specified grounded state, condition, or admissible outcome
      sustained: relevant reality and reference conditions
    use_status: valid
    analysis: Useful for ontology graphs and state validation.
    pseudocode: ontology.assert_relation("ORI:200")
  - category: counterexample
    semantic_graph: DAT(FOREIGN_KEY=k)+LOG(CONSTRAINT=c)
    literal_gloss: data reference plus formal constraint
    natural_english: The table has a foreign key constraint.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: referent whose obtaining, capacity, or constraint is qualified
      middle: ontological ground, target, or world relation as figure
      high: specified grounded state, condition, or admissible outcome
      sustained: relevant reality and reference conditions
    use_status: must_not_use_this_root
    analysis: Use DAT and LOG unless the modeled referents themselves are ontologically
      related.
  future_compound_examples:
  - ORI:200 + ORI:0xx states a related ontological condition without reducing relation
    to state.
  - ORI:200 + ORI:1xx states establishment or change of the relation without reducing
    relation to process.
