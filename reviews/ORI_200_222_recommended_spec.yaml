metadata:
  title: ORI:200–222 recommended permanent semantic specification
  status: approved_and_canonical_by_delegated_authority
  architecture_version: '1.0'
  semantic_center: 'ontological relations: source-grounding capacity, target-ground
    dependence, and shared-world constraint'
  triplets:
    ORI:200–202: 'source-grounding capacity: persistent / operative / latent'
    ORI:210–212: 'target-ground dependence: persistent / operative / latent'
    ORI:220–222: 'shared-world constraint: persistent / operative / latent'
  triplet_logic:
    persistent: standing across the relevant reference span, independently of current
      operation
    operative: presently governing the specified case
    latent: belonging without present operation
    runtime_uncertainty: runtime [2]/num qualifies the selected lexical status and
      never selects latency
  generated_fields_changed: false
  gate4_started: false
  translator_started: false
