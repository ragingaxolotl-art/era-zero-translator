  - candidate_id: restoration_condition_entities
    title: persistent internal restoration condition
    invariant_candidate: An acceptable condition internal to one reference entity
      that remains identified as that entity's restoration standard independently
      of whether it is presently realized.
    analysis:
      why_it_fits: The first trit stays entity/condition; the second alone selects
        an acceptable condition internal to one entity, assigned to one distinct target,
        or correlated across multiple system participants; the third alone selects
        persistent identity, present realization, or dormancy.
      useful_coverage: It supplies compact atoms for restored state, accepted baseline,
        recovered service, healed condition, target restoration, shared recovery,
        and comparison to a restoration reference across ordinary and technical domains.
      semantic_territory_consumed: Only the identity and present realization of a
        substrate-neutral restoration condition. Damage, repair processes, recoverability,
        resources, records, rules, observer belief, and time remain separate.
      conflicts_or_future_limitations: The phrase acceptable condition requires an
        applicable restoration frame, but factoring the frame from its record or rule
        yields stable atoms and avoids domain-specific notions of health, correctness,
        or physical integrity.
