  proposal_status: canonical_by_delegated_approval
  proposed_title: completed internal data transformation
  invariant_definition: Completion of a bounded transformation of represented information
    within one reference entity, yielding transformed information without transferring
    it to a distinct target.
  semantic_center: 'information-state processes: internal data transformation, target
    data transfer, and systemic data synchronization'
  address_justification:
    first_trit_1: Selects an information-state process rather than an information
      entity, physical carrier, participant interaction, cognitive act, or information-process
      affordance.
    second_trit: 'Selects inward/self scope: represented information transformed while
      retained within one reference entity and no other Data-family column.'
    third_trit: Selects the completed phase of the same information process while
      leaving runtime truth status, quality, fidelity, acknowledgment, observer knowledge,
      tense, probability, and scheduling separate.
  inclusion_boundary: Includes only the completed internal data transformation as
    a substrate-neutral process affecting represented information at inward scope.
    The process transforms represented information within one entity and does not
    require a distinct target. The algorithm, input entity, output entity, and physical
    realization remain separate. It is neutral about physical medium, participant
    intent, semantic truth, success quality, persistence, access, observation, scheduling,
    probability, timing, and cause.
  excluded_meanings:
  - The datum, target reference, or shared dataset as an entity, and its persistent,
    manifest, or dormant status.
  - The specific encoding, schema, algorithm, checksum, fidelity, consistency result,
    conflict policy, acknowledgment, or success criterion.
  - Physical signal, medium, energy, spatial displacement, storage device, or material
    change realizing the information process.
  - Communicative intent, sender or addressee role, message uptake, dialogue, social
    linkage, belief, understanding, attention, or observation.
  - Creation of novel content, restoration to an acceptable prior state, structural
    reconfiguration, warning, fault, authority, or ownership.
  - Capability, access, permission, intention, plan, readiness, queue, schedule, future
    time, possibility, necessity, probability, or cause.
  nearest_neighbors:
  - DAT:101
  - DAT:102
  - DAT:110
  - DAT:120
  - DAT:000
  - DAT:200
  same_family_contrast: "`DAT:0xx` owns information entities and their persistent,
    manifest, or dormant status. `DAT:1xx` owns only transformations, target transfers,
    and systemic synchronizations of represented information. `DAT:2xx` remains reserved
    for information-process affordances or relations. A manifest datum does not entail
    a process, and a completed process does not entail persistence, fidelity, acknowledgment,
    or future accessibility. Completed, active, and nonactualized are mutually exclusive
    phases for the same bounded information process at one reference time. Lexical
    nonactualization states only that the typed process is not actualized; runtime
    `[2]/num` separately marks uncertainty about any selected phase."
  cross_family_comparisons: &1
    LIF: LIF owns living identities, biological conditions, agents, and social collectives.
      A living agent may transform, transfer, or synchronize information, but DAT:1xx
      does not encode the agent's life, role, health, or agency.
    MOV: MOV owns spatial position, path, displacement, and movement. Information
      transfer may accompany motion of a physical carrier, but DAT:1xx changes information
      location or state rather than asserting spatial displacement.
    MAT: MAT owns substance, energy, force, contact, and material change. A physical
      signal or storage medium may realize a DAT process, but DAT:1xx does not encode
      the material carrier, energy transfer, or physical mechanism.
    MIN: MIN owns mental state, attention, belief, interpretation as cognition, and
      cognitive change. DAT transformation may encode or decode represented information,
      but it does not assert understanding, belief revision, awareness, or attention.
    CON: CON owns participant linkage, communication acts, interaction, and social
      exchange. Target data transfer can be a component of communication, but it does
      not entail a sender's communicative intent, an addressee role, uptake, dialogue,
      or social relation.
    WRN: WRN owns hazards, faults, warnings, and adverse states. Corrupt, missing,
      delayed, or inconsistent data may ground a warning, but DAT:1xx does not itself
      assert error, danger, failure, or harm.
    STR: STR owns arrangements, boundaries, component relations, and structural transitions.
      A data schema or topology may constrain a DAT process, but the process does
      not itself assert structural membership, containment, reconfiguration, or boundary
      crossing.
    REP: REP owns restoration conditions, restorative processes, and restorative affordances.
      Restoring a dataset may use transfer or synchronization, but DAT:1xx does not
      entail recovery, return to a prior acceptable state, or repair success.
    LOG: LOG owns formal constraints, evaluations, and evaluation affordances. A DAT
      process may supply inputs or record outputs for a LOG evaluation, but it does
      not itself judge admissibility, truth, consistency, or validity.
    CRE: CRE owns coming-into-being, productive transformation, and generation. DAT:100–102
      transforms an existing information representation; asserting creation of a new
      artifact or novel content requires CRE or a compound.
    ORI: ORI owns temporal, modal, causal, and ontological orientation. Scheduling,
      intention, possibility, necessity, future placement, and causal explanation
      of a DAT process require ORI or compounds; lexical nonactualization encodes
      none of them.
  runtime_state_interpretation:
    '0': Denies that this internal data transformation completed; it does not assert
      that the active sibling is still running, that the nonactualized sibling holds,
      or that the result had either polarity.
    '1': Affirms completion of this internal data transformation, without asserting
      success quality, fidelity, persistence, acknowledgment, physical transport,
      communication uptake, or later availability.
    2/num: Leaves unresolved whether this completed internal data transformation claim
      holds; runtime uncertainty does not change the lexical root into active or nonactualized
      phase.
  lexical_runtime_distinction: Lexical third trit `0` permanently selects the completed
    phase of this information process. Runtime `[2]/num` instead leaves the already-selected
    phase claim unresolved; it never changes process phase. Thus a nonactualized root
    affirmed with `[1]` is a confirmed typed-but-nonactualized data process, while
    a completed or active root carrying `[2]/num` remains lexically completed or active
    but uncertain as a token claim.
