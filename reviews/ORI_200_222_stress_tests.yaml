---
metadata:
  title: ORI:200–222 English coverage and routing tests
  status: review_evidence_not_translation_dictionary
  range: ORI:200–222
  test_count: 115
  no_forced_atomization: true
tests:
- test_id: ORI2-T001
  english_concept: capacity
  routing: one_root_or_compound
  analysis: Choose the inward source-capacity triplet only for ontological grounding
    capacity; typed physical, mental, or productive capacities remain elsewhere.
- test_id: ORI2-T002
  english_concept: can ground
  routing: one_root
  analysis: ORI:20x states source-grounding capacity with lexical status selected
    by the third trit.
- test_id: ORI2-T003
  english_concept: persistent capacity
  routing: one_root
  analysis: ORI:200 asserts standing source-grounding capacity independent of present
    operation.
- test_id: ORI2-T004
  english_concept: capacity now operative
  routing: one_root
  analysis: ORI:201 asserts present operation of source-grounding capacity.
- test_id: ORI2-T005
  english_concept: latent capacity
  routing: one_root
  analysis: ORI:202 asserts belonging without present operation.
- test_id: ORI2-T006
  english_concept: depends on
  routing: one_root_or_compound
  analysis: ORI:21x applies only when the dependency concerns what may obtain in the
    relevant reality.
- test_id: ORI2-T007
  english_concept: necessary condition
  routing: one_root_or_compound
  analysis: ORI:210 may state persistent target-ground dependence; logical necessity
    requires LOG.
- test_id: ORI2-T008
  english_concept: operative precondition
  routing: one_root
  analysis: ORI:211 states that a target is presently conditioned on a specified ground.
- test_id: ORI2-T009
  english_concept: latent precondition
  routing: one_root
  analysis: ORI:212 states a dependence belonging without present operation.
- test_id: ORI2-T010
  english_concept: world law
  routing: one_root_or_compound
  analysis: ORI:22x states ontological applicability while LOG supplies formal content.
- test_id: ORI2-T011
  english_concept: persistent world constraint
  routing: one_root
  analysis: ORI:220 states a standing shared-world constraint.
- test_id: ORI2-T012
  english_concept: constraint now operative
  routing: one_root
  analysis: ORI:221 states a shared-world constraint governing current cases.
- test_id: ORI2-T013
  english_concept: dormant law
  routing: one_root_or_compound
  analysis: ORI:222 states latent shared-world constraint; LOG may state the rule
    text.
- test_id: ORI2-T014
  english_concept: cause
  routing: compound_or_reserved
  analysis: Causal mechanism is stronger than ontological grounding and requires typed
    mechanism or later relation.
- test_id: ORI2-T015
  english_concept: causal power
  routing: different_family_or_compound
  analysis: MAT, CRE, LIF, or WRN supplies the mechanism; ORI may state source-grounding
    capacity separately.
- test_id: ORI2-T016
  english_concept: causal dependence
  routing: compound
  analysis: ORI target-ground dependence combines with a typed causal mechanism.
- test_id: ORI2-T017
  english_concept: causal network
  routing: compound
  analysis: Use ORI grounding/dependence plus STR topology and typed mechanisms.
- test_id: ORI2-T018
  english_concept: provenance
  routing: compound_or_later_specialization
  analysis: Historical derivation requires temporal and representational structure
    beyond this block.
- test_id: ORI2-T019
  english_concept: authorship
  routing: different_family_or_compound
  analysis: CRE, LIF, and CON own production, agent role, and attribution.
- test_id: ORI2-T020
  english_concept: origin
  routing: ambiguous_compound
  analysis: Origin may mean source condition, establishment, relation, time, cause,
    or provenance and must be disambiguated.
- test_id: ORI2-T021
  english_concept: possible
  routing: grammar_or_compound
  analysis: Unrestricted modality is not any one ORI:2xx root.
- test_id: ORI2-T022
  english_concept: necessary
  routing: grammar_or_compound
  analysis: Necessity may qualify an ORI relation but is not identical to persistent
    status.
- test_id: ORI2-T023
  english_concept: contingent
  routing: grammar_or_compound
  analysis: Contingency is a modal qualification, not lexical latency.
- test_id: ORI2-T024
  english_concept: possible world
  routing: compound
  analysis: Combine a shared-world condition with explicit modal accessibility; ORI:222
    alone is only a latent constraint.
- test_id: ORI2-T025
  english_concept: actual world
  routing: one_root_or_context
  analysis: Use ORI shared-world condition with discourse context; ORI:221 is an operative
    constraint, not the world itself.
- test_id: ORI2-T026
  english_concept: counterfactual world
  routing: compound_or_later_specialization
  analysis: Requires world identity and modal accessibility beyond this atomic block.
- test_id: ORI2-T027
  english_concept: probability
  routing: different_family_or_grammar
  analysis: Probability qualifies a claim or distribution and is not an ontological
    relation.
- test_id: ORI2-T028
  english_concept: future possibility
  routing: compound
  analysis: Futurity and modality remain explicit; lexical latency encodes neither.
- test_id: ORI2-T029
  english_concept: scheduled dependency
  routing: compound
  analysis: Scheduling is temporal or programmatic; ORI states only ontological dependence
    if present.
- test_id: ORI2-T030
  english_concept: database dependency
  routing: different_family
  analysis: DAT owns record references and data dependencies.
- test_id: ORI2-T031
  english_concept: foreign key
  routing: different_family
  analysis: Use DAT and LOG unless the referents themselves have ontological dependence.
- test_id: ORI2-T032
  english_concept: software dependency
  routing: different_family
  analysis: STR/DAT/LOG owns package and module dependencies.
- test_id: ORI2-T033
  english_concept: dependency injection
  routing: compound_or_metaphor
  analysis: STR/LOG states implementation; ORI applies only to modeled ontological
    dependence.
- test_id: ORI2-T034
  english_concept: structural support
  routing: different_family
  analysis: STR owns architectural support and arrangement.
- test_id: ORI2-T035
  english_concept: physical support
  routing: different_family
  analysis: MAT owns load-bearing and physical force.
- test_id: ORI2-T036
  english_concept: biological capacity
  routing: different_family
  analysis: LIF owns living function and capability.
- test_id: ORI2-T037
  english_concept: mental ability
  routing: different_family
  analysis: MIN owns cognitive capacity, skill, and ability.
- test_id: ORI2-T038
  english_concept: permission
  routing: different_family
  analysis: CON owns authority and permission.
- test_id: ORI2-T039
  english_concept: affordance
  routing: compound
  analysis: Use the relevant family capability plus ORI only for ontological grounding
    capacity.
- test_id: ORI2-T040
  english_concept: production capability
  routing: different_family_or_compound
  analysis: CRE owns generative capability; ORI may state ontological grounding separately.
- test_id: ORI2-T041
  english_concept: logical entailment
  routing: different_family
  analysis: LOG owns entailment among propositions.
- test_id: ORI2-T042
  english_concept: satisfiable model
  routing: different_family_or_compound
  analysis: LOG owns satisfiability; ORI may separately qualify model-relative reality.
- test_id: ORI2-T043
  english_concept: invariant
  routing: compound
  analysis: LOG defines the invariant while ORI:220 may state standing world applicability.
- test_id: ORI2-T044
  english_concept: natural law
  routing: compound
  analysis: LOG supplies law content and ORI:22x supplies ontological applicability.
- test_id: ORI2-T045
  english_concept: social law
  routing: different_family_or_compound
  analysis: CON and LOG own authority and rule; it is not automatically a world constraint.
- test_id: ORI2-T046
  english_concept: constraint propagation
  routing: different_family
  analysis: LOG/STR owns algorithmic propagation; ORI:221 is ontological applicability.
- test_id: ORI2-T047
  english_concept: configuration profile
  routing: compound
  analysis: DAT/STR stores the profile; ORI:222 may qualify a latent world constraint
    only if ontology is intended.
- test_id: ORI2-T048
  english_concept: feature flag
  routing: different_family
  analysis: DAT/LOG owns software activation flags.
- test_id: ORI2-T049
  english_concept: persistent and operative relation
  routing: two_compatible_roots
  analysis: Persistent standing and present operation may be jointly asserted.
- test_id: ORI2-T050
  english_concept: persistent and latent relation
  routing: two_compatible_roots
  analysis: A persistent relation may currently be latent.
- test_id: ORI2-T051
  english_concept: operative and latent relation
  routing: invalid_same_reference_claim
  analysis: Operation and latency are mutually exclusive at one reference time.
- test_id: ORI2-T052
  english_concept: latent relation affirmed
  routing: runtime_and_lexical
  analysis: ORI:2x2[1] confirms latent membership without present operation.
- test_id: ORI2-T053
  english_concept: operative relation uncertain
  routing: runtime_and_lexical
  analysis: ORI:2x1[2]/num remains lexically operative while the token claim is unresolved.
- test_id: ORI2-T054
  english_concept: persistent relation denied
  routing: runtime_and_lexical
  analysis: ORI:2x0[0] denies persistence without selecting operation or latency.
- test_id: ORI2-T055
  english_concept: unknown relation
  routing: runtime_or_epistemic
  analysis: Use runtime [2]/num or MIN/DAT evidence; lexical latency never means unknown.
- test_id: ORI2-T056
  english_concept: relation became operative
  routing: process_plus_relation
  analysis: Use an ORI:1xx transition or other process plus the operative relation.
- test_id: ORI2-T057
  english_concept: relation ceased
  routing: process_or_gap
  analysis: Cessation is not encoded by denial or latency alone and may require process
    grammar.
- test_id: ORI2-T058
  english_concept: world law changed
  routing: process_plus_relation
  analysis: ORI:12x states shared-world transition and ORI:22x states the resulting
    constraint.
- test_id: ORI2-T059
  english_concept: world law represented
  routing: compound
  analysis: DAT represents the law; ORI states applicability only if separately intended.
- test_id: ORI2-T060
