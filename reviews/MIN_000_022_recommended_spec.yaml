      high: represented target when present
      sustained: shared cognitive community or interpretive frame when present
    use_status: must_not_use_this_min_root
    analysis: Identity itself is LIF, not a mental representation of identity.
  future_compound_decomposition_sketches_not_canonical:
  - MIN:000 + sensory/modality modifier → visual, auditory, proprioceptive, propositional,
