metadata:
  title: MIN:000–022 recommended permanent semantic specifications
  status: ready_for_delegated_approval_not_yet_canonical
  review_scope: MIN:000–022 only
  semantic_architecture: self-representation → target representation → shared cognitive
    schema
  lexical_expression_axis: persistent → manifest → latent
  delegated_approval_authorized: true
  roots_canonicalized: []
  stop_boundary:
  - MIN:100–122
  - any other root block
  - Gate 4
  - translator implementation
block_invariant: The 0xx Mind layer names cognitive representations as entities or
  conditions. The second trit selects self, target, or shared scope; the third selects
  persistent, presently manifest, or latent expression.
triplet_contrasts:
- range: MIN:000–002
  shared_axis: representation of the cognizer's own identity or condition
  contrast: persistent across episodes / presently manifest / persisting but not manifest
- range: MIN:010–012
  shared_axis: representation of a distinct target
  contrast: persistent across episodes / presently manifest / persisting but not manifest
- range: MIN:020–022
  shared_axis: representation held across multiple cognizers
  contrast: persistent across episodes / presently manifest among them / persisting
    but not manifest among them
roots:
