    runtime_state: 1
    contour: declarative
    role_registers:
      low: cognizer or focal mental bearer
      middle: MIN representation predicate
      high: represented target when present
      sustained: shared cognitive community or interpretive frame when present
    use_status: valid
    analysis: Body geometry may be added with MAT/STR.
  - category: temporal_or_sequential
    semantic_graph: MIN:000[1](COGNIZER=agent,ACROSS=sessions)
    literal_gloss: agent; self-representation persists across sessions
    natural_english: The agent keeps the same self-model across restarts.
    runtime_state: 1
    contour: declarative
    role_registers:
      low: cognizer or focal mental bearer
      middle: MIN representation predicate
      high: represented target when present
      sustained: shared cognitive community or interpretive frame when present
    use_status: valid
    analysis: Persistence is lexical; storage mechanism is external.
  - category: cross_family_compound
    semantic_graph: LIF(IDENTITY=person)+MIN:000[1](COGNIZER=person,CONTENT=self)
    literal_gloss: living identity plus persistent representation of that identity
    natural_english: The person has an enduring mental model of who they are.
    runtime_state: 1
    contour: declarative
    role_registers:
      low: cognizer or focal mental bearer
      middle: MIN representation predicate
      high: represented target when present
      sustained: shared cognitive community or interpretive frame when present
    use_status: valid
    analysis: LIF owns identity; MIN owns its representation.
  - category: executable_or_programming
    semantic_graph: MIN:000[1](COGNIZER=agent,CONTENT=self_model)
    literal_gloss: agent; persistent cognitive self-model
    natural_english: The agent maintains a persistent representation of itself.
    runtime_state: 1
    contour: declarative
    role_registers:
      low: cognizer or focal mental bearer
      middle: MIN representation predicate
      high: represented target when present
      sustained: shared cognitive community or interpretive frame when present
    use_status: valid
    analysis: A semantic object in an agent model.
    pseudocode: assert agent.self_model.persists_across_episodes?
  - category: counterexample
    semantic_graph: LIF:000[1](ENTITY=person)
    literal_gloss: person; enduring living identity
    natural_english: The person continues to be the same individual.
    runtime_state: 1
