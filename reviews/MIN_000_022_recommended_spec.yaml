  proposal_status: recommended_for_delegated_approval_not_yet_canonical
  proposed_title: persistent self-representation
  invariant_definition: A mental representation of the cognizer's own identity or
    condition that persists across cognitive episodes.
  semantic_center: self-representation
  semantic_boundaries:
  - Includes one cognitive representation at the address's self, target, or shared
    scope.
  - Allows propositional, imagistic, sensory, conceptual, procedural, or model-like
    content without selecting one representational format.
  - Does not assert truth, accuracy, certainty, origin, storage medium, communication,
    learning, attention allocation, or physical realization.
  - The lexical expression is persistent and remains distinct from runtime state.
  excluded_meanings:
  - The act of perceiving, remembering, learning, interpreting, or reasoning belongs
    to MIN:1xx and remains provisional until separately reviewed.
  - Competence, attention capacity, belief relation, uncertainty, and distributed
    intelligence belong to MIN:2xx and remain provisional until separately reviewed.
  - Living identity and consciousness belong to LIF; neural or sensory substrate belongs
    to MAT.
  - Communication, consensus procedure, access, and social tradition belong to CON
    or compounds.
  - External records, symbols, models, and archives belong to DAT/STR unless cognitive
    representation is separately asserted.
  - Truth, proof, probability, formal proposition, and ontological reality belong
    to LOG/ORI or grammar.
  - Error, hallucination, bias, forgetting, and cognitive damage require WRN/REP or
    explicit compounds.
  nearest_neighbors:
    same_triplet: MIN:000–MIN:002
    same_triplet_0: MIN:000
    same_triplet_1: MIN:001
    same_triplet_2: MIN:002
    same_phase_other_scopes:
    - MIN:010
    - MIN:020
    future_min_process_layer: MIN:100–122 owns cognitive events after separate review;
      this root is not an event.
    future_min_relation_layer: MIN:200–222 owns capacities and relations after separate
      review; this root is not a capacity or belief relation.
    canonical_dat_boundary: DAT remains provisional, but its family owns external
      information records rather than cognition.
  address_explanation:
    first_trit_0: Selects a mental entity or condition—the representation—not the
      process that produced, accessed, or changed it.
    second_trit_0: Selects the cognizer's representation of the cognizer's own identity
      or condition.
    third_trit_0: Selects a persistent representation that remains stable across cognitive
      episodes.
  runtime_state_interpretations:
    '0': Denies that the cognizer has the specified self-representation in the lexical
      persistent condition.
    '1': Affirms that the cognizer has the specified self-representation in the lexical
      persistent condition.
    '2': Marks the assertion about the persistent self-representation as dormant or
      unresolved; it does not select another lexical address.
  lexical_third_trit_vs_runtime_2: The third lexical trit permanently selects the
    persistent form of self-representation. Runtime `[2]/num` separately qualifies
    a token's current assertion status; it never changes the root to another lexical
    phase, adds future time, or duplicates lexical latency.
  cross_family_comparisons:
    LIF: LIF owns living identity, consciousness, vitality, and organism status. `MIN:000`
      owns self-representation as cognitive content, never the bearer or identity
      itself.
    MOV: MOV owns literal position and motion. Attention shifts and mental maps may
      use motion metaphors, but `MIN:000` does not encode displacement.
    MAT: MAT owns neural substrate, sensory energy, and physical-state change. `MIN:000`
      owns the representation realized by or about those states.
    CON: CON owns communication, access, possession, social linkage, and participant
      transfer. Shared access or messaging does not guarantee self-representation.
    STR: STR owns form, topology, organization, and formal schema structure. `MIN:000`
      requires cognitive representation in cognizers, not merely an organized artifact.
    WRN: WRN owns error, confusion, danger, corruption, and failure judgments. A representation
      may be false or biased without `MIN:000` encoding error.
    REP: REP owns restoration and recovery. Recall or rehabilitation may restore access
      to a representation, but `MIN:000` names the representational entity or condition.
    LOG: LOG owns formal propositions, truth functions, proof, rules, and quantified
      constraints. `MIN:000` may be nonpropositional, false, vague, or imagistic.
    DAT: DAT owns records, symbols, messages, and stored information. A record can
      exist without a cognizer; `MIN:000` requires cognitive content.
    CRE: CRE owns designing, imagining as generation, and creating artifacts or forms.
      A created idea can become self-representation, but creation is not built into
      `MIN:000`.
    ORI: ORI owns reality, ontological identity, necessity, and universal law. Representation
      does not entail that its content is real or true.
  examples:
  - category: ordinary_conversation
    semantic_graph: MIN:000[1](COGNIZER=I,CONTENT=self_as_teacher)
    literal_gloss: I; persistent self-representation as teacher
    natural_english: I still think of myself as a teacher.
    runtime_state: 1
    contour: declarative
    role_registers:
