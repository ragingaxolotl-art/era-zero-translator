---
metadata:
  title: DAT:200–222 English coverage and routing tests
  status: review_evidence_not_translation_dictionary
  range: DAT:200–222
  test_count: 125
  no_forced_atomization: true
tests:
- test_id: DAT2-T001
  english_concept: transformable data
  routing: one_root
  analysis: DAT:200–202 asserts a typed capacity for represented information within
    one entity to undergo internal transformation.
- test_id: DAT2-T002
  english_concept: encodable
  routing: one_root_or_compound
  analysis: Internal transformability can support encoding, while a specific codec
    and losslessness remain separate.
- test_id: DAT2-T003
  english_concept: decodable
  routing: one_root_or_compound
  analysis: Internal transformability can support decoding without entailing access,
    comprehension, or successful output.
- test_id: DAT2-T004
  english_concept: compressible
  routing: one_root_or_compound
  analysis: Compression capability combines DAT transformability with an algorithm
    and possibly a size relation.
- test_id: DAT2-T005
  english_concept: writable
  routing: ambiguous_compound
  analysis: Writability may mean internal transformability or target transferability
    depending on roles; permission and storage medium remain separate.
- test_id: DAT2-T006
  english_concept: readable
  routing: ambiguous_compound
  analysis: Readability can require transformability, transferability, representation
    compatibility, and an observer; do not force it into one atom.
- test_id: DAT2-T007
  english_concept: retrievable
  routing: compound_or_later_specialization
  analysis: Retrievability requires source selection, access, and transfer toward
    a requester beyond generic transferability.
- test_id: DAT2-T008
  english_concept: accessible
  routing: compound_or_different_family
  analysis: Access adds an accessor, permission or reachability relation; DAT:2xx
    alone asserts only process enablement.
- test_id: DAT2-T009
  english_concept: permitted to read
  routing: compound
  analysis: CON/LIF/LOG supplies authority and policy; DAT supplies the relevant information
    affordance.
- test_id: DAT2-T010
  english_concept: data transferable
  routing: one_root
  analysis: DAT:210–212 states an information-transfer relation from one source context
    to one distinct target.
- test_id: DAT2-T011
  english_concept: target reachable for data
  routing: one_root_or_compound
  analysis: DAT transferability may combine with CON or MOV reachability; physical
    or social reachability is not identical to it.
- test_id: DAT2-T012
  english_concept: stream-capable
  routing: compound_or_later_specialization
  analysis: Streaming capability combines transferability with temporal continuity
    and throughput constraints.
- test_id: DAT2-T013
  english_concept: copyable to a target
  routing: one_root_or_compound
  analysis: Target transferability supports copying, but source retention and duplication
    policy remain separate.
- test_id: DAT2-T014
  english_concept: movable to a target
  routing: compound
  analysis: Destructive move requires transferability plus explicit source removal;
    transferability alone is neutral.
- test_id: DAT2-T015
  english_concept: broadcast-capable
  routing: compound
  analysis: Broadcast requires one-to-many communication structure in addition to
    target transferability.
- test_id: DAT2-T016
  english_concept: channel available
  routing: different_family_or_compound
  analysis: CON owns the communication channel; channel availability may realize but
    does not equal DAT transferability.
- test_id: DAT2-T017
  english_concept: bandwidth sufficient
  routing: compound
  analysis: Bandwidth and resource sufficiency qualify operative transferability but
    are not its invariant meaning.
- test_id: DAT2-T018
  english_concept: synchronizable data
  routing: one_root
  analysis: DAT:220–222 states capacity for coordinated alignment across multiple
    participants under one criterion.
- test_id: DAT2-T019
  english_concept: replication-capable
  routing: one_root_or_compound
  analysis: Systemic synchronizability supports replication, while topology and replica
    policy remain separate.
- test_id: DAT2-T020
  english_concept: mergeable replicas
  routing: compound_or_later_specialization
  analysis: Mergeability combines synchronizability with a conflict-resolution rule
    and data structure.
- test_id: DAT2-T021
  english_concept: convergent
  routing: result_or_guarantee
  analysis: Convergence is a result or guarantee under a criterion, not generic synchronizability.
- test_id: DAT2-T022
  english_concept: eventually consistent
  routing: compound
  analysis: Synchronizability plus an ORI eventuality and LOG consistency criterion
    expresses eventual consistency.
- test_id: DAT2-T023
  english_concept: interoperable
  routing: compound_or_later_specialization
  analysis: Interoperability may require transformability, transferability, synchronizability,
    shared schemas, and structural compatibility.
- test_id: DAT2-T024
  english_concept: replicas agree
  routing: result_not_affordance
  analysis: Agreement is an information-state result; synchronizability alone entails
    no current agreement.
- test_id: DAT2-T025
  english_concept: data has integrity
  routing: result_or_relation
  analysis: Integrity is a quality under a criterion, not the capacity to transform,
    transfer, or synchronize.
- test_id: DAT2-T026
  english_concept: data has provenance
  routing: reserved_relation
  analysis: Provenance is historical or causal attribution and remains separate from
    data-process affordance.
- test_id: DAT2-T027
  english_concept: reference resolves
  routing: reserved_relation_or_process
  analysis: Reference resolution concerns a target-denoting datum and a resolution
    process, not the general affordance cube.
- test_id: DAT2-T028
  english_concept: link exists
  routing: entity_or_relation
  analysis: DAT:010–012 may represent target-denoting information; a link does not
    entail transferability.
- test_id: DAT2-T029
  english_concept: recoverable data
  routing: compound_or_different_family
  analysis: Recovery requires REP restoration semantics plus relevant DAT affordances
    and records.
- test_id: DAT2-T030
  english_concept: possible data operation
  routing: different_family
  analysis: ORI owns unrestricted possibility; DAT:2xx asserts a specific existing
    typed affordance.
- test_id: DAT2-T031
  english_concept: data process running
  routing: process_layer
  analysis: DAT:1xx owns actual process phase; DAT:2xx only states capacity or qualifying
    relation.
- test_id: DAT2-T032
  english_concept: data process completed
  routing: process_layer
  analysis: DAT:1x0 owns completion; affordance alone entails no actual process or
    result.
- test_id: DAT2-T033
  english_concept: datum exists
  routing: entity_layer
  analysis: DAT:0xx owns information entity identity; a datum may lack an operative
    processing affordance.
- test_id: DAT2-T034
  english_concept: datum is manifest
  routing: entity_layer
  analysis: DAT:0x1 owns manifestation; manifestation does not entail transformability
    or transferability.
- test_id: DAT2-T035
  english_concept: algorithm exists
  routing: compound
  analysis: DAT or CRE may represent or create an algorithm; its existence may realize
    an affordance but is not identical to it.
- test_id: DAT2-T036
  english_concept: resources available
  routing: compound
  analysis: MAT, DAT, or STR owns resources; availability may realize operative status
    but is not the affordance itself.
- test_id: DAT2-T037
  english_concept: persistent internal data transformability
  routing: one_root
  analysis: DAT:200 preserves internal transformability independently of current operation.
- test_id: DAT2-T038
  english_concept: operative internal data transformability
  routing: one_root
  analysis: DAT:201 states that internal transformability is presently operative.
- test_id: DAT2-T039
  english_concept: latent internal data transformability
  routing: one_root
  analysis: DAT:202 states that transformability exists without being presently operative.
- test_id: DAT2-T040
  english_concept: persistent source-target data transferability
  routing: one_root
  analysis: DAT:210 preserves one source-target transfer relation independently of
    present operation.
- test_id: DAT2-T041
  english_concept: operative source-target data transferability
  routing: one_root
  analysis: DAT:211 states that one source-target transfer relation presently enables
    transfer.
- test_id: DAT2-T042
  english_concept: latent source-target data transferability
  routing: one_root
  analysis: DAT:212 states that the transfer relation exists without presently enabling
    transfer.
- test_id: DAT2-T043
  english_concept: persistent systemic data synchronizability
  routing: one_root
  analysis: DAT:220 preserves synchronizability across participants independently
    of present operation.
- test_id: DAT2-T044
  english_concept: operative systemic data synchronizability
  routing: one_root
  analysis: DAT:221 states that the systemic synchronization capacity is presently
    operative.
- test_id: DAT2-T045
  english_concept: latent systemic data synchronizability
  routing: one_root
  analysis: DAT:222 states that the systemic capacity exists without being presently
    operative.
- test_id: DAT2-T046
  english_concept: persistent plus operative transformability
  routing: two_compatible_roots
  analysis: DAT:200 and DAT:201 may co-occur because persistent identity is neutral
    about current operation.
- test_id: DAT2-T047
  english_concept: persistent plus latent transformability
  routing: two_compatible_roots
  analysis: DAT:200 and DAT:202 may co-occur while the capacity is nonoperative.
- test_id: DAT2-T048
  english_concept: operative and latent transformability simultaneously
  routing: invalid_same_reference_claim
  analysis: DAT:201 and DAT:202 are mutually exclusive for the same capacity at one
    reference time.
- test_id: DAT2-T049
  english_concept: persistent plus operative transferability
  routing: two_compatible_roots
  analysis: DAT:210 and DAT:211 may co-occur because persistence and current operation
    are independent claims.
- test_id: DAT2-T050
  english_concept: persistent plus latent transferability
  routing: two_compatible_roots
  analysis: DAT:210 and DAT:212 may co-occur while the relation is nonoperative.
- test_id: DAT2-T051
  english_concept: operative and latent transferability simultaneously
  routing: invalid_same_reference_claim
  analysis: DAT:211 and DAT:212 are mutually exclusive at one reference time.
- test_id: DAT2-T052
  english_concept: persistent plus operative synchronizability
  routing: two_compatible_roots
  analysis: DAT:220 and DAT:221 may co-occur because persistent identity is neutral
    about current operation.
- test_id: DAT2-T053
  english_concept: persistent plus latent synchronizability
  routing: two_compatible_roots
  analysis: DAT:220 and DAT:222 may co-occur while the systemic capacity is nonoperative.
- test_id: DAT2-T054
  english_concept: operative and latent synchronizability simultaneously
  routing: invalid_same_reference_claim
  analysis: DAT:221 and DAT:222 are mutually exclusive at one reference time.
- test_id: DAT2-T055
  english_concept: latent data affordance affirmed
  routing: runtime_and_lexical
  analysis: DAT:202/212/222[1] affirms an existing nonoperative affordance without
    uncertainty or future time.
- test_id: DAT2-T056
  english_concept: operative data affordance uncertain
  routing: runtime_and_lexical
  analysis: DAT:201/211/221[2]/num leaves current operation unresolved while preserving
    the operative lexical selection.
- test_id: DAT2-T057
  english_concept: persistent data affordance denied
  routing: runtime_and_lexical
  analysis: Runtime [0] denies persistent identity without selecting the operative
    or latent sibling.
- test_id: DAT2-T058
  english_concept: unknown data affordance
  routing: runtime_or_epistemic
  analysis: Use runtime [2]/num or MIN/DAT evidence; lexical latency does not mean
    unknown.
- test_id: DAT2-T059
  english_concept: hidden transferability
  routing: compound
  analysis: DAT:212 supplies nonoperation only; MIN or DAT evidence separately states
    that observers have not discovered the relation.
- test_id: DAT2-T060
  english_concept: scheduled activation
  routing: compound
  analysis: A latent DAT affordance plus ORI and schedule data may describe activation;
    latency never means scheduled.
- test_id: DAT2-T061
  english_concept: data affordance versus entity
  routing: scope_resolution_test
  analysis: DAT:2xx owns enablement while DAT:0xx owns the information entity.
- test_id: DAT2-T062
  english_concept: data affordance versus process
  routing: scope_resolution_test
  analysis: DAT:2xx owns enablement while DAT:1xx owns actual processing by phase.
- test_id: DAT2-T063
  english_concept: transformability versus understanding
  routing: scope_resolution_test
  analysis: MIN owns comprehension; represented information can be transformable without
    being understood.
- test_id: DAT2-T064
  english_concept: transferability versus communication
  routing: scope_resolution_test
  analysis: DAT owns information transfer enablement while CON owns participant channel,
    intent, and uptake.
- test_id: DAT2-T065
  english_concept: transferability versus physical reachability
  routing: scope_resolution_test
  analysis: MOV/MAT owns carrier paths and movement; DAT owns information-state transfer
    enablement.
- test_id: DAT2-T066
  english_concept: synchronizability versus consistency
  routing: scope_resolution_test
  analysis: Synchronizability is capacity for alignment; LOG or a result claim states
    consistency.
- test_id: DAT2-T067
  english_concept: synchronizability versus restoration
  routing: scope_resolution_test
  analysis: DAT enables alignment while REP owns return to an acceptable prior state.
- test_id: DAT2-T068
  english_concept: data affordance versus general possibility
  routing: scope_resolution_test
  analysis: DAT:2xx asserts a specific existing affordance; ORI owns unrestricted
    possibility, necessity, and probability.
- test_id: DAT2-T069
  english_concept: one source transferable to many unrelated targets
  routing: multiple_relations
  analysis: Use separate DAT:21x claims unless a shared synchronization criterion
    establishes DAT:22x.
- test_id: DAT2-T070
  english_concept: common schema without synchronizability
  routing: entity_or_rule_not_affordance
  analysis: A shared schema may exist even when participants cannot presently or persistently
    synchronize.
- test_id: DAT2-T071
  english_concept: network reachability only
  routing: different_family
  analysis: CON or MOV reachability may implement transfer but does not by itself
    entail DAT transferability.
