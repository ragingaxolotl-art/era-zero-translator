  later_era_notes: Later eras may lexicalize speak, tell, publish, send, hear, receive,
    deliver, notify, broadcast, multicast, subscribe, acknowledge, converse, negotiate,
    and transport as descendants or compounds. Era Zero must preserve the source-expression
