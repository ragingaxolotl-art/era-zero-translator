  proposal_status: canonical_by_delegated_approval
  proposed_title: completed source expression
  invariant_definition: Completion of an act by which a source endpoint makes a communicative
    expression available to an exchange context.
  semantic_center: 'participant-addressed communicative exchange processes: source
    expression, target reception, and shared distribution'
  address_justification:
    first_trit_1: 'Selects a process, action, or transformation: completed source
      expression is an exchange act, not an endpoint/channel entity and not a bond,
      capacity, or compatibility relation.'
    second_trit: 'Selects inward/source scope: it locates the exchange process at
      the originating endpoint and its act of making an expression available without
      changing the content or physical carrier.'
    third_trit: 'Selects the completed process phase: the same exchange act is completed,
      while intention, planning, scheduling, queueing, probability, and future time
      remain outside the lexeme.'
  inclusion_boundary: Includes only the completed participant-addressed act at inward/source
    scope by which a source endpoint makes an expression available. It is neutral
    about the expression's content, physical carrier, protocol, success quality, comprehension,
    response, and later use.
  excluded_meanings:
  - The endpoint, participant, shared channel, device, medium, route, or topology
    as an entity or condition.
  - The message, signal, request, symbol, payload, record, draft, queue item, or protocol
    as content or structure.
  - Physical propagation, movement, transduction, storage, computation, attention,
    interpretation, understanding, agreement, or belief change.
  - Opening, closing, joining, repairing, authenticating, authorizing, scheduling,
    or configuring a channel or endpoint.
  - Intention, readiness, permission, plan, schedule, queue status, probability, certainty,
    futurity, or obligation—especially for lexical 1x2 roots.
  - Reciprocal conversation, acknowledgement, negotiation, consensus, request-response,
    or transport, which require compounds and explicit participant/content relations.
  nearest_neighbors:
  - CON:101
  - CON:102
  - CON:110
  - CON:120
  - CON:000
  - CON:200
  - DAT:100
  - MIN:100
  same_family_contrast: CON:0xx owns the endpoint/channel loci through which exchange
    occurs; CON:1xx owns the expression, reception, and distribution processes themselves;
    CON:2xx remains reserved for capacities, bonds, compatibility, reachability, and
    possible exchange relations.
  cross_family_comparisons: &1
    LIF: LIF identifies living or conscious participants. A being may perform a CON
      exchange process, but life, identity, consciousness, and responsiveness are
      not expression, reception, or distribution.
    MOV: MOV owns physical displacement, approach, traversal, and reference-frame
      change. A message or carrier may move physically, but a communicative exchange
      can occur without lexicalizing spatial motion.
    MAT: MAT owns sound waves, photons, cables, radios, bodies, and other physical
      carriers. CON names the communicative act realized through a carrier, not the
      carrier's physical transmission.
    MIN: MIN owns attention, perception, interpretation, understanding, and belief
      change. Reception ends when an expression is taken up at the target endpoint;
      comprehension requires MIN.
    STR: STR owns topology, containment, interface arrangement, and system transition.
      Opening, joining, or restructuring a channel is not the exchange act itself.
    WRN: WRN owns loss, corruption, failure, spoofing, and danger evaluation. CON
      exchange processes are neutral about success quality except for their completed/ongoing/nonactualized
      lexical phase.
    REP: REP owns restoring a failed endpoint, channel, signal path, or exchange.
      Reconnection and retransmission for repair must compound REP with CON rather
      than redefining CON.
    LOG: LOG owns protocol rules, permissions, turn constraints, validity, acknowledgement
      obligations, and formal coordination. Those rules can govern a CON act without
      becoming that act.
    DAT: DAT owns the message, signal, request, symbol, payload, or record as an information
      object. CON owns making that expression available or taking it up in a participant
      exchange context.
    CRE: CRE owns composing, generating, transforming, or designing content and communication
      systems. Source expression can communicate already-created content and therefore
      must not imply creation.
    ORI: ORI owns existence, time, modality, manifestation, and ontological transition.
      A lexical nonactualized CON process does not silently encode intention, schedule,
      futurity, or probability.
  runtime_state_interpretation:
    '0': States that completion of this source-expression act is false, unavailable
      as a valid result, or not established in the exchange context; it does not assert
      the active or nonactualized sibling.
    '1': Affirms that this source-expression act reached its completed phase in the
      stated exchange context; the result does not entail reception, comprehension,
      response, or endpoint-wide uptake unless separately asserted.
    2/num: Leaves unresolved whether this source-expression act reached completion
      or whether that completion remains a valid result; it does not change the lexical
      process into an active or nonactualized sibling.
  lexical_runtime_distinction: The third lexical trit permanently selects the completed
    member of the source process triplet. Runtime `[2]/num` instead qualifies the
    assertion about that already-selected lexeme. Therefore CON:100[1] affirms a completed
    exchange act, while CON:100[2]/num leaves the assertion about that same completed
    act unresolved.
  examples:
  - category: ordinary_conversation
    semantic_graph: CON:100[1](SOURCE=me,EXPRESSION=greeting,CONTEXT=call)
    literal_gloss: my completed making-available of greeting
    natural_english: I have said my greeting into the call.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source endpoint or initiating participant
      middle: communicative exchange process
      high: target endpoint or receiving participant
      sustained: shared channel or exchange context
    use_status: valid
    analysis: Completion is at source expression, not at target understanding.
  - category: physical_or_spatial
    semantic_graph: CON:001(SOURCE=beacon)+CON:100[1](EXPRESSION=ping)
    literal_gloss: beacon endpoint plus completed source expression
    natural_english: The beacon finished emitting the communicative ping.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source endpoint or initiating participant
      middle: communicative exchange process
      high: target endpoint or receiving participant
      sustained: shared channel or exchange context
    use_status: valid
    analysis: MAT is required if physical wave emission itself matters.
  - category: temporal_or_sequential
    semantic_graph: CON:100[1](SOURCE=operator,BEFORE=reply)
    literal_gloss: source expression completed before reply
    natural_english: The operator finished speaking before the reply began.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source endpoint or initiating participant
      middle: communicative exchange process
      high: target endpoint or receiving participant
      sustained: shared channel or exchange context
    use_status: valid
    analysis: The root supplies the completed source-side phase.
  - category: cross_family_compound
    semantic_graph: CRE(COMPOSE=notice)+DAT(NOTICE=n)+CON:100[1](SOURCE=clerk,EXPRESSION=n)
    literal_gloss: created notice data made available by source
    natural_english: The clerk composed and issued the notice.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source endpoint or initiating participant
      middle: communicative exchange process
      high: target endpoint or receiving participant
      sustained: shared channel or exchange context
    use_status: valid
    analysis: CRE owns composition and DAT owns content.
  - category: executable_or_programming
    semantic_graph: CON:100[1](SOURCE=producer,EXPRESSION=event,CHANNEL=bus)
    literal_gloss: producer completed source expression of event
    natural_english: The producer completed publication of the event to the bus.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: source endpoint or initiating participant
      middle: communicative exchange process
      high: target endpoint or receiving participant
      sustained: shared channel or exchange context
    use_status: valid
    analysis: This does not prove any consumer received it.
    pseudocode: assert(exchange_process.matches?("CON:100"))
  - category: counterexample
    semantic_graph: MIN(UNDERSTAND=listener,OBJECT=greeting)
    literal_gloss: listener understands greeting
    natural_english: The listener understood the greeting.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source endpoint or initiating participant
      middle: communicative exchange process
      high: target endpoint or receiving participant
      sustained: shared channel or exchange context
    use_status: must_not_use_this_root
    analysis: Understanding is MIN, not completed source expression.
  future_compound_examples:
  - CON:100 + DAT supplies the expression, message, signal, request, or payload without
    turning content into a Connection process.
  - CON:100 + CON:0xx identifies the source endpoint, target endpoint, or shared channel
