    analysis:
      why_it_fits: The provisional meanings correctly notice that first-trit 0 names
        a condition or entity and that ORI concerns origin, actuality, and world-level
        order; they also gesture toward inward scope and persistent status.
      useful_coverage: They cover sources, actuality, manifestation, potential, universal
        order, and possible world states.
      semantic_territory_consumed: Across the block they mix source identity, causal
        priority, existence, observability, emergence, logical fact, natural law,
        temporal unfolding, and modal possibility.
      conflicts_or_future_limitations: 'The triplets do not preserve one semantic
        center: third-trit 1 alternates between actuality, emergence, and cosmic change,
        while third-trit 2 alternates between potential, nonmanifestation, and possible
        worlds.'
