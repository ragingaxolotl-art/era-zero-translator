  - candidate_id: modal_world_objects
    title: persistent possible-world origin
    invariant_candidate: A persistent modal-world object at inward scope.
    analysis:
      why_it_fits: ORI naturally hosts actual, possible, necessary, and counterfactual
        worlds and their inhabitants.
      useful_coverage: It would cover possible worlds, actual worlds, counterfactual
        objects, model states, branches, and modal alternatives.
      semantic_territory_consumed: It makes the third trit a modal operator rather
        than stable/active/latent lexical status and overcommits the system to one
        formal semantics.
      conflicts_or_future_limitations: LOG owns formal model evaluation, MIN owns
        imagined alternatives, and later ORI relations should carry possibility or
        necessity without turning every entity into a world object.
