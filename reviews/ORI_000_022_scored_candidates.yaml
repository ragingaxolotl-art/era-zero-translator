    total: 55
    maximum: 80
  - candidate_id: ontological_conditions
    title: persistent source-ground condition
    invariant_candidate: A persistent ontological condition by which one referent
      is grounded as a source from which another state of affairs may originate, independently
      of whether that grounding is presently operative.
    analysis:
      why_it_fits: First-trit 0 remains a condition, the second trit selects source-ground,
        distinct referent, or shared-world scope, and the third changes only persistent,
        occurrent/operative, or latent status.
      useful_coverage: It supports sourcehood, actuality, existence, manifestation,
        dormant membership in a reality, world conditions, simulation states, event
        models, and formal ontology.
      semantic_territory_consumed: 'Only ontological qualification: how a source,
        a distinct referent, or a shared world obtains. Causal links, clocks, propositions,
        observations, physical objects, and productive acts remain separate.'
      conflicts_or_future_limitations: Specific kinds of cause, time, possibility,
        necessity, truth, material realization, and world-law content require ORI
        relation/process roots or cross-family compounds.
    scores:
      atomicity: 10
