    maximum: 80
  - candidate_id: temporal_anchor_states
    title: persistent prior-time anchor
    invariant_candidate: A persistent temporal anchor at inward reference scope.
    analysis:
      why_it_fits: Origin language often organizes states as prior, current, and globally
        synchronized time anchors.
      useful_coverage: It would cover epochs, timestamps, current instants, deferred
        times, clocks, schedules, and global timelines.
      semantic_territory_consumed: It consumes temporal reference and scheduling rather
        than entity or condition status, and the second/third trits would redundantly
        encode time.
      conflicts_or_future_limitations: ORI process and relation layers need room for
        temporal sequence; using the entity layer for clocks would make non-temporal
        ontology difficult.
