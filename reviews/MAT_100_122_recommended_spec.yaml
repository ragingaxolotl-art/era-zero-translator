  proposed_title: completed focal material change
  invariant_definition: Completion of a physical-state change localized within the
    focal material bearer.
  semantic_center: physical-state change
  semantic_boundaries:
  - Includes a change in an intrinsic physical state of matter at the stated observational
    scale.
  - Allows thermal, phase, compositional, chemical, electrical, or mechanical specialization
    without building those subtypes into the atom.
  - Does not require an intentional agent, beneficial or harmful result, transfer
    path, schedule, or named cause.
  - The process locus is focal/inward and the lexical phase is completed.
  excluded_meanings:
  - Position or displacement without intrinsic physical-state change belongs to MOV.
  - Creation purpose belongs to CRE; structural organization to STR; damage to WRN;
    restoration to REP.
  - Mental, informational, logical, social, and ontological changes belong to their
    own families.
  - Matter/energy transport, input, output, circulation, or exchange requires MOV/CON
    roles unless intrinsic physical-state change is also asserted.
  - Scheduling, planning, queueing, readiness, probability, and future certainty are
    never supplied by lexical trit 2.
  - A material entity/condition belongs to MAT:0xx; a capacity or relationship remains
    for MAT:2xx review.
  nearest_neighbors:
    triplet: MAT:100–MAT:102
    same_triplet_completed: MAT:100
