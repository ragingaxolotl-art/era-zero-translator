    - MAT:120
    entity_layer: MAT:0xx describes material bearers/conditions, not change events.
    capacity_relationship_layer: MAT:2xx remains provisional and must not be preempted
      by this process root.
  address_explanation:
    first_trit_1: Selects a process/action/transformation rather than a material entity
      or capacity.
    second_trit_0: 'Localizes the physical-state change within the focal bearer: inward/self/source
      orientation.'
    third_trit_0: 'Selects the completed lexical phase: the change event reached its
      boundary.'
  runtime_state_interpretations:
    '0': Denies or deactivates the claim that the focal/inward physical-state change
      reached completion.
    '1': Affirms that the focal/inward change reached its completion boundary; it
      does not describe the resulting entity state.
    '2': Marks the completion assertion itself as dormant, unavailable, remembered,
      or unresolved. It does not select lexical potential `MAT:102`.
  lexical_third_trit_vs_runtime_2: The third lexical trit permanently selects completed
    physical-state change. Runtime `[2]/num` instead qualifies the current status
    of a token of that already selected lexeme and never inserts planning, scheduling,
    or a different lexical phase.
  cross_family_comparisons:
    LIF: LIF owns living growth, metabolism, vitality, and identity. `MAT:100` owns
      only the completed physical-state change at the focal/inward locus; use a compound
      when a living process has a material realization.
    MOV: MOV owns position and displacement. Matter crossing space or circulating
      without intrinsic physical-state change uses MOV with a material bearer, not
      `MAT:100` alone.
    MIN: MIN owns mental-state change, attention, memory, and learning. A thought
      or perception changing does not select `MAT:100` unless a physical material
      change is separately asserted.
    CON: CON owns communication, transfer relations, access, and participant linkage.
      `MAT:100` does not by itself encode giver, receiver, possession, or transmission.
    STR: STR owns topology, organization, part-whole structure, assembly schema, and
      boundary relations. `MAT:100` owns physical-state change, not abstract or functional
      reorganization.
    WRN: WRN owns damage, hazard, failure, and corruption judgments. A physical change
      is not inherently harmful; combine WRN when the change is damage or risk.
    REP: REP owns restoration and healing as goal-directed return toward a prior or
      viable state. `MAT:100` describes the physical change without restorative purpose.
    LOG: LOG owns scheduling, queueing, control flow, permission, conditions, and
      formal state transitions. Lexical process phase and runtime status do not encode
      those operations.
    DAT: DAT owns information mutation, storage, decoding, and signal flow. A data
      structure changing is not a material process unless its physical storage bearer
      is separately foregrounded.
    CRE: CRE owns intentional generation, design, novel form, and production semantics.
      `MAT:100` may supply physical realization, but it never entails artifact creation
      or purpose.
    ORI: ORI owns ontological becoming, temporal framing, and reality-level transition.
      `MAT:100` is limited to a Matter-family physical-state change in an already
      asserted frame.
