  proposal_status: canonical_by_delegated_approval
  proposed_title: enduring internal reconfiguration capacity
  invariant_definition: A persistent capacity of a reference structure to reassign
    its own constituents among its internal positions while preserving that structure
    as the reference whole.
  semantic_center: 'structural transformation affordance: internal reconfigurability,
    one-target incorporability, and multi-structure integrability'
  address_justification:
    first_trit_2: Selects a structural capacity, qualifying relationship, or unrealized
      possibility rather than a locus/entity or an actual transformation.
    second_trit: 'Selects inward scope: the reference structure''s own constituent
      organization; this root names the affordance for internal reconfiguration capacity
      and no competing family claim.'
    third_trit: Selects persistent or established expression of the same internal
      reconfiguration capacity; runtime truth status, tense, probability, permission,
      and process phase remain separate.
  inclusion_boundary: Includes only the persistent or established substrate-neutral
    structural affordance for internal reconfiguration capacity. The capacity concerns
    reassignment of the structure's own constituents; it neither adds a target nor
    forms a higher-order whole. It may be instantiated in physical, computational,
    organizational, or conceptual structures, but it does not assert that the matching
    STR:1xx transformation occurs, that any STR:0xx arrangement is realized, or that
    material, logical, informational, communicative, reparative, creative, temporal,
    or modal conditions hold.
  excluded_meanings:
  - The constituent position, interface, composite arrangement, constituent, target,
    or system as an entity or condition.
  - An actual internal reconfiguration, target incorporation, or systemic integration
    process at any completion phase.
  - Physical strength, load-bearing, elasticity, energy, contact, attachment force,
    containment, shelter, or material coupling.
  - Set membership, type validity, formal compatibility, permission, authority, governance,
    schema conformance, or specification truth.
  - Repairability, resilience, self-healing, creation, fabrication, deployment, communication,
    coordination, attention, or intention.
  - Probability, readiness, plan, schedule, future time, necessity, unrestricted possibility,
    or guaranteed success.
  nearest_neighbors:
  - STR:201
  - STR:202
  - STR:100
  - STR:101
  - STR:102
  - STR:000
  same_family_contrast: 'STR:0xx names constituent positions, structural interfaces,
    and composite arrangements. STR:1xx names actual transformations of constituent
    organization. STR:2xx names only the corresponding capacity or qualifying relation:
    inward reconfigurability, outward target incorporability, or systemic integrability.
    A capacity or relation does not entail that its process begins or completes; an
    actual process does not entail that the affordance persists afterward. Target
    incorporability preserves one reference whole and qualifies exactly one distinct
    target. Systemic integrability treats multiple inputs as peer candidates for a
    higher-order whole distinct from every input.'
  cross_family_comparisons: &1
    LIF: LIF owns living identity, kinship, care, and biosystems. STR may describe
      whether living or institutional structures can be reorganized or combined, but
      it does not create biological or social identity.
    MOV: MOV owns position, displacement, routes, self-mobility, and reference-frame
      configurations. A structural affordance neither moves anything nor states where
      any constituent is located.
    MAT: MAT owns physical work capacity, contact, force transmission, and material
      interdependence. STR affordances are substrate-neutral and do not assert strength,
      load tolerance, energy, shape, or physical joining.
    MIN: MIN owns attention, cognition, intention, categorization, and joint attention.
      Mentally classifying things as compatible does not establish a structural reconfiguration
      or integration affordance.
    CON: CON owns communicative participation and directed or shared exchange relations.
      Structures may communicate without being integrable, and may be integrable without
      exchanging messages.
    WRN: WRN owns danger, defect, failure, vulnerability, and unresolved threat. Lack
      of a structural affordance may cause risk, but the risk and the affordance remain
      separate claims.
    REP: REP owns repair, restoration, recoverability, and maintenance. Capacity for
      reconfiguration is not self-repair, and incorporability or integrability does
      not imply that combining structures restores them.
    LOG: LOG owns formal validity, type constraints, permission, entailment, computability,
      and set membership. STR qualifies part–whole transformation by structural positions
      and interfaces, not by rules alone.
    DAT: DAT owns records, schemas, references, encodings, and information linkage.
      A compatibility declaration or schema record may describe a STR affordance but
      is not the affordance itself.
    CRE: CRE owns design, fabrication, generation, assembly as creation, and unrealized
      artifacts. STR:2xx states an affordance or qualifying relation and does not
      create, design, or instantiate a structure.
    ORI: ORI owns general possibility, necessity, temporal or ontological transition,
      and manifestation. STR:222 is only the structural possibility of peer integration,
      never unrestricted modality or future time.
  runtime_state_interpretation:
    '0': Denies that the enduring internal reconfiguration capacity holds in the stated
      structural context; it does not select the active or dormant sibling.
    '1': Affirms that the enduring internal reconfiguration capacity holds, without
      asserting that any reconfiguration, incorporation, or integration process is
      occurring.
    2/num: Leaves the assertion that the enduring internal reconfiguration capacity
      holds pending, remembered, or unresolved; the lexical root remains the stable
      member.
  lexical_runtime_distinction: Lexical third trit 0 permanently selects the stable
    member of this affordance triplet. Runtime `[2]/num` instead marks a token-level
    assertion pending, remembered, or unresolved. Thus `STR:200[1]` affirms the lexical
    concept, while a stable or active sibling carrying `[2]/num` remains that sibling
    and does not become STR:200.
  examples:
  - category: ordinary_conversation
    semantic_graph: STR:200[1](STRUCTURE=s,CONSTITUENTS=c)
    literal_gloss: affirm enduring internal reconfiguration capacity of reference
      structure
    natural_english: This shelving system remains reconfigurable.
    runtime_state: 1
    contour: level declaration
    role_registers: mid register for reference structure; lower subordinate register
      for constituents
    use_status: valid
    analysis: The example asserts only structural affordance.
  - category: physical_or_spatial
    semantic_graph: MAT(OBJECTS=o)+STR:200[1](STRUCTURE=s,CONSTITUENTS=c)
    literal_gloss: material realization plus enduring internal reconfiguration capacity
    natural_english: The modular rack's members can be reassigned among its own bays
      without replacing the rack as the reference whole.
    runtime_state: 1
    contour: level declaration
    role_registers: mid register for reference structure; lower subordinate register
      for constituents
    use_status: valid
    analysis: MAT supplies material facts; STR supplies the substrate-neutral affordance.
  - category: temporal_or_sequential
    semantic_graph: STR:200[1](STRUCTURE=s,CONSTITUENTS=c)+ORI(INTERVAL=w)
    literal_gloss: enduring internal reconfiguration capacity during interval w
    natural_english: After the locking interval, the same frame has the stated reconfiguration-capacity
      status.
    runtime_state: 1
    contour: level declaration
    role_registers: mid register for reference structure; lower subordinate register
      for constituents
    use_status: valid
    analysis: ORI locates the claim in time; lexical third-trit status is not tense.
  - category: cross_family_compound
    semantic_graph: DAT(SPEC=d)+LOG(PERMIT=p)+STR:200[1](STRUCTURE=s,CONSTITUENTS=c)
    literal_gloss: specification and permission plus enduring internal reconfiguration
      capacity
    natural_english: The specification and rule describe the affordance; the STR relation
      still must hold independently.
    runtime_state: 1
    contour: level declaration
    role_registers: mid register for reference structure; lower subordinate register
      for constituents
    use_status: valid
    analysis: DAT and LOG describe or authorize; neither substitutes for the structural
      affordance.
  - category: executable_or_programming
    semantic_graph: STR:200[1](STRUCTURE=s,CONSTITUENTS=c)
    literal_gloss: assert enduring internal reconfiguration capacity
    natural_english: The running container reports whether its internal module layout
      is reconfigurable without replacing container identity.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers: mid register for reference structure; lower subordinate register
      for constituents
    use_status: valid
    analysis: The executable test must preserve reference identity and structural
      roles explicitly.
    pseudocode: assert(structural_affordance.matches?("STR:200"))
  - category: counterexample
    semantic_graph: STR:101[1](STRUCTURE=s,CONSTITUENTS=c)
    literal_gloss: ongoing internal reconfiguration
    natural_english: The shelves are being rearranged now.
    runtime_state: 1
    contour: level declaration
    role_registers: mid register for reference structure; lower subordinate register
      for constituents
    use_status: must_not_use_this_root
    analysis: Use STR:101 for the ongoing transformation; STR:200 names a capacity,
      not the act of exercising it.
  future_compound_examples:
  - STR:200 + STR:0xx identifies the position, interface, or composite arrangement
    whose organization supplies the affordance.
  - STR:200 + STR:1xx distinguishes an available affordance from its actual exercise,
    completion, or nonactualized process.
  - STR:200 + MAT/MOV specifies physical substance, force, contact, or displacement
