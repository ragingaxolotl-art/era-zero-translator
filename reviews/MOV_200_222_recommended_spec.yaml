  recommended_title: available self-mobility
  invariant_definition: A mover's capacity to change its own position that is presently
    available for exercise.
  confidence: 0.96
  semantic_boundaries:
  - Includes present usability of a mover's own mobility capacity.
  - May hold while the mover is stationary.
  - Does not assert permission, intention, readiness of a scheduled event, or actual
    displacement.
  excluded_meanings:
  - Enduring capacity without a current-availability claim is MOV:200.
  - Capacity retained but not presently available is MOV:202.
  - Ongoing movement is MOV:101, MOV:111, or MOV:121 according to frame.
  - Energy and actuator condition belong to MAT; authorization belongs to LOG.
  nearest_motion_contrasts:
    MOV:011: active destination is a guiding target entity, not a capacity
    MOV:101: active departure is movement away from a source, not the ability to do
      so
    MOV:121: active shared-frame movement changes position; MOV:201 may be true while
      position is unchanged
  cross_family_comparisons:
    MAT: MAT owns bodies, dimensions, forces, and collision mechanics that may stabilize
      or constrain the live/current configuration.
    MIN: MIN owns awareness, prediction, and planning of a configuration; the configuration
      does not imply a mind.
    CON: CON owns participant coordination and linkage; a shared-frame positional
      configuration may be accidental or externally imposed.
    STR: STR owns topology, containment, organization, and route structure; MOV owns
      only the loci's positional configuration.
    LOG: LOG owns permission, compatibility, feasibility, constraints, and reachability
      proofs; configuration alone proves none.
    DAT: DAT owns maps, pose arrays, coordinates, and configuration records; representations
      are not the positional relation.
    CRE: CRE owns generation or transformation of configurations and paths; the resulting
      positional configuration is MOV.
    ORI: ORI owns universal spatial possibility and reality; MOV:222 is only a Motion-domain
      configuration possibility.
  address_explanation:
    first_trit_2: Selects relationship or possibility rather than a movement event.
    second_trit: Inward/self/source makes the capacity a property of the mover.
    third_trit: Active/changing/expressed selects present availability, maintenance,
      or update.
  runtime_state_interpretations:
    '0': Denies that self-mobility is currently available; it does not necessarily
      deny enduring capacity.
    '1': Affirms that the mover can presently exercise its self-mobility.
    '2': Marks current availability as pending, dormant, remembered, possible, or
      unresolved; the lexical root remains active capacity rather than latent capacity.
  ordinary_language_examples:
  - semantic_graph: MOV:201[1](MOVER=person)
    literal_gloss: the person's self-mobility is presently available
    natural_english: I can move now.
    runtime_state: 1
    contour: declarative
    roles:
    - MOVER
  - semantic_graph: MOV:201[1](MOVER=wheelchair)
    literal_gloss: the chair's self-mobility is presently usable
    natural_english: The powered chair is able to move.
    runtime_state: 1
    contour: declarative
    roles:
    - MOVER
  - semantic_graph: MOV:201[0](MOVER=drone)
    literal_gloss: the drone's current self-mobility is unavailable
    natural_english: The drone cannot move right now.
    runtime_state: 0
    contour: declarative
    roles:
    - MOVER
  technical_programming_examples:
  - semantic_graph: MOV:201[1](MOVER=robot)
    interpretation: A runtime capability check succeeds without commanding movement.
    pseudocode: if mobility_available?(robot) then expose_move_controls
    runtime_state: 1
  - semantic_graph: MOV:201[1](MOVER=process)
    interpretation: An explicitly spatial agent can currently transition its position
      state.
    pseudocode: assert(enabled(position_transition(agent)))
    runtime_state: 1
  future_compound_decomposition_sketches_not_canonical:
  - MOV:201 + LOG permission → currently permitted and able to move
  - MOV:201 + STR clearance → room to move now
  - MOV:201 + MAT energy → powered mobility currently available
