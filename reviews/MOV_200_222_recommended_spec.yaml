  recommended_title: enduring self-mobility
  invariant_definition: An enduring capacity of a mover to change its own position.
  confidence: 0.94
  semantic_boundaries:
  - Includes a mover's durable capacity for self-positional change whether or not
    it is moving now.
  - Applies to physical or explicitly modeled abstract movers.
  - Does not assert that the capacity is currently usable, that movement is occurring,
    or that departure is potential.
  excluded_meanings:
  - Current availability is MOV:201.
  - Latent or currently unavailable capacity is MOV:202.
  - Actual shared-frame movement is MOV:120–122.
  - Body integrity, energy, and force belong to MAT; permission belongs to LOG; range
    bounds require STR or quantitative composition.
  nearest_motion_contrasts:
    MOV:001: present position is an occupied locus; MOV:200 is a capacity
    MOV:100–102: departure roots are processes; MOV:200 does not assert a departure
      token
    MOV:120–122: shared-frame movement roots describe positional change; MOV:200 describes
      durable capability
  cross_family_comparisons:
    MAT: MAT owns bodies, dimensions, forces, and collision mechanics that may stabilize
      or constrain the established configuration.
    MIN: MIN owns awareness, prediction, and planning of a configuration; the configuration
      does not imply a mind.
    CON: CON owns participant coordination and linkage; a shared-frame positional
      configuration may be accidental or externally imposed.
    STR: STR owns topology, containment, organization, and route structure; MOV owns
      only the loci's positional configuration.
    LOG: LOG owns permission, compatibility, feasibility, constraints, and reachability
      proofs; configuration alone proves none.
    DAT: DAT owns maps, pose arrays, coordinates, and configuration records; representations
      are not the positional relation.
    CRE: CRE owns generation or transformation of configurations and paths; the resulting
      positional configuration is MOV.
    ORI: ORI owns universal spatial possibility and reality; MOV:222 is only a Motion-domain
      configuration possibility.
  address_explanation:
    first_trit_2: Selects relationship or possibility rather than a movement event.
    second_trit: Inward/self/source makes the capacity a property of the mover.
    third_trit: Stable/bounded selects enduring or established status.
  runtime_state_interpretations:
    '0': Denies that the mover has the asserted enduring self-mobility capacity.
    '1': Affirms that the mover possesses the enduring capacity, even if presently
      at rest.
    '2': Marks the truth or current status of that enduring-capacity assertion as
      dormant, remembered, possible, or unresolved; it does not turn the root into
      MOV:202.
  ordinary_language_examples:
  - semantic_graph: MOV:200[1](MOVER=animal)
    literal_gloss: the animal has enduring self-mobility
    natural_english: The animal is mobile by nature.
    runtime_state: 1
    contour: declarative
    roles:
    - MOVER
  - semantic_graph: MOV:200[1](MOVER=rover)
    literal_gloss: the rover has enduring self-mobility
    natural_english: The rover was built to relocate itself.
    runtime_state: 1
    contour: declarative
    roles:
    - MOVER
  - semantic_graph: MOV:200[1](MOVER=bird)
    literal_gloss: the bird has enduring self-mobility
    natural_english: Even while resting, the bird can change where it is.
    runtime_state: 1
    contour: declarative
    roles:
    - MOVER
  technical_programming_examples:
  - semantic_graph: MOV:200[1](MOVER=robot)
    interpretation: Type-level capability independent of current actuator state.
    pseudocode: capabilities(robot).include?(:self_mobility)
    runtime_state: 1
  - semantic_graph: MOV:200[1](MOVER=agent)
    interpretation: A state-space agent has a transition relation that can change
      its own position variable.
    pseudocode: 'exists p1 != p0: transition(agent, p0, p1)'
    runtime_state: 1
  future_compound_decomposition_sketches_not_canonical:
