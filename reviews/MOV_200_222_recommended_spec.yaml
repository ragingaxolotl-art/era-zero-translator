  nearest_motion_contrasts:
    MOV:001: present position is a monadic occupied locus; MOV:210 relates it to a
      target
    MOV:010: defined destination names the target entity; MOV:210 states a relation
      to it
    MOV:111: active target approach asserts displacement toward target; MOV:210 can
      hold at rest
    MOV:020: an established route is an ordered position sequence; MOV:210 requires
      no path
  cross_family_comparisons:
