  proposal_status: canonical_by_delegated_approval
  proposed_title: persistent source-ground condition
  invariant_definition: A persistent ontological condition by which one referent is
    grounded as a source from which another state of affairs may originate, independently
    of whether that grounding is presently operative.
  semantic_center: 'ontological conditions: source-ground, distinct existence, and
    shared-world order'
  address_justification:
    first_trit_0: Selects an ontological entity or condition rather than an originating
      process, causal or modal relation, observation, representation, or physical
      constitution.
    second_trit: 'Selects inward/self scope: one referent qualified as a source-ground
      for an originating state of affairs and no other Origin-family column.'
    third_trit: Selects the persistent status of the same ontological condition while
      leaving runtime assertion status, observer knowledge, clock time, probability,
      truth evaluation, causation, and physical realization separate.
  inclusion_boundary: Includes only the persistent source-ground condition as a substrate-neutral
    ontological qualification at inward scope. The condition qualifies source-grounding
    only. It does not assert a particular causal link, creator, temporal beginning,
    physical substrate, or produced result. It is neutral about substance, location,
    cognition, evidence, representation, logical validity, agency, authority, productive
    method, hazard, repair, scheduling, exact time, probability, and causal mechanism.
  excluded_meanings:
  - A causal link, temporal beginning, production event, authorship claim, or historical
    provenance relation.
  - A material object, living agent, mental representation, data record, proposition,
    structural arrangement, warning, or repair condition.
  - Observation, detectability, evidence, truth, validity, certainty, consensus, permission,
    or authority.
  - Unrestricted possibility, necessity, probability, counterfactuality, schedule,
    future time, or mere nonexistence.
  - The content of a natural law, algorithm, causal mechanism, physical mechanism,
    social convention, or formal model.
  - Any claim that persistence entails current expression, or that latency entails
    uncertainty, concealment, planning, or futurity.
  nearest_neighbors:
  - ORI:001
  - ORI:002
  - ORI:010
  - ORI:020
  - ORI:000
  - ORI:100
  same_family_contrast: "`ORI:0xx` owns ontological conditions: source-ground, distinct
    existence, and shared-world order. `ORI:1xx` is reserved for origin/reality processes
    such as beginning, actualization, or world change. `ORI:2xx` is reserved for causal,
    modal, temporal, or provenance relations and affordances. An ontological condition
    does not entail a cause, process, representation, observation, or physical substrate.
    Persistent identity may co-occur with occurrent/operative or latent status; occurrent/operative
    and latent are mutually exclusive for the same condition at one reference time.
    Lexical latency affirms membership without present expression; runtime `[2]/num`
    separately marks uncertainty about any selected claim."
  cross_family_comparisons: &1
    LIF: LIF owns living identities, biological conditions, agents, and social roles.
      ORI states how a referent belongs to reality, not whether it is alive, a person,
      or a role bearer.
    MOV: MOV owns position, routes, displacement, and motion conditions. Change of
      location may manifest an ORI condition, but spatial position or movement is
      not ontological status.
    MAT: MAT owns substance, energy, force, contact, and physical capacities. ORI
      is substrate-neutral and never identifies matter merely because matter exists.
    MIN: MIN owns belief, attention, intention, understanding, and mental possibility.
      ORI makes an ontological claim, not a claim about what any observer conceives
      or knows.
    CON: CON owns linkage, communication, participation, authority, and interaction
      channels. Shared reality does not itself assert communication or a social relation.
    WRN: WRN owns hazards, faults, adverse processes, susceptibility, exposure, and
      propagation. An unrealized or changing ORI condition is not thereby a risk or
      failure.
    STR: STR owns arrangements, interfaces, dependencies, and structural compatibility.
      ORI may qualify a structure as obtaining, but it does not describe the arrangement
      itself.
    REP: REP owns restoration conditions, transformations, and affordances. Return
      to a prior acceptable state is not encoded by persistence, occurrence, or latency
      in ORI.
    LOG: LOG owns formal propositions, constraints, validity, evaluation, and applicability.
      ORI distinct existence is not the truth value or proof status of a representation.
    DAT: DAT owns represented information, records, and data processes. An encoded
      model of a world is DAT; the modeled ontological condition remains ORI.
    CRE: CRE owns generative entities, productive transformations, and productive
      affordances. ORI source-grounding does not assert authorship, manufacture, or
      creation.
  runtime_state_interpretation:
    '0': Denies that this source-ground condition persists in the stated reality;
      it does not select the occurrent or latent sibling and does not deny the referent
      itself.
    '1': Affirms that this source-ground condition persists independently of present
      expression, without asserting a cause, observation, proof, or physical realization.
    2/num: Leaves unresolved whether this persistent source-ground condition claim
      holds; runtime uncertainty does not change the lexical root into operative or
      latent status.
  lexical_runtime_distinction: Lexical third trit `0` permanently selects the persistent
    status of this ontological condition. Runtime `[2]/num` instead leaves the already-selected
    claim unresolved; it never changes lexical status. Thus a latent root affirmed
    with `[1]` confirms membership without present expression, while a persistent
    or occurrent root carrying `[2]/num` remains lexically persistent or occurrent
    but uncertain as a token claim.
  examples:
  - category: ordinary_conversation
    semantic_graph: ORI:000[1](SOURCE=source,ORIGINAND=o,REALITY=r)
    literal_gloss: affirm persistent source-ground condition
    natural_english: The source-ground condition for the source persists independently
      of present expression.
    runtime_state: 1
    contour: level declaration
    role_registers:
