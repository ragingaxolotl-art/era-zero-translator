    analysis: Ontological status and material constitution remain separately typed.
  - category: temporal_or_sequential
    semantic_graph: ORI:000[1](SOURCE=source,ORIGINAND=o,REALITY=r)+ORI(INTERVAL=w)
    literal_gloss: persistent ontological condition during interval w
    natural_english: During interval w, the condition has the selected lexical status.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: referent whose ontological condition is qualified
      middle: source-ground, distinct existence, or shared-world condition as figure
      high: originating state of affairs, distinct manifestation, or world-level consequence
      sustained: relevant reality, reference frame, and shared domain
    use_status: valid
    analysis: Temporal anchoring does not replace persistent, occurrent, or latent
      status.
  - category: cross_family_compound
    semantic_graph: ORI:000[1](SOURCE=source,ORIGINAND=o,REALITY=r)+DAT(REPRESENTATION=d)+MIN(BELIEF=b)
    literal_gloss: ontological condition plus representation plus belief
    natural_english: The condition, its recorded description, and an observer's belief
      are asserted separately.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: referent whose ontological condition is qualified
      middle: source-ground, distinct existence, or shared-world condition as figure
      high: originating state of affairs, distinct manifestation, or world-level consequence
      sustained: relevant reality, reference frame, and shared domain
    use_status: valid
    analysis: Reality, representation, and cognition remain distinct.
  - category: executable_or_programming
    semantic_graph: ORI:000[1](SOURCE=source,ORIGINAND=o,REALITY=r)
    literal_gloss: assert persistent ontological condition
    natural_english: A runtime records the selected world-state condition without
      conflating it with a Boolean proposition or observation event.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: referent whose ontological condition is qualified
      middle: source-ground, distinct existence, or shared-world condition as figure
      high: originating state of affairs, distinct manifestation, or world-level consequence
      sustained: relevant reality, reference frame, and shared domain
    use_status: valid
    analysis: Ontological state, truth evaluation, and stored data remain distinct.
    pseudocode: 'world.assert_condition("ORI:000", referent: "source")'
  - category: counterexample
    semantic_graph: LOG(PROPOSITION=p)+DAT(RECORD=d)
    literal_gloss: represented proposition with stored evidence
    natural_english: The database says the proposition is true.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: referent whose ontological condition is qualified
      middle: source-ground, distinct existence, or shared-world condition as figure
      high: originating state of affairs, distinct manifestation, or world-level consequence
      sustained: relevant reality, reference frame, and shared domain
    use_status: must_not_use_this_root
    analysis: Use LOG and DAT for truth/evidence; ORI:000 is reserved for the condition's
      place in reality.
  future_compound_examples:
  - ORI:000 + ORI:1xx may state the process through which the condition begins, changes,
