  proposal_status: canonical_by_delegated_approval
  proposed_title: persistent internal formal criterion
  invariant_definition: A persistent formal criterion within the logical specification
    of one reference entity that limits that entity's admissible states independently
    of whether the criterion is presently operative.
  semantic_center: 'formal constraint entities: internal criteria, target-directed
    constraints, and shared formal regimes'
  address_justification:
    first_trit_0: Selects a formal rule or constraint entity rather than an evaluation
      process, proof act, execution, or formal applicability/consequence relation.
    second_trit: 'Selects inward/self scope: one formal criterion within the logical
      specification of one reference entity and no other Logic-family column.'
    third_trit: Selects the persistent/operation-neutral member by rule identity or
      present operation while leaving runtime truth status, satisfaction, observer
      knowledge, tense, probability, and process phase separate.
  inclusion_boundary: Includes only the persistent internal formal criterion as a
    substrate-neutral formal constraint at inward scope. The claim is about a criterion
    internal to one reference specification, not a rule assigned to another target,
    a proposition's truth, or a stored record. It is neutral about truth, satisfaction,
    violation, evaluation, enforcement, represented form, belief, physical realization,
    authority, probability, timing, and cause.
  excluded_meanings:
  - Truth or falsity of a proposition, or assertion, belief, certainty, and evidential
    support for it.
  - Satisfaction, violation, validity, invalidity, proof, derivation, inference, evaluation,
    or execution result.
  - Data value, variable, binding, symbol string, record, schema representation, source
    code, or storage state.
  - Physical, biological, communicative, structural, restorative, or adverse mechanism
    governed by or realizing the rule.
  - Authorship, institutional authority, command, enforcement, sanction, social acceptance,
    or responsibility.
  - Applicability, entailment, consistency, computability, possibility, necessity,
    probability, schedule, future activation, or cause.
  nearest_neighbors:
  - LOG:001
  - LOG:002
  - LOG:010
  - LOG:020
  - LOG:100
  - LOG:200
  same_family_contrast: "`LOG:0xx` owns formal constraint entities; `LOG:1xx` remains
    the layer for actual evaluation, inference, or rule-application processes; `LOG:2xx`
    remains the layer for applicability, consequence, consistency, or other formal
    enabling relations. Present operation in 0xx does not name an evaluation or entail
    satisfaction, and an identified rule does not entail that it can be applied or
    that a result follows. The persistent member is operation-neutral: it may co-occur
    with the operative sibling or the dormant sibling at the same reference time.
    It asserts continuity of rule identity rather than a third mutually exclusive
    operation value."
  cross_family_comparisons: &1
    LIF: LIF owns living identities, biological conditions, agents, and social collectives.
      A living participant may be governed by a LOG criterion, but the rule is not
      its life, role, health, or agency.
    MOV: MOV owns position, path, displacement, and motion affordance. A LOG constraint
      may permit or forbid movement, but it neither moves anything nor constitutes
      a route or destination.
    MAT: MAT owns substance, energy, force, contact, and material capacities. A physical
      limit can instantiate a formal constraint, but LOG does not encode the material
      mechanism or available energy.
    MIN: MIN owns belief, attention, intention, memory, and cognitive representation.
      A criterion can remain formally defined whether anyone believes, understands,
      remembers, or attends to it.
    CON: CON owns channels, participants, exchange, and communicative relations. Protocol
      rules may govern a channel, but the rules are distinct from the connection and
      messages sent through it.
    WRN: WRN owns adverse conditions, transformations, susceptibility, exposure, and
      propagation. Violating a rule need not be harmful, and danger can comply with
      every formal criterion.
    STR: STR owns positions, interfaces, arrangements, transformations, and affordances.
      LOG constrains admissible arrangements without becoming the arrangement or interface
      itself.
    REP: REP owns restoration conditions, transformations, and affordances. A LOG
      criterion can specify acceptability, but it is not the restored condition, repair
      event, or recoverability relation.
    DAT: DAT owns records, symbols, schemas, represented values, provenance, and storage.
      A serialized rule is data representing a LOG criterion; representation and formal
      constraint remain separately typed.
    CRE: CRE owns generation, fabrication, replacement, and destruction. A rule may
      constrain creation, but LOG neither creates the result nor supplies the productive
      transformation.
    ORI: ORI owns temporal, modal, causal-origin, and ontological qualification. LOG
      persistence, operation, and dormancy do not encode past, future, possibility,
      necessity, probability, or origin.
  runtime_state_interpretation:
    '0': Denies that this internal formal criterion persists as the same identified
      formal rule; it does not select the operative or dormant sibling and does not
      prove an opposite rule.
    '1': Affirms the persistent identity of this internal formal criterion while leaving
      current operation, satisfaction, truth, enforcement, representation, and origin
      undecided.
    2/num: Leaves unresolved whether this persistent internal formal criterion remains
      identified; uncertainty about the assertion does not change the lexical root
      into an operative or dormant criterion.
  lexical_runtime_distinction: Lexical third trit `0` permanently selects the persistent/operation-neutral
    member of this formal-constraint triplet. Runtime `[2]/num` instead leaves the
    truth or applicability of that already-selected claim unresolved; it never changes
    operation status. Thus a dormant root affirmed with `[1]` is a confirmed defined-but-inoperative
    rule, while a persistent or operative root carrying `[2]/num` remains lexically
    persistent or operative but uncertain as a token claim.
  examples:
  - category: ordinary_conversation
    semantic_graph: LOG:000[1](ENTITY=account,CRITERION=c)
    literal_gloss: affirm persistent internal formal criterion
    natural_english: That standing rule remains part of the account's specification
      whether or not it is being applied now.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or participant governed by the formal criterion
      middle: formal criterion, constraint, or regime asserted as the figure
      high: distinct target, rule-domain reference, or criterion source when separately
        expressed
      sustained: shared rule domain and its multiple governed participants
    use_status: valid
    analysis: The root asserts a rule entity and its status, not a pass/fail result.
  - category: physical_or_spatial
    semantic_graph: MAT(BEARER=account)+LOG:000[1](ENTITY=account,CRITERION=c)
    literal_gloss: material bearer plus persistent LOG rule
    natural_english: A machine-control limit has persistent status as a formal rule;
      MAT separately describes the mechanism.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or participant governed by the formal criterion
      middle: formal criterion, constraint, or regime asserted as the figure
      high: distinct target, rule-domain reference, or criterion source when separately
        expressed
      sustained: shared rule domain and its multiple governed participants
    use_status: valid
    analysis: A formal limit and its physical realization remain separately typed.
  - category: temporal_or_sequential
    semantic_graph: LOG:000[1](ENTITY=account,CRITERION=c)+ORI(INTERVAL=w)
    literal_gloss: persistent LOG rule during interval w
    natural_english: During interval w, the criterion has the stated lexical status.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or participant governed by the formal criterion
      middle: formal criterion, constraint, or regime asserted as the figure
      high: distinct target, rule-domain reference, or criterion source when separately
        expressed
      sustained: shared rule domain and its multiple governed participants
    use_status: valid
    analysis: ORI supplies time and does not replace LOG status.
  - category: cross_family_compound
    semantic_graph: DAT(SPEC=d)+LOG:000[1](ENTITY=account,CRITERION=c)
    literal_gloss: represented specification plus persistent LOG rule
    natural_english: The specification represents the rule without becoming the rule
      itself.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or participant governed by the formal criterion
      middle: formal criterion, constraint, or regime asserted as the figure
      high: distinct target, rule-domain reference, or criterion source when separately
        expressed
      sustained: shared rule domain and its multiple governed participants
    use_status: valid
    analysis: DAT and LOG remain distinct.
  - category: executable_or_programming
    semantic_graph: LOG:000[1](ENTITY=account,CRITERION=c)
    literal_gloss: assert persistent formal constraint metadata
    natural_english: A runtime may register this rule status without asserting that
      a check ran or passed.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: reference entity or participant governed by the formal criterion
      middle: formal criterion, constraint, or regime asserted as the figure
      high: distinct target, rule-domain reference, or criterion source when separately
        expressed
      sustained: shared rule domain and its multiple governed participants
    use_status: valid
    analysis: Rule metadata and evaluation are separate.
    pseudocode: assert(rule_status.matches?("LOG:000"))
  - category: counterexample
    semantic_graph: LOG:101[1](CRITERION=c,EVALUATION=e)
    literal_gloss: actual rule evaluation
    natural_english: The validator is currently checking the rule.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or participant governed by the formal criterion
      middle: formal criterion, constraint, or regime asserted as the figure
      high: distinct target, rule-domain reference, or criterion source when separately
        expressed
      sustained: shared rule domain and its multiple governed participants
    use_status: must_not_use_this_root
    analysis: An actual evaluation belongs to LOG:1xx, not this rule-entity block.
  future_compound_examples:
  - LOG:000 + DAT supplies the written specification, symbol sequence, or schema representation
    without reducing the formal rule to data.
  - LOG:000 + MIN supplies belief, acceptance, or understanding while keeping cognitive
    state distinct from formal rule identity.
  - LOG:000 + MAT/STR/CON supplies the physical, structural, or communicative system
