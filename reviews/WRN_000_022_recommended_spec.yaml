  proposal_status: canonical_by_delegated_approval
  proposed_title: persistent internal fault
  invariant_definition: An intrinsic adverse condition that remains identified within
    one reference entity independently of whether it is presently producing harmful
    deviation.
  semantic_center: 'adverse-condition entities: intrinsic faults, distinct external
    hazards, and correlated distributed faults'
  address_justification:
    first_trit_0: 'Selects an entity or condition: persistent internal fault is an
      adverse condition, not its detection, warning, containment, propagation, causal
      mechanism, susceptibility relation, evidence record, or repair.'
    second_trit: 'Selects inward/self scope: one intrinsic adverse condition located
      within a reference entity and no other Warning-family column.'
    third_trit: Selects the stable/persistent condition by adverse identity or manifestation
      while leaving runtime truth status, observer knowledge, tense, probability,
      and response phase separate.
  inclusion_boundary: Includes only the persistent intrinsic adverse condition as
    a substrate-neutral claim about one intrinsic adverse condition located within
    a reference entity. The claim is about an adverse condition intrinsic to the reference
    entity, not about an external source, an observer's belief, or a diagnostic record.
    It is neutral about physical mechanism, observer knowledge, evidential certainty,
    signaling, formal validity, moral blame, repairability, severity, probability,
    timing, and response.
  excluded_meanings:
  - The person, organism, material object, software component, institution, or system
    that bears, causes, observes, records, or responds to the condition.
  - Physical fracture, force, heat, collision, displacement, approach, biological
    injury, illness, fear, or pain without a separate applicable WRN adverse classification.
  - Formal falsehood, invalidity, contradiction, type error, permission violation,
    incompatibility, or schema mismatch merely as a rule judgment.
  - Alarm, warning message, symptom report, log entry, error code, measurement, diagnosis,
    belief, suspicion, attention, or evidence about the condition.
  - Detecting, warning, attacking, spreading, containing, isolating, shutting down,
    repairing, recovering, or responding as a process or relation.
  - Severity, probability, uncertainty to an observer, possible future occurrence,
    schedule, cause, blame, intent, exploitability, vulnerability, exposure, or guaranteed
    harm.
  nearest_neighbors:
  - WRN:001
  - WRN:002
  - WRN:010
  - WRN:020
  - WRN:100
  - WRN:200
  same_family_contrast: "`WRN:0xx` owns adverse conditions as entities; `WRN:1xx`
    remains the process layer for detecting, warning, containing, or responding; `WRN:2xx`
    remains the capacity/relation layer for susceptibility, exposure, and systemic
    risk relations. Manifestation in 0xx does not itself name the process that caused,
    detected, communicated, propagated, or remediated it, and an adverse condition
    does not entail a particular vulnerability or exposure relation. The persistent
    member is manifestation-neutral: it may co-occur with the manifest sibling or
    the dormant sibling at the same reference time. It asserts continuity of adverse-condition
    identity rather than a third mutually exclusive manifestation value."
  cross_family_comparisons: &1
    LIF: LIF owns living identity, health state, care, harm to organisms, and social
      collectives. WRN may classify an adverse condition affecting life, but it does
      not itself assert injury, illness, fear, care, or social identity.
    MOV: MOV owns location, approach, traversal, redirection, and shared motion. A
      moving object can be hazardous, but WRN names the adverse condition rather than
      the displacement or route.
    MAT: MAT owns substance, energy, force, contact, fracture, and other physical
      states. WRN names the adverse significance of a condition; material damage,
      collision, heat, and pressure require MAT claims.
    MIN: MIN owns perception, belief, attention, intention, fear, and suspicion. A
      fault or hazard may be unknown or disbelieved and still exist; uncertainty in
      an observer is not lexical latency in WRN.
    CON: CON owns signals, alerts, messages, channels, and participant exchange. Communicating
      a warning does not create the adverse condition, and an uncommunicated condition
      may still be WRN:0xx.
    REP: REP owns diagnosis as restoration work, repair, recovery, replacement, and
      maintenance. A WRN entity may motivate repair but does not assert that repair
      is possible, attempted, or successful.
    STR: STR owns positions, interfaces, arrangements, transformations, and structural
      affordances. A malformed or unsafe structure needs WRN for adversity and STR
      for the structural fact; neither family subsumes the other.
    LOG: LOG owns validity, contradiction, permission, constraints, type judgments,
      and formal nonconformance. WRN does not make a proposition false or a value
      invalid merely because its consequences are dangerous.
    DAT: DAT owns records, error codes, evidence, measurements, schemas, and provenance.
      Data can describe a fault or hazard without being that condition; corrupted
      information requires DAT plus WRN when adversity is asserted.
    CRE: CRE owns generation, design, fabrication, mutation, and destruction as transformations
      of artifacts. A defect may result from creation or destruction, but WRN:0xx
      names the adverse condition after causal history is factored out.
    ORI: ORI owns time, existence, general possibility, necessity, and manifestation.
      WRN lexical stable, active, and dormant status is specific to adverse conditions
      and never replaces tense, probability, or unrestricted modality.
  runtime_state_interpretation:
    '0': Denies that the persistent intrinsic adverse condition remains identified
      in the stated warning context; it does not affirm the manifest or dormant sibling
      and does not assert safety in every other respect.
    '1': Affirms that the intrinsic adverse condition persists as identified, without
      deciding current harmful manifestation, evidence, awareness, severity, damage,
      response, probability, or causal history beyond the invariant.
    2/num: Leaves unresolved whether the persistent intrinsic adverse condition remains
      identified; the token stays the stable lexical root and does not become the
      manifest or dormant sibling.
  lexical_runtime_distinction: Lexical third trit `0` permanently selects the stable/persistent
    member of this adverse-condition triplet. Runtime `[2]/num` instead leaves the
    truth or applicability of that already-selected root unresolved; it never changes
    manifestation phase. Thus a latent root affirmed with `[1]` is a confirmed latent
    condition, while a persistent or manifest root carrying `[2]/num` remains lexically
    persistent or manifest but uncertain as a token claim.
  examples:
  - category: ordinary_conversation
    semantic_graph: WRN:000[1](ENTITY=e,FAULT=f)
    literal_gloss: affirm persistent intrinsic adverse condition
    natural_english: The account still has the same internal fault even when no error
      is visible.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or target under evaluation
      middle: adverse condition as the asserted figure
      high: distinct external hazard source or affected participant
      sustained: shared system containing correlated participants
    use_status: valid
    analysis: The root asserts the condition, not whether anyone knows or reports
      it.
  - category: physical_or_spatial
