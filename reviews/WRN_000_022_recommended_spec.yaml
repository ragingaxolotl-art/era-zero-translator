    literal_gloss: material body plus persistent internal fault
    natural_english: The beam retains an intrinsic crack condition even while unloaded.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or target under evaluation
      middle: adverse condition as the asserted figure
      high: distinct external hazard source or affected participant
      sustained: shared system containing correlated participants
    use_status: valid
    analysis: MAT supplies the physical realization; WRN supplies adverse status.
  - category: temporal_or_sequential
    semantic_graph: WRN:000[1](ENTITY=e,FAULT=f)+ORI(INTERVAL=w)
    literal_gloss: internal fault status during interval w
    natural_english: During the test interval, the entity has the stated internal-fault
      status.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or target under evaluation
      middle: adverse condition as the asserted figure
      high: distinct external hazard source or affected participant
      sustained: shared system containing correlated participants
    use_status: valid
    analysis: ORI supplies time; the lexical third trit supplies manifestation status,
      not tense.
  - category: cross_family_compound
    semantic_graph: DAT(EVIDENCE=d)+MIN(AWARE=a)+WRN:000[1](ENTITY=e,FAULT=f)
    literal_gloss: evidence and awareness plus intrinsic fault
    natural_english: The inspection record and the observer's awareness are separate
      from the internal fault itself.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or target under evaluation
      middle: adverse condition as the asserted figure
      high: distinct external hazard source or affected participant
      sustained: shared system containing correlated participants
    use_status: valid
    analysis: DAT and MIN can track a fault without constituting it.
  - category: executable_or_programming
    semantic_graph: WRN:000[1](ENTITY=module,FAULT=bug)
    literal_gloss: assert persistent internal fault
    natural_english: The parser object retains a known internal defect across executions.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: reference entity or target under evaluation
      middle: adverse condition as the asserted figure
      high: distinct external hazard source or affected participant
      sustained: shared system containing correlated participants
    use_status: valid
    analysis: The program may test evidence, but the semantic assertion concerns the
      adverse condition.
    pseudocode: assert(adverse_condition.matches?("WRN:000"))
  - category: counterexample
    semantic_graph: LOG(INVALID=true)
    literal_gloss: formal invalidity
    natural_english: The proof step is invalid.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or target under evaluation
      middle: adverse condition as the asserted figure
      high: distinct external hazard source or affected participant
      sustained: shared system containing correlated participants
    use_status: must_not_use_this_root
    analysis: Formal invalidity belongs to LOG unless an additional WRN claim says
      it is adverse in the relevant context.
  future_compound_examples:
  - WRN:000 + MAT/LIF supplies the physical or living bearer and concrete harm mechanism
