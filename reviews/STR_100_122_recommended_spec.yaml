  proposal_status: canonical_by_delegated_approval
  proposed_title: completed internal reconfiguration
  invariant_definition: Completion of a structural transformation that changes how
    a reference structure's own constituents occupy its internal positions.
  semantic_center: 'substrate-neutral structural transformation: internal reconfiguration,
    target incorporation, and multi-structure integration'
  address_justification:
    first_trit_1: Selects a structural process, action, or transformation rather than
      a structural locus, entity condition, capacity, or relationship.
    second_trit: 'Selects inward/self scope: this root reassigns a reference structure''s
      own constituents among its internal positions while preserving that structure
      as the reference whole; no competing family or temporal phase is added by this
      axis.'
    third_trit: Selects the completed phase of the same internal-reconfiguration process;
      planning, queueing, schedule, futurity, permission, probability, and runtime
      truth status remain separate.
  inclusion_boundary: Includes only a completed substrate-neutral structural transformation
    that reassigns a reference structure's own constituents among its internal positions
    while preserving that structure as the reference whole. Changing the structure's
    position inventory itself, adding an outside target, or forming a higher-order
    whole requires a different structural claim. The transformation may be realized
    physically, computationally, institutionally, or conceptually, but it does not
    itself assert motion, material change, creation, repair, communication, rule change,
    data migration, temporal scheduling, function, safety, or success criteria beyond
    achieving the invariant result for a completed root.
  excluded_meanings:
  - The constituent position, interface, composite arrangement, constituent, target,
    material object, participant, or data record as an entity or condition.
  - Spatial movement, route traversal, physical deformation, joining force, enclosure,
    fabrication, construction, destruction, or generation as such.
  - Planning, intention, staging, queueing, scheduling, permission, readiness, probability,
    futurity, obligation, or specification—especially for lexical 1x2.
  - Repair, restoration, reinforcement, stabilization, damage correction, success,
    fitness, integrity, function, or operational deployment.
  - Communication, coordination, consensus, mental reclassification, schema-document
    editing, role authority, or institutional identity.
  - Support, containment, attachment, dependency, fit, membership, compatibility,
    or other continuing relation after the transformation.
  nearest_neighbors:
  - STR:101
  - STR:102
  - STR:110
  - STR:120
  - STR:000
  - STR:200
  same_family_contrast: 'STR:0xx owns constituent positions, structural interfaces,
    and composite arrangements as entities or conditions. STR:1xx owns changes in
    how constituents or structures participate in those arrangements. STR:2xx remains
    reserved for capacities and continuing relations such as support, containment,
    dependency, fit, attachment, or systemic compatibility. Target incorporation is
    asymmetric: the reference remains the whole and one external target becomes its
    constituent. Systemic integration is higher-order: every input structure becomes
    a co-constituent of a composite distinct from any one input. A completed STR:1xx
    root entails only the structural result stated in its invariant at the completion
    reference time; it does not entail persistence, function, integrity, or any STR:2xx
    relation unless separately asserted.'
  cross_family_comparisons: &1
    LIF: LIF owns living identity, participant status, collectives, and institutions
      as social entities. STR may reorganize their structural arrangement but does
      not define organismic or social identity.
    MOV: MOV owns position, route, displacement, and traversal. A constituent may
      move during reconfiguration or incorporation, but STR names the resulting change
      in part–whole organization rather than its spatial path.
    MAT: MAT owns physical substance, shape, deformation, joining, and material assembly.
      STR abstracts the change in constituent positions and part–whole organization
      across physical, software, conceptual, and institutional substrates.
    MIN: MIN owns attention, belief, interpretation, and revision of a mental model.
      Conceiving or planning a new arrangement is mental activity; STR applies only
      when the structural transformation itself is asserted.
    CON: CON owns communicative exchange, participant channels, and connection relations.
      Coordination messages can support integration, but transmitting or agreeing
      is not itself structural integration.
    WRN: WRN owns instability, damage, mismatch, collapse, and risk. STR transformations
      are neutral about whether a prior arrangement was defective or whether the new
      arrangement is safe.
    REP: REP owns restoration after loss or failure. Reconfiguration and integration
      may be preventive, exploratory, or neutral; repair is expressed separately when
      restoration is essential.
    LOG: LOG owns rules, permissions, constraints, compatibility, roles, and validity.
      A rule may permit incorporation or integration, but STR names the actual or
      nonactualized structural transformation rather than its authorization.
    DAT: DAT owns blueprints, schemas, configuration records, and migrations of information
      representations. STR names transformation of the represented or instantiated
      arrangement, not editing the record that describes it.
    CRE: CRE owns generation, design, construction, and production of new entities.
      STR transformation may reorganize already identified structures without asserting
      that any constituent or whole was newly created.
    ORI: ORI owns time, modality, existence, and ontological transition. Lexical STR:1x2
      selects a nonactualized structural process but does not itself encode plan,
      schedule, futurity, possibility strength, or eventual realization.
  runtime_state_interpretation:
    '0': Denies that this internal-reconfiguration process reached completion in the
      stated structural context; it does not assert that the active or nonactualized
      sibling holds.
    '1': Affirms that this internal-reconfiguration process reached its completed
      phase, without asserting success criteria, integrity, function, permanence,
      repair, or creation beyond the invariant.
    2/num: Leaves unresolved whether this internal-reconfiguration process reached
      completion or whether that completed result remains applicable; the lexical
      root stays completed.
  lexical_runtime_distinction: The lexical third trit permanently selects the completed
    member of this process triplet. Runtime `[2]/num` instead qualifies the truth,
    applicability, or resolution of a token of that already-selected root; it never
    changes the root into a planned, future, or different-phase process.
  catalogue_title_guard: The concise catalogue title is controlled by the invariant
    definition and must not be broadened with unstated result, function, or temporal
    semantics.
  examples:
  - category: ordinary_conversation
    semantic_graph: STR:100[1](STRUCTURE=closet,CONSTITUENTS=clothes)
    literal_gloss: completed internal reconfiguration
    natural_english: We reorganized the closet by assigning its own clothes to different
      positions.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference structure or containing arrangement
      middle: structural transformation
      high: constituent, distinct target, or participating structure
      sustained: composite structural context
    use_status: valid
    analysis: The reference whole is preserved and only assignments of its own constituents
      are changed. The assertion does not add tidiness, usefulness, or approval.
  - category: physical_or_spatial
