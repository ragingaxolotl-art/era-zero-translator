    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference structure or containing arrangement
      middle: structural transformation
      high: constituent, distinct target, or participating structure
      sustained: composite structural context
    use_status: valid
    analysis: The reference whole is preserved and only assignments of its own constituents
      are changed. MAT owns physical substance and force; STR owns the part–whole
      transformation.
  - category: temporal_or_sequential
    semantic_graph: STR:100[1](STRUCTURE=closet)+ORI(INTERVAL=maintenance_window)
    literal_gloss: completed internal reconfiguration during an explicit interval
    natural_english: During the maintenance window, we reorganized the closet by assigning
      its own clothes to different positions.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference structure or containing arrangement
      middle: structural transformation
      high: constituent, distinct target, or participating structure
      sustained: composite structural context
    use_status: valid
    analysis: ORI supplies temporal location; lexical phase is not tense or schedule.
  - category: cross_family_compound
    semantic_graph: DAT(BLUEPRINT=b)+LOG(PERMIT=true)+STR:100[1](STRUCTURE=closet,CONSTITUENTS=clothes)
    literal_gloss: blueprint and permission plus completed internal reconfiguration
    natural_english: The blueprint and rule describe an authorized transformation;
      the STR process has the stated phase.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference structure or containing arrangement
      middle: structural transformation
      high: constituent, distinct target, or participating structure
      sustained: composite structural context
    use_status: valid
    analysis: The reference whole is preserved and only assignments of its own constituents
      are changed. DAT and LOG remain separate from whether the structural transformation
      occurs.
  - category: executable_or_programming
    semantic_graph: STR:100[1](STRUCTURE=object_layout,CONSTITUENTS=fields)
    literal_gloss: assert completed internal reconfiguration
    natural_english: The object's existing fields completed reassignment among its
      internal slots.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: reference structure or containing arrangement
      middle: structural transformation
      high: constituent, distinct target, or participating structure
      sustained: composite structural context
    use_status: valid
    analysis: The reference whole is preserved and only assignments of its own constituents
      are changed. Data migration, dependency validity, and process success require
      separate DAT/LOG/WRN assertions.
    pseudocode: assert(structural_process.matches?("STR:100"))
  - category: counterexample
    semantic_graph: MOV(PATH=crate_route)
    literal_gloss: crate follows a route
    natural_english: The crate moved across the room.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference structure or containing arrangement
      middle: structural transformation
      high: constituent, distinct target, or participating structure
      sustained: composite structural context
    use_status: must_not_use_this_root
    analysis: Movement changes spatial position but need not change any constituent-to-position
      assignment.
  future_compound_examples:
  - STR:100 + STR:0xx identifies the constituent positions, interface, or composite
