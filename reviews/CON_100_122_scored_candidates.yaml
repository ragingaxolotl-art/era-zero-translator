      why_it_fits: Every root is one communicative availability process; source, target,
        and shared scope follow the second trit exactly, while the third trit changes
        only realization phase.
      useful_coverage: It covers saying, signaling, publishing, receiving, hearing-at-an-endpoint,
        multicasting, broadcasting, and formal send/receive/distribute operations
        without absorbing their content.
      semantic_territory_consumed: 'Only participant-addressed exchange: making an
        expression available from a source, taking it up at a target, or making it
        available across a shared channel to multiple endpoints.'
