  - candidate_id: access_and_reachability
    title: persistent network access
    invariant_candidate: A enduring condition of operational access or reachability
      at endpoint-internal scope.
    analysis:
      why_it_fits: Access and reachability sound like capacities or endpoint relations,
        and stable/active/dormant or unresolved conditions are natural.
      useful_coverage: It would compactly express online, offline, accessible, reachable,
        unreachable, addressable, and network-access states.
      semantic_territory_consumed: Operational availability under physical paths,
        permissions, protocols, failures, addresses, and network configuration.
      conflicts_or_future_limitations: Reachability is normally a LOG conclusion over
        MOV/STR paths, MAT interfaces, WRN faults, and permissions; treating it as
        atomic hides the reason and collides with runtime state.
