  - candidate_id: capacity_and_participant_relations
    title: enduring communicative participation capacity
    invariant_candidate: A persistent capacity of an endpoint to participate in communicative
      exchange.
    analysis:
      why_it_fits: The first trit remains capacity/relationship, the second trit alone
        selects self capacity, directed target relation, or shared relation, and the
        third trit alone selects its lexical condition.
      useful_coverage: It covers can-communicate, presently communicatively available,
        dormant capability, persistent contact relation, operative target relation,
        unresolved contact relation, and stable, operative, or potential group participation.
      semantic_territory_consumed: Only substrate-neutral communicative affordance
        and participant relations; endpoints, channels, traffic, messages, cognition,
        topology, policy, and physical carriers remain separate.
      conflicts_or_future_limitations: It intentionally requires compounds for online
        status, friendship, permission, protocol compatibility, reachability, conversation,
        subscription, network topology, and group identity.
    scores:
      atomicity: 10
