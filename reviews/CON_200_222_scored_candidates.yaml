    analysis:
      why_it_fits: The Phase 2 title follows the endpoint-internal and enduring slot
        labels and chooses a familiar Connection-domain use.
      useful_coverage: It directly covers ordinary or technical ideas associated with
        stable connectivity.
      semantic_territory_consumed: Across the block it consumes mixtures of ability,
        receiving, responding, translation, social bonds, active message exchange,
        identity, reachability, compatibility, routing, and community.
      conflicts_or_future_limitations: The siblings do not preserve one invariant
        axis; entity, process, capacity, social, topology, protocol, and modal claims
        are mixed, so downstream composition would be unstable.
