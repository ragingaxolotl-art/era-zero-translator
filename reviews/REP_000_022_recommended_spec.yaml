    analysis: MAT supplies physical facts; REP supplies restoration-relative condition
      status.
  - category: temporal_or_sequential
    semantic_graph: REP:000[1](ENTITY=e,CONDITION=c)+ORI(INTERVAL=w)
    literal_gloss: internal restoration condition during interval w
    natural_english: During the inspection interval, the entity has the stated internal
      restoration-condition status.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or target whose restoration condition is asserted
      middle: acceptable restoration condition as the asserted figure
      high: distinct target or restoration-frame reference
      sustained: shared system and the participants bearing one correlated restoration
        condition
    use_status: valid
    analysis: ORI supplies time; the lexical third trit supplies realization status,
      not tense.
  - category: cross_family_compound
    semantic_graph: DAT(RECORD=d)+LOG(CRITERION=k)+REP:000[1](ENTITY=e,CONDITION=c)
    literal_gloss: record and criterion plus internal restoration condition
    natural_english: The record and criterion describe the accepted condition without
      becoming that condition.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or target whose restoration condition is asserted
      middle: acceptable restoration condition as the asserted figure
      high: distinct target or restoration-frame reference
      sustained: shared system and the participants bearing one correlated restoration
        condition
    use_status: valid
    analysis: DAT and LOG may specify a reference; REP asserts restoration-relative
      condition identity or realization.
  - category: executable_or_programming
    semantic_graph: REP:000[1](ENTITY=service,CONDITION=known_good)
    literal_gloss: assert persistent internal restoration condition
    natural_english: The service object retains one accepted internal operating condition
      across deployments.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: reference entity or target whose restoration condition is asserted
      middle: acceptable restoration condition as the asserted figure
      high: distinct target or restoration-frame reference
      sustained: shared system and the participants bearing one correlated restoration
        condition
    use_status: valid
    analysis: The predicate concerns the service's condition, not the checkpoint record
