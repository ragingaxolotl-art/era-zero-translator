  proposal_status: canonical_by_delegated_approval
  proposed_title: persistent internal restoration condition
  invariant_definition: An acceptable condition internal to one reference entity that
    remains identified as that entity's restoration standard independently of whether
    it is presently realized.
  semantic_center: 'restoration-condition entities: internal, target-oriented, and
    shared acceptable conditions'
  address_justification:
    first_trit_0: 'Selects an entity or condition: persistent internal restoration
      condition is an acceptable restoration condition, not a restoration process,
      capacity, enabling relation, resource, record, rule, or schedule.'
    second_trit: 'Selects inward/self scope: one acceptable restoration condition
      internal to one reference entity and no other Repair-family column.'
    third_trit: Selects the persistent/realization-neutral member by condition identity
      or present realization while leaving runtime truth status, observer knowledge,
      tense, probability, and restoration process separate.
  inclusion_boundary: Includes only the persistent internal restoration condition
    as a substrate-neutral claim about one acceptable restoration condition internal
    to one reference entity. The claim is about the entity's own restoration condition,
    not a condition assigned to another target, an observer's judgment, or a baseline
    record. It is neutral about physical or biological constitution, observer knowledge,
    record accuracy, formal validity, damage, fault, repair method, recoverability,
    probability, timing, and cause.
  excluded_meanings:
  - The person, organism, material object, software component, institution, or system
    that bears, defines, observes, records, or realizes the restoration condition.
  - Physical intactness, biological health, logical validity, data correctness, cleanliness,
    availability, or social reconciliation without the separate restoration-relative
    claim.
  - Damage, fault, hazard, degradation, injury, illness, error, outage, conflict,
    or any other adverse condition merely because restoration might be desirable.
  - Baseline record, checkpoint, backup, golden image, measurement, diagnosis, belief,
    criterion, policy, acceptance rule, or evidence about the condition.
  - Repairing, healing, recalibrating, restoring, maintaining, replacing, rebuilding,
    recovering, or coordinating restoration as a process.
  - Repairability, recoverability, restorative capacity, remedy resource, caregiver,
    service relationship, scheduled restoration, future realization, cause, or guarantee
    of success.
  nearest_neighbors:
  - REP:001
  - REP:002
  - REP:010
  - REP:020
  - REP:100
  - REP:200
  same_family_contrast: "`REP:0xx` owns restoration conditions as entities; `REP:1xx`
    remains the layer for actual restoration processes; `REP:2xx` remains the layer
    for recoverability, repairability, and enabling restoration relations. Present
    realization in 0xx does not name the process that achieved or maintains it, and
    an identified restoration condition does not entail that restoration is possible.
    The persistent member is realization-neutral: it may co-occur with the manifest
    sibling or the dormant sibling at the same reference time. It asserts continuity
    of restoration-condition identity rather than a third mutually exclusive realization
    value."
  cross_family_comparisons: &1
    LIF: LIF owns living identity, biological health, injury, illness, care roles,
      and social collectives. REP can identify a restoration condition for a living
      participant, but it does not define physiology, subjective well-being, or social
      identity.
    MOV: MOV owns position, return, approach, traversal, and shared motion. Returning
      to a place can participate in restoration, but REP names an acceptable restored
      condition rather than a displacement or route.
    MAT: MAT owns substance, energy, physical integrity, force, contact, fracture,
      and shape. REP adds restoration-relative acceptability; an intact material object
      need not be restored, and a restored condition need not be physical.
    MIN: MIN owns belief, memory, attention, intention, satisfaction, and perceived
      normality. A restoration condition may be unknown or disputed and still remain
      identified; observer uncertainty is runtime or MIN, not lexical dormancy.
    CON: CON owns care communication, service requests, coordination, and participant
      exchange. Communicating or coordinating repair does not constitute a restored
      condition.
    WRN: WRN owns faults, hazards, degradation, impairment, propagation, susceptibility,
      exposure, and adverse pathways. A dormant REP restoration condition does not
      assert damage or danger; WRN must separately state the adverse condition or
      process.
    STR: STR owns positions, interfaces, arrangements, transformations, and structural
      affordances. A restoration condition may include structural facts, but REP does
      not replace the arrangement or topology itself.
    LOG: LOG owns correctness, validity, rule satisfaction, permission, and constraints.
      A logically valid state need not be the restoration condition, and restoration-relative
      acceptability may be contextually defined without becoming formal truth.
    DAT: DAT owns baselines, checkpoints, backups, records, measurements, schemas,
      and provenance. A record may describe or preserve a restoration condition but
      is not the condition itself.
    CRE: CRE owns generation, fabrication, replacement, reconstruction, and destruction
      as transformations. A new or recreated artifact may realize restoration, but
      creation is not identical to the acceptable condition achieved.
    ORI: ORI owns time, prior states, manifestation, possibility, and necessity. REP
      persistent, manifest, and dormant statuses are restoration-specific and never
      encode pastness, futurity, probability, or unrestricted modality.
  runtime_state_interpretation:
    '0': Denies that this internal restoration condition remains identified as the
      applicable restoration standard; it does not select the manifest or dormant
      sibling and does not establish a different acceptable condition.
    '1': Affirms the continuing identity of this internal restoration condition without
      deciding whether it is presently realized, how it was established, whether it
      is recorded, or whether restoration is possible.
    2/num: Leaves unresolved whether the persistent internal restoration condition
      remains identified; the token stays the stable lexical root and does not become
      the manifest or dormant sibling.
  lexical_runtime_distinction: Lexical third trit `0` permanently selects the persistent/realization-neutral
    member of this restoration-condition triplet. Runtime `[2]/num` instead leaves
    the truth or applicability of that already-selected root unresolved; it never
    changes realization status. Thus a dormant root affirmed with `[1]` is a confirmed
    identified-but-unrealized condition, while a persistent or manifest root carrying
    `[2]/num` remains lexically persistent or manifest but uncertain as a token claim.
  examples:
  - category: ordinary_conversation
    semantic_graph: REP:000[1](ENTITY=e,CONDITION=c)
    literal_gloss: affirm persistent internal restoration condition
    natural_english: This account's acceptable internal condition remains the same
