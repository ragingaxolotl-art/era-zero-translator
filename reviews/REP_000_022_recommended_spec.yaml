    natural_english: The service is currently recovering.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or target whose restoration condition is asserted
      middle: acceptable restoration condition as the asserted figure
      high: distinct target or restoration-frame reference
      sustained: shared system and the participants bearing one correlated restoration
        condition
    use_status: must_not_use_this_root
    analysis: An occurring restoration process belongs to REP:1xx, not this condition/entity
      block.
  future_compound_examples:
  - REP:000 + MAT/LIF supplies the physical or living bearer and concrete acceptable
