  recommended_title: persistent material substrate
  invariant_definition: The enduring matter that constitutes a focal entity's physical
    body.
  confidence: 0.95
  semantic_boundaries:
  - Includes the constitutive matter of the focal bearer at a stable descriptive scale.
  - May describe biological bodies, machines, artifacts, or explicitly physical computational
    models.
  - Does not assert that the substrate is healthy, structurally sound, alive, conscious,
    powered, or currently active.
  excluded_meanings:
  - Present energetic activity of the substrate is MAT:001.
  - Dormant substrate is MAT:002.
  - An external object is MAT:010–012; a collective aggregate is MAT:020–022.
  - Identity belongs to LIF, organization and boundaries to STR, damage to WRN, repair
    to REP, and load-bearing capacity to the later MAT:200 review.
  nearest_mat_contrasts:
    MAT:001: same focal substrate in a lexically active physical state
    MAT:002: same focal substrate in a lexically dormant physical state
    MAT:010: a distinct external object rather than the focal bearer's constitutive
      matter
    MAT:200 candidate layer: capacity to withstand load or disruption, not the substrate
      entity itself
  cross_family_comparisons:
    LIF: LIF owns living identity, consciousness, viability, and vitality. MAT:000
      denotes a stable focal material substrate and never implies life.
    MOV: MOV owns position and displacement. Movement alone does not make this MAT
      root active; material energetic state must be independently foregrounded.
    MIN: MIN owns attention, perception, intention, and mental state. Mental activation
      or an idea of an object is not the material entity.
    CON: CON owns ownership, access, linkage, communication, and coordination. Those
      relations may connect to the focal material substrate but are not part of it.
    STR: STR owns boundary rules, topology, containment, organization, and functional
      system structure. MAT owns physical substance/entity state only.
    WRN: WRN owns damage, hazard, failure, corruption, and risk. A stable material
      entity is not necessarily safe, intact, or failed.
    REP: REP owns repair, healing, and restoration. A repaired result may use MAT,
      but repair status is not material entity phase.
    LOG: LOG owns classification rules, permission, quantities as formal values, and
      constraint judgments. Validity or availability is not built into this MAT atom.
    DAT: DAT owns records, sensor readings, models, and identifiers. Information about
      a focal material substrate is not the physical referent.
    CRE: CRE owns design, fabrication, generation, and transformation. Natural or
      manufactured origin does not change the MAT entity invariant.
    ORI: ORI owns existence, reality, universality, and ontological possibility. MAT
      applies only when a physical substrate/object/aggregate is asserted.
  address_explanation:
    first_trit_0: Selects a physical entity, substance, or condition rather than a
      material event or capacity.
    second_trit: Inward/self/source selects the focal bearer's constitutive substrate.
    third_trit: Stable/bounded selects enduring or established material entity status.
  runtime_state_interpretations:
    '0': Denies that the asserted persistent material substrate constitutes the focal
      entity.
    '1': Affirms the substrate as a valid enduring physical bearer, regardless of
      whether it is active.
    '2': Marks the truth, availability, or identification of that stable-substrate
      assertion as dormant, remembered, possible, or unresolved; it does not select
      lexical MAT:002.
  ordinary_language_examples:
  - semantic_graph: MAT:000[1](BEARER=robot)
