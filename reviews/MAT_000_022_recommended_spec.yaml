    role_registers:
      low: focal bearer or source
      middle: MAT entity/condition
      high: external object or result when present
      sustained: physical environment or persistent condition when present
  - semantic_graph: MAT:000[1](BEARER=tree)
    literal_gloss: tree; enduring constitutive matter
    natural_english: The tree's material body remains present.
    runtime_state: 1
    contour: declarative
    role_registers:
      low: focal bearer or source
      middle: MAT entity/condition
      high: external object or result when present
      sustained: physical environment or persistent condition when present
  - semantic_graph: MAT:000[1](BEARER=ship)
    literal_gloss: ship; persistent physical substrate
    natural_english: The ship remains materially embodied even while inactive.
    runtime_state: 1
    contour: declarative
    role_registers:
      low: focal bearer or source
      middle: MAT entity/condition
      high: external object or result when present
      sustained: physical environment or persistent condition when present
  technical_programming_examples:
  - semantic_graph: MAT:000[1](BEARER=device,SUBSTRATE=hardware)
    interpretation: Declares the enduring physical bearer without asserting operational
      state.
    pseudocode: assert physical_substrate(device) == hardware
    runtime_state: 1
  - semantic_graph: MAT:000[1](BEARER=agent,MODEL=physical)
    interpretation: Types an explicitly physical agent as materially instantiated.
    pseudocode: type(agent).includes(:material_substrate)
    runtime_state: 1
