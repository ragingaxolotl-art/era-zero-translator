  - candidate_id: protective_affordance
    title: persistent internal resistance capacity
    invariant_candidate: The persistent internal resistance capacity by which adverse
      transformation at the selected scope can be prevented from being realized.
    analysis:
      why_it_fits: Resistance, shielding, and systemic containability are plausible
        Warning-related capacities at inward scope and support all three lexical statuses.
