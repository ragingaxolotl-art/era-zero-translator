  - candidate_id: adverse_observability
    title: persistent internal fault observability
    invariant_candidate: The persistent internal fault observability by which evidence
      of an adverse condition at the selected scope can be made available to an observer.
    analysis:
      why_it_fits: Detectability of internal faults, target threats, and systemic
        incidents is important to warning systems and can be expressed at persistent
        inward scope.
      useful_coverage: It would cover observability, diagnosability, monitor coverage,
        alarm reach, traceability, and incident visibility.
      semantic_territory_consumed: It consumes evidence acquisition and interpretation
        rather than the adverse capacity or relation itself.
      conflicts_or_future_limitations: DAT owns observations and records, MIN owns
        recognition and belief, CON owns alert delivery, and harm can be enabled even
        when completely unobservable.
