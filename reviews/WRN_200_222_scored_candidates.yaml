    analysis:
      why_it_fits: Risk, likelihood, and impact are natural Warning-family relations
        and can be scoped inward, toward a target, or across a system.
      useful_coverage: It would cover risk scores, attack likelihood, expected loss,
        severity, confidence, and catastrophe forecasts.
