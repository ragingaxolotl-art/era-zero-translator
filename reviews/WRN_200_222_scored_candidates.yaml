  - candidate_id: adverse_affordance
    title: persistent internal susceptibility
    invariant_candidate: A persistent susceptibility of one reference entity to undergo
      internally originating degradation under qualifying conditions, independently
      of whether that susceptibility is presently operative.
    analysis:
      why_it_fits: It makes first-trit 2 the capacity or qualifying relation for the
        matching canonical WRN:10x transformation while preserving inward scope and
        persistent expression.
      useful_coverage: It covers vulnerability, exposure, attack surface, propagation
        paths, contagion routes, fault trees, and failure channels in ordinary safety,
        software, networks, and mathematics.
      semantic_territory_consumed: Only the substrate-neutral adverse affordance that
        enables internal susceptibility. Actual faults, hazards, processes, mechanics,
        evidence, risk estimates, controls, and modality remain separate.
      conflicts_or_future_limitations: The technical word pathway must be restricted
        to adverse enablement rather than physical or communicative route identity,
        but the invariant and compounds make that boundary explicit.
    scores:
      atomicity: 10
