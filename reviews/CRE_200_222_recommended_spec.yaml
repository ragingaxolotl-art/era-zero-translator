  - CRE:122
  same_family_contrast: "`CRE:0xx` owns generative patterns, generated artifacts,
    and shared generative repertoires as entities. `CRE:1xx` owns the corresponding
    completed, active, or nonactualized productive transformations. `CRE:2xx` owns
    only typed productive enablement: internal pattern-forming capacity, source-artifact
    generative relations, and systemic co-generative capacity. A manifest pattern
    does not entail capacity, an affordance does not entail an actual process, and
    a completed process does not entail continuing capacity, quality, or authorship.
    Persistent identity may co-occur with operative or latent status; operative and
    latent are mutually exclusive for the same affordance at one reference time. Lexical
    latency affirms an existing but nonoperative affordance; runtime `[2]/num` separately
    marks uncertainty about any selected status."
  cross_family_comparisons: *1
  runtime_state_interpretation:
    '0': Denies that this systemic co-generative capacity exists as the stated nonoperative
      productive affordance; it does not establish that an operative sibling holds
      or that the process is impossible.
    '1': Affirms this systemic co-generative capacity as existing but not presently
      operative, without encoding hiddenness, uncertainty, probability, future activation,
      missing resources, or permission.
    2/num: Leaves unresolved even the assertion that this latent systemic co-generative
      capacity exists; lexical latency remains distinct from runtime assertion-level
      uncertainty.
  lexical_runtime_distinction: Lexical third trit `2` permanently selects the latent
    status of this productive affordance. Runtime `[2]/num` instead leaves the already-selected
    status claim unresolved; it never changes affordance status. Thus a latent root
    affirmed with `[1]` is a confirmed existing-but-nonoperative productive affordance,
    while a persistent or operative root carrying `[2]/num` remains lexically persistent
    or operative but uncertain as a token claim.
