      shared production domain with capacity for one jointly constituted result and
      no other Creation-family column.'
    third_trit: Selects the latent status of the same productive affordance while
      leaving runtime truth status, actual production, quality, authorship, observer
      knowledge, tense, probability, permission, and scheduling separate.
  inclusion_boundary: Includes only the latent systemic co-generative capacity as
    a substrate-neutral productive-process affordance at systemic scope. The capacity
    requires multiple participants whose coordinated productive contributions can
    constitute one joint result. Independent productive capacities or collaboration
    alone do not constitute one systemic affordance. It is neutral about Creation-entity
    identity, mental agency, physical medium, formal algorithm, structural mechanics,
    creator role, authorship, originality, quality, value, resource sufficiency, scheduling,
    probability, timing, and cause.
  excluded_meanings:
  - The generative pattern, generated artifact, or shared generative repertoire as
    an entity, and its persistent, manifest, or dormant status.
  - The completed, active, or nonactualized pattern-formation, artifact-generation,
    or systemic co-generation process and any quality result.
  - Mental imagination, general agency, specific encodings, formal algorithms, physical
    tools, media, structural arrangements, credentials, or computational resources.
  - Physical, biological, communicative, cognitive, informational, logical, structural,
    restorative, or adverse capacity or transformation.
  - Authorship, attribution, provenance, originality, ownership, authority, formal
    possibility, composability alone, quality, performance, or resource sufficiency.
  - Observer knowledge, evidence, intention, plan, readiness, queue, schedule, future
    time, unrestricted possibility, necessity, probability, or cause.
  nearest_neighbors:
  - CRE:220
  - CRE:221
