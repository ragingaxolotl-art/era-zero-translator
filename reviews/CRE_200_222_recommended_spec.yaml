  - category: cross_family_compound
    semantic_graph: CRE:001[1](PATTERN=p)+CRE:200[1](ENTITY=studio,PATTERN=p)+DAT(REPRESENTATION=d)
    literal_gloss: manifest generative pattern plus persistent productive affordance
