  - category: temporal_or_sequential
    semantic_graph: CRE:200[1](ENTITY=studio,PATTERN=p)+ORI(INTERVAL=w)
    literal_gloss: persistent productive affordance during interval w
    natural_english: During interval w, the productive affordance has the stated lexical
