    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity, production source, or participant bearing the productive
        affordance
      middle: productive capacity or generative relation as the asserted figure
      high: generative pattern, prospective artifact, or jointly constituted result
      sustained: shared production domain and multiple co-generative participants
    use_status: valid
    analysis: Entity, affordance, and representation remain distinct.
  - category: executable_or_programming
    semantic_graph: CRE:200[1](ENTITY=studio,PATTERN=p)
    literal_gloss: assert persistent productive affordance
    natural_english: A runtime tracks whether the selected generative affordance has
      the stated status without asserting execution, completion, or output quality.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: reference entity, production source, or participant bearing the productive
        affordance
      middle: productive capacity or generative relation as the asserted figure
      high: generative pattern, prospective artifact, or jointly constituted result
      sustained: shared production domain and multiple co-generative participants
    use_status: valid
    analysis: Capability, process, and result remain distinct.
    pseudocode: assert(productive_affordance.status == "CRE:200")
  - category: counterexample
    semantic_graph: CRE:101[1](ENTITY=studio,PATTERN=p)
    literal_gloss: active internal pattern formation
    natural_english: The productive transformation is running now.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity, production source, or participant bearing the productive
        affordance
      middle: productive capacity or generative relation as the asserted figure
      high: generative pattern, prospective artifact, or jointly constituted result
      sustained: shared production domain and multiple co-generative participants
    use_status: must_not_use_this_root
    analysis: Use CRE:1xx for the actual process; CRE:200 names only its enabling
      capacity or relation.
  future_compound_examples:
  - CRE:200 + CRE:0xx supplies the generative pattern, generated artifact, or shared
