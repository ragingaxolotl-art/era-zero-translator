  proposal_status: canonical_by_delegated_approval
  proposed_title: persistent internal pattern-forming capacity
  invariant_definition: A persistent capacity within one reference entity to form
    or modify a generative pattern while retaining it within that entity, independently
    of whether that capacity is presently operative.
  semantic_center: 'productive-process affordances: internal pattern-forming capacity,
    source-artifact generative relations, and systemic co-generative capacity'
  address_justification:
    first_trit_2: Selects a productive-process capacity or qualifying generative relation
      rather than a Creation entity, actual productive process, creator, physical
      mechanism, result value, or unrestricted modality.
    second_trit: 'Selects inward/self scope: one reference entity and its capacity
      to form or modify a retained generative pattern and no other Creation-family
      column.'
    third_trit: Selects the persistent status of the same productive affordance while
      leaving runtime truth status, actual production, quality, authorship, observer
      knowledge, tense, probability, permission, and scheduling separate.
  inclusion_boundary: Includes only the persistent internal pattern-forming capacity
    as a substrate-neutral productive-process affordance at inward scope. The capacity
    concerns productive formation or modification of a generative pattern retained
    within one entity and does not itself produce an outward artifact. The pattern,
    algorithm, medium, actual transformation, and result remain separate. It is neutral
    about Creation-entity identity, mental agency, physical medium, formal algorithm,
    structural mechanics, creator role, authorship, originality, quality, value, resource
    sufficiency, scheduling, probability, timing, and cause.
  excluded_meanings:
  - The generative pattern, generated artifact, or shared generative repertoire as
    an entity, and its persistent, manifest, or dormant status.
  - The completed, active, or nonactualized pattern-formation, artifact-generation,
    or systemic co-generation process and any quality result.
  - Mental imagination, general agency, specific encodings, formal algorithms, physical
    tools, media, structural arrangements, credentials, or computational resources.
  - Physical, biological, communicative, cognitive, informational, logical, structural,
    restorative, or adverse capacity or transformation.
  - Authorship, attribution, provenance, originality, ownership, authority, formal
    possibility, composability alone, quality, performance, or resource sufficiency.
  - Observer knowledge, evidence, intention, plan, readiness, queue, schedule, future
    time, unrestricted possibility, necessity, probability, or cause.
  nearest_neighbors:
  - CRE:201
  - CRE:202
  - CRE:210
  - CRE:220
  - CRE:000
  - CRE:100
  same_family_contrast: "`CRE:0xx` owns generative patterns, generated artifacts,
    and shared generative repertoires as entities. `CRE:1xx` owns the corresponding
    completed, active, or nonactualized productive transformations. `CRE:2xx` owns
    only typed productive enablement: internal pattern-forming capacity, source-artifact
    generative relations, and systemic co-generative capacity. A manifest pattern
    does not entail capacity, an affordance does not entail an actual process, and
    a completed process does not entail continuing capacity, quality, or authorship.
    Persistent identity may co-occur with operative or latent status; operative and
    latent are mutually exclusive for the same affordance at one reference time. Lexical
    latency affirms an existing but nonoperative affordance; runtime `[2]/num` separately
    marks uncertainty about any selected status."
  cross_family_comparisons: &1
    LIF: LIF owns living identities, biological capacities, agents, and social roles.
      A living creator may bear a productive affordance, but CRE:2xx does not encode
      organism, personhood, office, institutional role, or agency in general.
    MOV: MOV owns position, routes, displacement, and motion affordances. Material
      or informational inputs may move during production, but CRE:2xx asserts generative
      enablement rather than spatial reachability.
    MAT: MAT owns substance, energy, force, contact, material compatibility, and physical
      capacities. Tools and media may realize a generative affordance, but CRE:2xx
      remains substrate-neutral.
    MIN: MIN owns imagination, intention, attention, understanding, and cognitive
      capacities. Productive affordance can exist without awareness or imagination,
      and imagination alone does not establish CRE:2xx.
    CON: CON owns linkage, communication, participation, authority, and interaction
      channels. Coordination can support co-generation, but CRE:2xx requires typed
      enablement for one productive transformation rather than interaction alone.
    WRN: WRN owns hazards, faults, adverse processes, susceptibility, exposure, and
      propagation pathways. A blocked productive affordance may be adverse, but CRE:2xx
      does not assert failure, danger, or vulnerability.
    STR: STR owns arrangements, interfaces, dependencies, structural compatibility,
      and reconfiguration affordances. Structure may enable production, but CRE:2xx
      requires form-producing function rather than composability alone.
    REP: REP owns restoration conditions, transformations, and affordances. Reconstruction
      may use a generative affordance, but CRE:2xx does not entail return to a prior
      acceptable state.
    LOG: LOG owns formal constraints, evaluations, applicability, and evaluability.
      Rules may govern a generator, but CRE:2xx does not assert admissibility, computability,
      or formal validity.
    DAT: DAT owns represented information and data-process affordances. Encoded templates
      and algorithms may implement CRE:2xx, but information transformability is not
      productive generation.
    ORI: ORI owns time, cause, provenance, unrestricted possibility, necessity, probability,
      and ontological qualification. CRE:2xx asserts a typed existing productive affordance,
      never mere possibility or causal origin.
  runtime_state_interpretation:
    '0': Denies that this internal pattern-forming capacity persists in the stated
      production context; it does not select the operative or latent sibling and does
      not establish a different agency, authorship, or quality relation.
    '1': Affirms that this internal pattern-forming capacity persists independently
      of current operation, without asserting that a productive process is occurring
      or that any result quality holds.
    2/num: Leaves unresolved whether this persistent internal pattern-forming capacity
      claim holds; runtime uncertainty does not change the lexical root into operative
      or latent status.
  lexical_runtime_distinction: Lexical third trit `0` permanently selects the persistent
    status of this productive affordance. Runtime `[2]/num` instead leaves the already-selected
    status claim unresolved; it never changes affordance status. Thus a latent root
    affirmed with `[1]` is a confirmed existing-but-nonoperative productive affordance,
    while a persistent or operative root carrying `[2]/num` remains lexically persistent
    or operative but uncertain as a token claim.
  examples:
  - category: ordinary_conversation
    semantic_graph: CRE:200[1](ENTITY=studio,PATTERN=p)
    literal_gloss: affirm persistent internal pattern-forming capacity
    natural_english: The internal pattern-forming capacity for the studio persists
