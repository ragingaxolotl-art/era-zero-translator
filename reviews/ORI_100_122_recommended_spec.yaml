  proposal_status: canonical_by_delegated_approval
  proposed_title: completed source-ground establishment
  invariant_definition: Completion of a bounded ontological transition by which one
    referent becomes grounded as a source from which another state of affairs may
    originate.
  semantic_center: 'ontological transitions: source-ground establishment, distinct
    actualization, and shared-world transition'
  address_justification:
    first_trit_1: Selects a bounded ontological transition rather than an entity condition,
      causal or modal relation, observation, representation, or physical transformation.
    second_trit: 'Selects inward/self scope: one referent undergoing establishment
      as a source-ground for another state of affairs and no other Origin-family column.'
    third_trit: Selects the completed phase of the same ontological transition while
      leaving runtime assertion status, observer knowledge, clock time, probability,
      intention, scheduling, causation, and physical mechanism separate.
  inclusion_boundary: Includes only the completed source-ground establishment as a
    substrate-neutral ontological transition at inward scope. The process changes
    source-ground status only. It does not assert a causal mechanism, creator, temporal
    schedule, physical transformation, or produced artifact. It is neutral about substance,
    location, cognition, evidence, representation, logical validity, agency, authority,
    productive method, hazard, repair, scheduling, duration, probability, and causal
    mechanism.
  excluded_meanings:
  - The source-ground, distinct-existence, or shared-world condition as an entity-layer
    state rather than its transition.
  - A causal link, physical transformation, productive act, living process, mental
    change, data operation, structural reconfiguration, warning, or repair process.
  - Observation, detectability, evidence, truth, validity, certainty, consensus, permission,
    authority, success, or result persistence.
  - Unrestricted possibility, necessity, probability, counterfactuality, intention,
    plan, readiness, schedule, queue, or future time.
  - The content of a natural law, algorithm, causal mechanism, physical mechanism,
    social convention, or formal model.
  - Any claim that completion entails persistence, that activity entails observation,
    or that nonactualization entails possibility, preparation, or futurity.
  nearest_neighbors:
  - ORI:101
  - ORI:102
  - ORI:110
  - ORI:120
  - ORI:000
  - ORI:100
  same_family_contrast: "`ORI:0xx` owns source-ground, distinct-existence, and shared-world
    conditions. `ORI:1xx` owns the corresponding bounded ontological transitions:
    source-ground establishment, distinct actualization, and shared-world transition.
    `ORI:2xx` remains reserved for causal, modal, temporal, or provenance relations
    and affordances. A condition does not entail its transition, and a completed transition
    does not entail continued persistence. Completed, active, and nonactualized are
    mutually exclusive phases of one bounded transition at one reference time. Lexical
    nonactualization asserts a typed process that is not occurring; runtime `[2]/num`
    separately marks uncertainty about any selected phase claim."
  cross_family_comparisons: &1
    LIF: LIF owns biological and social processes. ORI transition changes ontological
      standing, not life stage, agency, birth, death, or role succession.
    MOV: MOV owns displacement through space or routes. ORI transition is change in
      what obtains in a reality and never entails travel, arrival, or trajectory.
    MAT: MAT owns physical transformation, force, energy, and material state change.
      ORI transition is substrate-neutral and does not describe physical mechanics.
    MIN: MIN owns changes in attention, belief, intention, and understanding. Becoming
      conceived or believed is not the same as becoming ontologically actual.
    CON: CON owns communication, linkage, participation, and authority changes. ORI
      systemic transition does not itself assert coordination or consensus.
    WRN: WRN owns adverse transformations and propagation. An ontological transition
      is neutral about harm, fault, risk, and failure.
    STR: STR owns reconfiguration, incorporation, and integration. ORI transition
      concerns ontological standing, not arrangement or dependency change alone.
    REP: REP owns restoration toward an acceptable prior condition. ORI transition
      neither presupposes damage nor encodes return, recovery, or repair.
    LOG: LOG owns evaluation and constraint application. A proposition becoming accepted
      or valid is not a referent becoming part of reality.
    DAT: DAT owns transformation, transfer, and synchronization of represented information.
      A record appearing does not entail its referent's actualization.
    CRE: CRE owns productive generation of patterns and artifacts. ORI actualization
      may accompany creation but does not assert a producer, artifact, medium, or
      productive method.
  runtime_state_interpretation:
    '0': Denies that this source-ground establishment reached completion; it does
      not assert that the active or nonactualized sibling holds and does not reverse
      the transition.
    '1': Affirms completion of this source-ground establishment without asserting
      persistence, success under an external criterion, cause, observation, or physical
      mechanism.
    2/num: Leaves completion of this source-ground establishment unresolved; runtime
      uncertainty does not change the lexical root into active or nonactualized phase.
  lexical_runtime_distinction: Lexical third trit `0` permanently selects the completed
    phase of this ontological transition. Runtime `[2]/num` instead leaves the already-selected
    phase claim unresolved; it never changes process phase. Thus a nonactualized root
    affirmed with `[1]` confirms that the typed transition is not occurring, while
    a completed or active root carrying `[2]/num` remains lexically completed or active
    but uncertain as a token claim.
  examples:
