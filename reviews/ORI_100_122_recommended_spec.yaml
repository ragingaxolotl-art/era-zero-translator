    analysis: Ontological and material transformations remain separately typed.
  - category: temporal_or_sequential
    semantic_graph: ORI:100[1](REFERENT=source,ORIGINAND=o,REALITY=r)+ORI(INTERVAL=w)
    literal_gloss: completed ontological transition during interval w
    natural_english: During interval w, the transition has the selected lexical phase.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: referent or shared reality undergoing ontological transition
      middle: source-ground establishment, actualization, or world transition as figure
      high: resulting source status, distinct referent, or changed world condition
      sustained: relevant reality and jointly applicable world condition
    use_status: valid
    analysis: Timing does not replace completed, active, or nonactualized phase.
  - category: cross_family_compound
    semantic_graph: ORI:100[1](REFERENT=source,ORIGINAND=o,REALITY=r)+CRE(PRODUCTION=p)+DAT(REPRESENTATION=d)
    literal_gloss: ontological transition plus production plus representation
    natural_english: The referent becomes actual while its production and description
      remain separate claims.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: referent or shared reality undergoing ontological transition
      middle: source-ground establishment, actualization, or world transition as figure
      high: resulting source status, distinct referent, or changed world condition
      sustained: relevant reality and jointly applicable world condition
    use_status: valid
    analysis: Actualization, creation, and representation remain distinct.
  - category: executable_or_programming
    semantic_graph: ORI:100[1](REFERENT=source,ORIGINAND=o,REALITY=r)
    literal_gloss: assert completed ontological transition
    natural_english: A state machine records the ontological transition phase without
      conflating it with a Boolean proposition, scheduled job, or physical operation.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: referent or shared reality undergoing ontological transition
      middle: source-ground establishment, actualization, or world transition as figure
      high: resulting source status, distinct referent, or changed world condition
      sustained: relevant reality and jointly applicable world condition
    use_status: valid
