english_motion_coverage:
- english_concept: leave
  mapping_type: one root in this block
  expression: MOV:101 while under way; MOV:100 once completed
  rationale: English tense/aspect selects the phase; the atomic center is source-relative displacement.
- english_concept: depart
  mapping_type: one root in this block
  expression: MOV:101 or MOV:100
  rationale: Same source-oriented triplet as leave.
- english_concept: go
  mapping_type: compound or context-selected root
  expression: MOV:101 away from a source, MOV:111 toward a target, or MOV:121 along a system route
  rationale: English go underspecifies orientation and must not be forced into one atom.
- english_concept: approach
  mapping_type: one root in this block
  expression: MOV:111
  rationale: Active target-relative displacement.
- english_concept: arrive
  mapping_type: one root in this block
  expression: MOV:110
  rationale: Completed target-relative displacement.
- english_concept: follow
  mapping_type: compound or unresolved vocabulary gap
  expression: MOV:111 toward a moving target plus a future Motion relationship/constraint
  rationale: Following includes sustained target relation and retargeting; active approach alone is not always enough.
- english_concept: wait
  mapping_type: contour/timing grammar or unresolved vocabulary gap
  expression: A pending root may be present, but waiting itself is not MOV:102/112/122
  rationale: Waiting is duration without required displacement.
- english_concept: pause
  mapping_type: runtime state plus timing grammar
  expression: MOV:101[2], MOV:111[2], or MOV:121[2] when an active operation is suspended
  rationale: Runtime [2] suspends/defers the active operation; lexical third-trit 2 would instead name a pre-onset process.
- english_concept: stop
  mapping_type: runtime state plus contour
  expression: Active Motion root [0], often with sharply falling command contour
  rationale: Stopping terminates a currently active operation; exact cessation semantics may need later grammar.
- english_concept: continue
  mapping_type: runtime state plus contour/timing grammar
  expression: Active root [1] with continuation or repeated-loop contour where appropriate
  rationale: Continuation is aspect over an active process, not a new atomic direction.
- english_concept: cross
  mapping_type: compound
  expression: MOV:121 + MOV:020 with a boundary/route relation
  rationale: Crossing requires a boundary/path model; the route traversal supplies the Motion process.
- english_concept: return
  mapping_type: compound
  expression: MOV:111/MOV:110 with target=MOV:000; departure history may also be referenced
  rationale: Return is targetward movement whose target is a prior origin.
- english_concept: redirect
  mapping_type: compound or operation sequence
  expression: Bind a new MOV:010 target, then use MOV:112 or MOV:111; cancel/replace the earlier targetward operation
  rationale: Redirection changes a target relation rather than introducing a new displacement phase.
- english_concept: move together
  mapping_type: compound
  expression: LIF:021 collective actor + MOV:121, with coordination added later if needed
  rationale: Collective actor supplies togetherness; MOV:121 supplies shared-route traversal.
- english_concept: circulate
  mapping_type: compound plus contour
  expression: MOV:121 + MOV:020/MOV:021 + repeated-loop contour
  rationale: Looping/cycle structure is not baked into the atomic definition.
- english_concept: repeat a route
  mapping_type: compound plus contour
  expression: MOV:121 + MOV:020 + repeated-loop contour
  rationale: Repetition modifies route traversal.
- english_concept: schedule
  mapping_type: different family or later grammar
  expression: MOV:102/112/122 can be the scheduled operation, but scheduling belongs to future timing/LOG/DAT review
  rationale: The Motion root must not absorb calendar or scheduler semantics.
- english_concept: delay
  mapping_type: contour/timing grammar or unresolved vocabulary gap
  expression: Pending/suspended Motion root plus duration/cause
  rationale: Delay is a relation between expected and actual onset/progress.
- english_concept: transition
  mapping_type: context-selected family
  expression: MOV only when positions or ordered route states are explicitly modeled; STR/ORI/CRE for their own domains
  rationale: Generic change is not automatically Motion.
- english_concept: transport
  mapping_type: compound
  expression: MOV:111 or MOV:121 + MAT payload/carrier semantics
  rationale: Transport combines displacement with a material participant relation.
- english_concept: exit
  mapping_type: compound
  expression: MOV:101/MOV:100 + a STR boundary/container relation
  rationale: Leaving a bounded region adds structural boundary semantics.
- english_concept: enter
  mapping_type: compound
  expression: MOV:111/MOV:110 + a STR boundary/container relation
  rationale: Target arrival alone does not encode containment.
- english_concept: orbit
  mapping_type: compound plus contour
  expression: MOV:121 + route/cycle relation + repeated-loop contour
  rationale: Orbital geometry and repetition are not atomic here.
- english_concept: wander
  mapping_type: unresolved vocabulary gap
  expression: No forced mapping
  rationale: Wandering lacks a stable source, target, or system-route axis and may require manner/trajectory vocabulary.
- english_concept: reverse
  mapping_type: compound or unresolved vocabulary gap
  expression: Replace target/source bindings or apply a future direction relation
  rationale: Reversal is a relation between successive motion vectors, not one phase root.
