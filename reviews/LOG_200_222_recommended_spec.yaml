  later_era_notes: Later eras may lexicalize decidability, computability, tractability,
    satisfiability, entailment, consistency, permission, proof availability, and resource-bounded
    evaluation. Era Zero should preserve the substrate-neutral formal-evaluation-enablement
    center and derive stronger technical claims compositionally.
