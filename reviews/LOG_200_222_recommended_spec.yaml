  proposal_status: canonical_by_delegated_approval
  proposed_title: persistent internal formal evaluability
  invariant_definition: A persistent capacity of one reference entity to undergo formal
    evaluation under its applicable internal criterion, independently of whether that
    capacity is presently operative.
  semantic_center: 'formal-evaluation affordances: internal evaluability, constraint-target
    applicability, and systemic joint-evaluability'
  address_justification:
    first_trit_2: Selects a formal-evaluation capacity or applicability relation rather
      than a rule entity, an actual evaluation process, represented data, a result
      value, or unrestricted modality.
    second_trit: 'Selects inward/self scope: one reference entity and its capacity
      for evaluation under an applicable internal criterion and no other Logic-family
      column.'
    third_trit: Selects the persistent status of the same formal-evaluation affordance
      while leaving runtime truth status, actual evaluation, result polarity, observer
      knowledge, tense, probability, permission, and scheduling separate.
  inclusion_boundary: Includes only the persistent internal formal evaluability as
    a substrate-neutral formal-evaluation affordance at inward scope. The capacity
    belongs to one entity without requiring a distinct external target. The criterion,
    evaluator, actual evaluation, data, and result remain separate. It is neutral
    about rule storage or authority, acceptance versus rejection, truth, proof correctness,
    resource sufficiency, computational complexity, observer belief, scheduling, probability,
    timing, and cause.
  excluded_meanings:
  - The formal criterion, target constraint, or shared regime as an entity, and its
    persistent, operative, or dormant rule status.
  - The completed, active, or nonactualized evaluation process and any acceptance,
    rejection, truth, validity, satisfaction, or violation result.
  - Data inputs, variables, bindings, records, schemas, source code, proof objects,
    algorithms, evaluators, or stored outputs.
  - Physical, biological, communicative, structural, restorative, creative, or adverse
    capacity or transformation.
  - Entailment, implication, consequence, consistency, compatibility, permission,
    authority, enforcement, sanction, performance, complexity, or resource sufficiency.
  - Observer knowledge, evidence, intention, plan, readiness, queue, schedule, future
    time, unrestricted possibility, necessity, probability, or cause.
  nearest_neighbors:
  - LOG:201
  - LOG:202
  - LOG:210
  - LOG:220
  - LOG:000
  - LOG:100
  same_family_contrast: "`LOG:0xx` owns formal constraint entities and their identity
    or operation. `LOG:1xx` owns the corresponding completed, active, or nonactualized
    evaluation processes. `LOG:2xx` owns only typed formal-evaluation enablement:
    internal evaluability, constraint-target applicability, and systemic joint-evaluability.
    A rule does not entail evaluability, evaluability does not entail an actual evaluation,
    and an evaluation does not entail a positive result. Persistent identity may co-occur
    with operative or latent status; operative and latent are mutually exclusive for
    the same affordance at one reference time. Lexical latency affirms an existing
    but nonoperative affordance; runtime `[2]/num` separately marks uncertainty about
    any selected status."
  cross_family_comparisons: &1
    LIF: LIF owns living identities, biological capacities, agents, and social roles.
      A living bearer may be formally evaluable, but LOG:2xx does not encode life,
      health, intelligence, office, or agency.
    MOV: MOV owns position, routes, displacement, and motion affordances. A route
      may be evaluated under constraints, but formal evaluability or applicability
      is not movement, reachability, or a spatial path.
    MAT: MAT owns substance, energy, force, contact, material compatibility, and physical
      capacities. Material properties may make evaluation implementable, but LOG:2xx
      does not encode sensors, energy, mechanism, or physical coupling.
    MIN: MIN owns attention, belief, expectation, confidence, understanding, and cognitive
      capacity. Formal evaluability can hold without anyone knowing, believing, understanding,
      or intending that it holds.
    CON: CON owns communication, social linkage, participation, access, and authority-bearing
      interaction. A channel may carry evaluation inputs, but reachability, permission,
      and institutional authorization are not formal evaluability.
    WRN: WRN owns hazards, faults, adverse processes, susceptibility, exposure, and
      propagation pathways. Inability to evaluate may be adverse, but LOG:2xx does
      not assert danger, failure, warning, or vulnerability.
    STR: STR owns arrangements, interfaces, dependencies, structural compatibility,
      and transformation affordances. Structure may realize evaluability, but LOG:2xx
      adds only typed formal-evaluation enablement.
    REP: REP owns restoration conditions, transformations, and affordances. A repair
      may be formally evaluable, but LOG:2xx is not recoverability, repair applicability,
      or a restoration pathway.
    DAT: DAT owns values, representations, schemas, code, proof objects, computational
      resources, and information flow. Such data may enable evaluation, but it is
      not the formal evaluability or constraint-target applicability relation itself.
    CRE: CRE owns generation, construction, transformation, and productive capacities.
      Creating a criterion, evaluator, or result is separate from whether the specified
      evaluation is enabled.
    ORI: ORI owns general possibility, necessity, probability, time, cause, and ontological
      qualification. LOG:2xx asserts a typed formal affordance or applicability relation,
      never unrestricted possibility or futurity.
  runtime_state_interpretation:
    '0': Denies that this internal formal evaluability persists in the stated formal
      context; it does not select the operative or latent sibling and does not establish
      a different logical relation.
    '1': Affirms that this internal formal evaluability persists independently of
      current operation, without asserting that a formal evaluation is occurring or
      that any result holds.
    2/num: Leaves unresolved whether this persistent internal formal evaluability
      claim holds; runtime uncertainty does not change the lexical root into operative
      or latent status.
  lexical_runtime_distinction: Lexical third trit `0` permanently selects the persistent
    status of this formal-evaluation affordance. Runtime `[2]/num` instead leaves
    the already-selected status claim unresolved; it never changes affordance status.
    Thus a latent root affirmed with `[1]` is a confirmed existing-but-nonoperative
    affordance, while a persistent or operative root carrying `[2]/num` remains lexically
    persistent or operative but uncertain as a token claim.
  examples:
  - category: ordinary_conversation
    semantic_graph: LOG:200[1](ENTITY=account,CRITERION=c)
    literal_gloss: affirm persistent internal formal evaluability
    natural_english: The internal formal evaluability for the account persists independently
      of present operation.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or participant whose formal evaluability is asserted
      middle: formal-evaluation capacity or applicability relation as the asserted
        figure
      high: applicable internal criterion, specified constraint, or distinct target
      sustained: shared formal regime and multiple jointly evaluable participants
    use_status: valid
    analysis: The root asserts formal-evaluation enablement and lexical status, not
      an actual evaluation or result.
  - category: physical_or_spatial
    semantic_graph: MAT(BEARER=account)+LOG:200[1](ENTITY=account,CRITERION=c)
    literal_gloss: material bearer plus persistent formal-evaluation affordance
    natural_english: The machine has the stated formal-evaluation affordance while
      MAT separately describes sensors and mechanics.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or participant whose formal evaluability is asserted
      middle: formal-evaluation capacity or applicability relation as the asserted
        figure
      high: applicable internal criterion, specified constraint, or distinct target
      sustained: shared formal regime and multiple jointly evaluable participants
    use_status: valid
    analysis: Formal affordance and physical implementation remain separately typed.
  - category: temporal_or_sequential
    semantic_graph: LOG:200[1](ENTITY=account,CRITERION=c)+ORI(INTERVAL=w)
    literal_gloss: persistent formal-evaluation affordance during interval w
    natural_english: During interval w, the affordance has the stated lexical status.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or participant whose formal evaluability is asserted
      middle: formal-evaluation capacity or applicability relation as the asserted
        figure
      high: applicable internal criterion, specified constraint, or distinct target
      sustained: shared formal regime and multiple jointly evaluable participants
    use_status: valid
    analysis: ORI supplies time and does not replace persistent, operative, or latent
      status.
  - category: cross_family_compound
    semantic_graph: DAT(INPUT=d)+LOG:200[1](ENTITY=account,CRITERION=c)
    literal_gloss: represented input plus persistent formal-evaluation affordance
    natural_english: The data supplies represented inputs while LOG supplies formal
      evaluability or applicability.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or participant whose formal evaluability is asserted
      middle: formal-evaluation capacity or applicability relation as the asserted
        figure
      high: applicable internal criterion, specified constraint, or distinct target
      sustained: shared formal regime and multiple jointly evaluable participants
    use_status: valid
    analysis: DAT resources and LOG enablement remain distinct.
  - category: executable_or_programming
    semantic_graph: LOG:200[1](ENTITY=account,CRITERION=c)
    literal_gloss: assert persistent formal-evaluation affordance
    natural_english: A runtime tracks whether the selected evaluation affordance has
      the stated status without asserting execution or outcome.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: reference entity or participant whose formal evaluability is asserted
      middle: formal-evaluation capacity or applicability relation as the asserted
        figure
      high: applicable internal criterion, specified constraint, or distinct target
      sustained: shared formal regime and multiple jointly evaluable participants
    use_status: valid
    analysis: Capability, evaluation process, and result remain distinct.
    pseudocode: assert(evaluation_affordance.status == "LOG:200")
  - category: counterexample
    semantic_graph: LOG:101[1](ENTITY=account,CRITERION=c)
    literal_gloss: active internal formal evaluation
    natural_english: The formal evaluation is running now.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or participant whose formal evaluability is asserted
      middle: formal-evaluation capacity or applicability relation as the asserted
        figure
      high: applicable internal criterion, specified constraint, or distinct target
      sustained: shared formal regime and multiple jointly evaluable participants
    use_status: must_not_use_this_root
    analysis: Use LOG:1xx for the actual evaluation process; LOG:200 names only its
      enabling capacity or applicability relation.
  future_compound_examples:
  - LOG:200 + LOG:0xx supplies the criterion or regime whose evaluation is enabled
    without reducing the affordance to its rule.
  - LOG:200 + LOG:1xx states that the corresponding formal evaluation is actually
    completed, active, or nonactualized.
  - LOG:200 + DAT/MAT/STR supplies represented inputs, algorithms, resources, and
