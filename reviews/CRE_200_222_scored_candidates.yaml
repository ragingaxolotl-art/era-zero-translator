  - candidate_id: authorship_provenance_relations
    title: persistent internal authorship relation
    invariant_candidate: A persistent authorship or provenance relation at inward
      creation scope.
    analysis:
      why_it_fits: Creation naturally raises source-to-work relations such as authorship,
        derivation, influence, and provenance.
      useful_coverage: It would cover created-by, authored-by, derived-from, inspired-by,
