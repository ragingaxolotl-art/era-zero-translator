  - candidate_id: creative_agency_capacities
    title: persistent inward creative agency
    invariant_candidate: A persistent capacity of an agent or system for creative
      agency at inward scope.
    analysis:
      why_it_fits: Everyday language often describes people, teams, and systems as
        creative, capable, or generative.
      useful_coverage: It would cover creative talent, inventiveness, agency, artistic
        ability, team creativity, and generative intelligence.
      semantic_territory_consumed: It makes a bearer or agent central and tends to
