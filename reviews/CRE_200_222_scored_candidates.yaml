    maximum: 80
  - candidate_id: productive_process_affordances
    title: persistent internal pattern-forming capacity
    invariant_candidate: A persistent capacity within one reference entity to form
      or modify a generative pattern while retaining it within that entity, independently
      of whether that capacity is presently operative.
    analysis:
      why_it_fits: First-trit 2 becomes the capacity or qualifying relation enabling
        the matching CRE:1xx process; the second trit changes only inward, target,
        or systemic scope; and the third changes only persistent, operative, or latent
        status.
      useful_coverage: It supports capable-of-designing, generatable, source-enabled
        production, renderability, co-creatability, joint production capability, generators,
        build systems, and formal production pipelines.
      semantic_territory_consumed: Only typed enablement for the approved internal
        pattern-formation, artifact-generation, or systemic co-generation process.
        Entities, actual processes, agency, media, algorithms, authorship, provenance,
        quality, and modality remain separate.
      conflicts_or_future_limitations: Claims about creator identity, originality,
        ownership, resources, implementation method, termination, quality, or causal
        provenance require compounds or later specialization.
    scores:
      atomicity: 10
