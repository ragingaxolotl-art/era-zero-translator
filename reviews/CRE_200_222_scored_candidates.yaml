    title: stable creative agency
    invariant_candidate: An entity has a dependable inward capacity to imagine, design,
      generate, or transform forms.
    analysis:
      why_it_fits: The provisional meanings recognize that first-trit 2 concerns capacities
        and relations, and they attach familiar creative vocabulary to inward scope
        and persistent status.
      useful_coverage: They cover creativity, agency, authorship, influence, composability,
        design spaces, source attribution, and unrealized form families.
      semantic_territory_consumed: Across the block they mix cognition, agency, productive
        capability, current productive activity, authorship, ownership, causal influence,
        provenance, structure, composability, possibility, and unrealized products.
      conflicts_or_future_limitations: The triplets do not preserve one affordance
        center, and third-trit 2 shifts among undeveloped, inaccessible, disputed,
        unconfirmed, and not-yet-created rather than lexical latency.
    scores:
      atomicity: 5
