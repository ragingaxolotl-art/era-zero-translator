---
metadata:
  title: CRE:200–222 English coverage and routing tests
  status: review_evidence_not_translation_dictionary
  range: CRE:200–222
  test_count: 115
  no_forced_atomization: true
tests:
- test_id: CRE2-T001
  english_concept: capable of forming a design pattern
  routing: one_root
  analysis: CRE:200–202 owns typed capacity within one entity to form or modify a
    retained generative pattern.
- test_id: CRE2-T002
  english_concept: capable of revising a template
  routing: one_root_or_compound
  analysis: Internal pattern-forming capacity covers productive modification; DAT
    supplies an encoded template and ORI may supply version timing.
- test_id: CRE2-T003
  english_concept: creative ability
  routing: ambiguous_compound
  analysis: Use CRE only for productive enablement; MIN supplies imagination and LIF
    supplies an agent or social role.
- test_id: CRE2-T004
  english_concept: talented artist
  routing: compound_or_later_specialization
  analysis: LIF identifies the person, MIN may supply cognitive ability, CRE supplies
    productive affordance, and evaluation supplies talent or quality.
- test_id: CRE2-T005
  english_concept: imaginative
  routing: different_family
  analysis: Imagination belongs to MIN and does not by itself establish capacity for
    productive transformation.
- test_id: CRE2-T006
  english_concept: intends to create
  routing: different_family
  analysis: Intention belongs to MIN; a productive affordance may exist without intention
    and intention may exist without operative capacity.
- test_id: CRE2-T007
  english_concept: knows how to create
  routing: compound
  analysis: MIN supplies knowledge while CRE supplies objective productive enablement
    under the stated conditions.
- test_id: CRE2-T008
  english_concept: generator available
  routing: one_root_or_compound
  analysis: An operative CRE affordance can express present productive enablement
    while LOG, DAT, STR, or MAT supplies the implementing generator.
- test_id: CRE2-T009
  english_concept: generator exists
  routing: entity_or_compound
  analysis: A tool or program is an entity; CRE:2xx applies only when its typed productive
    affordance is asserted.
- test_id: CRE2-T010
  english_concept: renderable
  routing: one_root_or_compound
  analysis: Source-artifact generative relation can cover renderability when one source
    can yield one prospective artifact; representation and renderer remain separate.
- test_id: CRE2-T011
  english_concept: compilable
  routing: compound_or_later_specialization
  analysis: CRE supplies productive enablement, LOG the formal procedure, DAT the
    code representation, and result validity remains separate.
- test_id: CRE2-T012
  english_concept: manufacturable
  routing: compound
  analysis: CRE supplies artifact-generative enablement while MAT and STR supply physical
    materials, mechanics, and assembly constraints.
- test_id: CRE2-T013
  english_concept: printable
  routing: compound
  analysis: CRE supplies source-artifact generativity, DAT supplies encoded input,
    and MAT supplies the printing medium and mechanism.
- test_id: CRE2-T014
  english_concept: buildable
  routing: one_root_or_compound
  analysis: CRE:210–212 can state that one source is generatively related to a prospective
    artifact; structural feasibility and resources are separate.
- test_id: CRE2-T015
  english_concept: generatable artifact
  routing: one_root
  analysis: CRE:210–212 asserts the typed source-artifact relation that can enable
    one prospective artifact to be brought into manifestation.
- test_id: CRE2-T016
  english_concept: source can produce target
  routing: one_root
  analysis: Use CRE:210–212 when one source stands in the relevant generative relation
    to one distinct prospective artifact.
- test_id: CRE2-T017
  english_concept: authored by
  routing: reserved_relation
  analysis: Authorship identifies an agent-to-work attribution and requires LIF, CON,
    or later provenance vocabulary rather than generic productive enablement.
- test_id: CRE2-T018
  english_concept: created by
  routing: compound_or_reserved_relation
  analysis: CRE can supply the creation event or affordance, but causal source attribution
    requires ORI and participant identity.
- test_id: CRE2-T019
  english_concept: derived from
  routing: compound_or_reserved_relation
  analysis: Derivation requires causal or historical provenance beyond a present source-artifact
    productive affordance.
- test_id: CRE2-T020
  english_concept: inspired by
  routing: different_family_or_compound
  analysis: MIN supplies inspiration and ORI may supply causal relation; CRE applies
    only if productive enablement is separately asserted.
- test_id: CRE2-T021
  english_concept: owned by
  routing: different_relation
  analysis: Ownership and authority are not Creation affordances and require social,
    legal, or connection relations.
- test_id: CRE2-T022
  english_concept: licensed to generate
  routing: compound
  analysis: CRE supplies productive affordance while LOG or CON supplies permission,
    policy, and authority.
- test_id: CRE2-T023
  english_concept: resources sufficient to build
  routing: compound
  analysis: CRE supplies productive affordance; MAT, STR, DAT, and LOG supply required
    resources and constraints.
- test_id: CRE2-T024
  english_concept: toolchain ready
  routing: compound
  analysis: Operative CRE capacity may combine with available tools and dependencies,
    but readiness is not the invariant meaning.
- test_id: CRE2-T025
  english_concept: scheduled generation
  routing: compound
  analysis: A latent or operative productive affordance combines with ORI scheduling;
    lexical status never means scheduled.
- test_id: CRE2-T026
  english_concept: possible creation
  routing: different_family
  analysis: ORI owns unrestricted possibility; CRE:2xx asserts a specific existing
    productive affordance.
- test_id: CRE2-T027
  english_concept: probable creation
  routing: different_family_or_compound
  analysis: ORI supplies probability and CRE separately supplies the typed productive
    affordance.
- test_id: CRE2-T028
  english_concept: creation process running
  routing: process_layer
  analysis: CRE:1xx owns actual productive-process phase; CRE:2xx only states capacity
    or a qualifying relation.
- test_id: CRE2-T029
  english_concept: creation process completed
  routing: process_layer
  analysis: CRE:1x0 owns completion; a productive affordance entails no actual process
    or result.
- test_id: CRE2-T030
  english_concept: generative pattern exists
  routing: entity_layer
  analysis: CRE:00x owns the generative pattern; existence or manifestation does not
    entail pattern-forming capacity.
- test_id: CRE2-T031
  english_concept: artifact exists
  routing: entity_layer
  analysis: CRE:01x owns the generated artifact; artifact identity does not entail
    a currently operative source-artifact relation.
- test_id: CRE2-T032
  english_concept: shared repertoire exists
  routing: entity_layer
  analysis: CRE:02x owns a shared generative repertoire; it does not entail capacity
    for one jointly constituted result.
- test_id: CRE2-T033
  english_concept: co-creatable
  routing: one_root
  analysis: CRE:220–222 asserts capacity of multiple participants to generate one
    jointly constituted result in a shared production domain.
- test_id: CRE2-T034
  english_concept: team can create together
  routing: one_root_or_compound
  analysis: CRE supplies systemic co-generative capacity while LIF and CON supply
    participants, roles, and coordination channels.
- test_id: CRE2-T035
  english_concept: collaborative
  routing: different_family_or_compound
  analysis: CON owns collaboration; CRE systemic capacity additionally requires productive
    enablement for one joint result.
- test_id: CRE2-T036
  english_concept: collective creativity
  routing: compound
  analysis: CRE supplies co-generative capacity, LIF supplies the collective, and
    MIN may supply shared ideation.
- test_id: CRE2-T037
  english_concept: crowdsourceable
  routing: compound_or_later_specialization
  analysis: CRE supplies possible joint production while CON and LIF supply contributor
    relations and participation structure.
- test_id: CRE2-T038
  english_concept: ensemble can perform
  routing: compound
  analysis: CRE may supply systemic productive capacity while LIF, CON, and MAT supply
    performers, coordination, and physical realization.
- test_id: CRE2-T039
  english_concept: composable
  routing: different_family_or_compound
  analysis: STR owns compatibility for combination; CRE applies only when the combination
    enables one generated result.
- test_id: CRE2-T040
  english_concept: remixable
  routing: compound_or_later_specialization
  analysis: CRE supplies productive affordance, STR composability, DAT representations,
    and provenance remains separately typed.
- test_id: CRE2-T041
  english_concept: extensible design system
  routing: compound
  analysis: STR and LOG supply modular structure and constraints; CRE supplies productive
    capacity only when new forms can be generated.
- test_id: CRE2-T042
  english_concept: design space
  routing: entity_relation_or_compound
  analysis: A structured possibility space belongs chiefly to STR, LOG, and ORI; CRE:2xx
    asserts concrete productive enablement, not the space itself.
- test_id: CRE2-T043
  english_concept: unrealized form space
  routing: different_family_or_compound
  analysis: ORI supplies unrealized possibility and LOG/STR supplies constraints;
    lexical CRE latency requires an existing typed affordance.
- test_id: CRE2-T044
  english_concept: many independent creators
  routing: multiple_affordances
  analysis: Use separate CRE:20x or CRE:21x claims unless the participants can jointly
    constitute one result under CRE:22x.
- test_id: CRE2-T045
  english_concept: shared tools only
  routing: implementation_not_affordance
  analysis: Common tools may support co-generative capacity but do not establish coordinated
    productive enablement for one joint result.
- test_id: CRE2-T046
  english_concept: common template only
  routing: entity_not_affordance
  analysis: A shared CRE:02x repertoire can exist even when participants lack operative
    systemic co-generative capacity.
- test_id: CRE2-T047
  english_concept: persistent productive capacity
  routing: one_root
  analysis: Choose CRE:200, CRE:210, or CRE:220 by scope; persistence is neutral about
    current operation.
- test_id: CRE2-T048
  english_concept: operative productive capacity
  routing: one_root
  analysis: Choose CRE:201, CRE:211, or CRE:221 by scope; operation does not assert
    that production is occurring.
- test_id: CRE2-T049
  english_concept: latent productive capacity
  routing: one_root
  analysis: Choose CRE:202, CRE:212, or CRE:222 by scope; latency means existing but
    nonoperative, not unknown or future.
- test_id: CRE2-T050
  english_concept: persistent plus operative capacity
  routing: two_compatible_roots
  analysis: The persistent and operative siblings may co-occur because identity and
    current operation are independent claims.
- test_id: CRE2-T051
  english_concept: persistent plus latent capacity
  routing: two_compatible_roots
  analysis: The persistent and latent siblings may co-occur while the same affordance
    exists nonoperatively.
- test_id: CRE2-T052
  english_concept: operative and latent simultaneously
  routing: invalid_same_reference_claim
  analysis: Operative and latent are mutually exclusive for the same productive affordance
    at one reference time.
- test_id: CRE2-T053
  english_concept: latent affordance affirmed
  routing: runtime_and_lexical
  analysis: A CRE:2x2 root with runtime [1] confirms an existing nonoperative productive
    affordance.
- test_id: CRE2-T054
  english_concept: operative affordance uncertain
  routing: runtime_and_lexical
  analysis: A CRE:2x1 root with runtime [2]/num leaves current operation unresolved
    without selecting lexical latency.
- test_id: CRE2-T055
  english_concept: persistent affordance denied
  routing: runtime_and_lexical
  analysis: Runtime [0] denies persistent identity without selecting an operative
    or latent sibling.
- test_id: CRE2-T056
  english_concept: unknown productive capacity
  routing: runtime_or_epistemic
  analysis: Use runtime [2]/num or MIN/DAT evidence; lexical latency never means unknown.
- test_id: CRE2-T057
  english_concept: hidden capacity
  routing: compound
  analysis: CRE latency supplies nonoperation only; observer ignorance or undisclosed
    status requires MIN, DAT, or CON.
- test_id: CRE2-T058
  english_concept: capacity versus agency
  routing: cross_family_boundary
  analysis: CRE owns typed productive enablement while LIF and MIN own agent identity,
