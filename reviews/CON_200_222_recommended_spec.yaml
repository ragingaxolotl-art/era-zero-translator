  proposal_status: canonical_by_delegated_approval
  proposed_title: enduring communicative participation capacity
  invariant_definition: A persistent capacity of an endpoint to participate in communicative
    exchange.
  semantic_center: 'communicative affordances and participant relations: endpoint
    participation capacity, directed target relation, and shared co-participation
    relation'
  address_justification:
    first_trit_2: Selects a capacity or relationship. enduring communicative participation
      capacity is neither a communicative locus (`CON:0xx`) nor an expression, reception,
      or distribution process (`CON:1xx`).
    second_trit: 'Selects inward/self scope: endpoint-internal participation affordance,
      a directed relation to a distinct target, or a relation shared among multiple
      participant endpoints.'
    third_trit: Selects the stable or enduring lexical member while leaving runtime
      assertion status, temporal scheduling, probability, permission, and failure
      to separate grammar or roots.
  inclusion_boundary: Includes only the enduring capacity by which an endpoint can
    participate, relates communicatively to a distinct target, or stands with multiple
    endpoints as co-participants in an exchange context. It is neutral about endpoints
    and channels as loci, actual message traffic, content, physical substrate, cognition,
    topology, protocol, reachability, social identity, and scheduling.
  excluded_meanings:
  - The source endpoint, target endpoint, shared channel, interface, device, address
    record, participant set, or topology as an entity.
  - Expression, reception, distribution, dialogue, broadcast, negotiation, acknowledgement,
    or any other communicative event or traffic.
  - A physical link, route, movement, carrier, transceiver, permission, authentication,
    protocol compatibility, logical reachability, failure, repair, or queue state.
  - Friendship, kinship, affection, community identity, structural membership, attention,
    understanding, agreement, or joint mental state.
  - Intention, plan, schedule, probability, future time, or guaranteed later realization—especially
    for lexical third-trit 2.
  nearest_neighbors:
  - CON:201
  - CON:202
  - CON:210
  - CON:220
  - CON:000
  - CON:100
  same_family_contrast: "`CON:0xx` owns communicative loci, `CON:1xx` owns exchange
    processes through those loci, and `CON:2xx` owns substrate-neutral communicative
    participation capacity or participant relations. An active capacity or relation
    never entails active traffic."
  cross_family_comparisons: &1
    LIF: LIF owns the identity and living or conscious status of participants and
      communities. CON may relate those participants but never makes a social group
      or organism identical to a communication relation.
    MOV: MOV owns displacement, approach, traversal, and spatial reachability through
      routes. A communicative relation can hold across distance without asserting
      physical or logical reachability.
    MAT: MAT owns physical interfaces, transceivers, cables, sound, light, and carrier
      media. CON capacity is substrate-neutral and does not assert that hardware exists
      or functions.
    MIN: MIN owns attention, interpretation, understanding, willingness, memory, and
      joint mental state. Communicative participation does not entail attention or
      comprehension.
    STR: STR owns graph topology, membership structure, containers, interfaces, and
      system arrangement. CON owns the communicative participant relation, not the
      network's structural edges or shape.
    WRN: WRN owns failure, blockage, corruption, deception, and risk. A CON capacity
      or relation is neutral about faults unless a WRN claim is compounded.
    REP: REP owns restoration, reconnection after failure, and recovery of an interface
      or channel. A persistent or latent CON capacity is not itself a repair operation.
    LOG: LOG owns permission, authentication, protocol validity, compatibility tests,
      obligations, and reachability conclusions. CON relations do not imply authorization,
      compatibility, or successful reachability.
    DAT: DAT owns participant addresses, contact records, messages, streams, and subscription
      records as information objects. CON owns the affordance or relation those records
      may describe.
    CRE: CRE owns creation of interfaces, accounts, groups, protocols, and links.
      CON:2xx states a capacity or relation without asserting how it was created.
    ORI: ORI owns existence, modality, time, possibility, and ontological transition.
      CON:222 contributes a domain-specific unrealized shared relation but not plan,
      probability, schedule, or future time.
  runtime_state_interpretation:
    '0': Denies that the enduring condition named by enduring communicative participation
      capacity holds in the stated context; it does not assert the active or dormant/unresolved
      sibling.
    '1': Affirms the persistent capacity or relation named by enduring communicative
      participation capacity, even if no exchange is occurring at this moment.
    2/num: Leaves unresolved whether the enduring condition named by enduring communicative
      participation capacity holds; it does not convert the lexeme into its active
      or dormant/unresolved sibling.
  lexical_runtime_distinction: Lexical third trit `0` permanently selects the stable
    or enduring member of this triplet. Runtime `[2]/num` instead leaves the truth
    or applicability of that already-selected lexeme unresolved; it never changes
    the lexical member.
  examples:
  - category: ordinary_conversation
    semantic_graph: CON:200[1](ENDPOINT=archivist)
    literal_gloss: enduring endpoint-internal communicative participation capacity
    natural_english: The archivist retains the capacity to communicate even while
      silent.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference or source endpoint
      middle: capacity or communicative participant relation
      high: distinct target endpoint
      sustained: shared exchange context or co-participant set
    use_status: valid
    analysis: The root describes capacity, not a message event.
  - category: physical_or_spatial
    semantic_graph: MAT(INTERFACE=device)+CON:200[1](ENDPOINT=device)
    literal_gloss: physical interface plus enduring communicative capacity
    natural_english: The probe has a persistent communication capability independent
      of this antenna's current state.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference or source endpoint
      middle: capacity or communicative participant relation
      high: distinct target endpoint
      sustained: shared exchange context or co-participant set
    use_status: valid
    analysis: MAT supplies hardware; CON supplies substrate-neutral capacity.
  - category: temporal_or_sequential
    semantic_graph: CON:200[1](ENDPOINT=delegate,CONTEXT=session)+ORI(TIME=now)
    literal_gloss: enduring capacity evaluated in this session
    natural_english: The delegate's communicative capacity has the stated condition
      during this session.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference or source endpoint
      middle: capacity or communicative participant relation
      high: distinct target endpoint
      sustained: shared exchange context or co-participant set
    use_status: valid
    analysis: ORI supplies the evaluation time.
  - category: cross_family_compound
    semantic_graph: LIF(AGENT=pilot)+MIN(ATTENTION=pilot)+CON:200[1](ENDPOINT=pilot)
    literal_gloss: agent attention plus communicative participation capacity
    natural_english: The pilot is attentive and has the stated communicative capacity.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference or source endpoint
      middle: capacity or communicative participant relation
      high: distinct target endpoint
      sustained: shared exchange context or co-participant set
    use_status: valid
    analysis: Attention and communication capacity are independent claims.
  - category: executable_or_programming
    semantic_graph: CON:200[1](ENDPOINT=actor,CAPABILITY=communicative_participation)
    literal_gloss: assert enduring communication capability
    natural_english: The object implements a persistent communicative-participant
      capability.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: reference or source endpoint
      middle: capacity or communicative participant relation
      high: distinct target endpoint
      sustained: shared exchange context or co-participant set
    use_status: valid
    analysis: The capability does not imply authentication, compatibility, or I/O
      traffic.
    pseudocode: assert(relation.matches?("CON:200"))
  - category: counterexample
    semantic_graph: CON:101[1](SOURCE=actor,EXPRESSION=message)
    literal_gloss: active source expression
    natural_english: The actor is sending a message.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference or source endpoint
      middle: capacity or communicative participant relation
      high: distinct target endpoint
      sustained: shared exchange context or co-participant set
    use_status: must_not_use_this_root
    analysis: Traffic is CON:1xx, not an endpoint capacity.
  future_compound_examples:
  - CON:200 + CON:0xx supplies a concrete endpoint or channel without confusing the
    locus with this capacity or relation.
  - CON:200 + CON:1xx adds expression, reception, or distribution traffic without
    making traffic part of the invariant.
  - CON:200 + DAT/LOG/STR adds addresses, messages, permission, protocol, membership,
    or topology as typed independent layers.
  - CON:200 + MAT/MOV/MIN/LIF adds hardware, routes, attention, or participant identity
    while preserving the neutral Connection center.
  later_era_notes: Later eras may lexicalize online, offline, contact, friend, subscriber,
    reachable, compatible, networked, community, group chat, peer, or federation.
    Era Zero should derive those senses compositionally and preserve the capacity/relation
    versus locus/process boundary.
  confidence: 0.97
  canonicalized: true
