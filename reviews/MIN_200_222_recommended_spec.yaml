  proposal_status: recommended_after_adversarial_review_pending_delegated_approval
  proposed_title: enduring attentional capacity
  invariant_definition: A persistent capacity of a cognizer to allocate cognitive
    processing selectively.
  semantic_center: selective allocation of cognitive processing
  address_justification:
    first_trit_2: 'Selects a capacity: the cognizer can allocate cognitive processing
      selectively.'
    second_trit: 'Selects inward/source scope: the cognizer is the bearer and source
      of attentional capacity.'
    third_trit: 'Selects stable expression: the attentional capacity persists across
      episodes.'
  inclusion_boundary: Includes only the capacity for, directed relation of, or systemic
    relation of selectively allocating cognitive processing at this address's exact
    scope and lexical expression. Preferential processing may concern sensory, remembered,
    imagined, conceptual, or executable content without asserting which mechanism
    supplies it.
  excluded_meanings:
  - Consciousness, wakefulness, arousal, sensory stimulation, gaze direction, bodily
    orientation, or neural resource use.
  - A representation merely persisting, manifesting, or remaining latent; canonical
    MIN:0xx owns representational content.
  - Revision, learning, interpretation, inference, evaluation, belief, trust, doubt,
    certainty, truth, decision, or goal commitment.
  - Communication, access permission, role assignment, coordination procedure, queue
    order, data subscription, plan, intention, schedule, readiness, or future time.
  - Success, failure, distraction, correction, or recovery unless WRN/REP or another
    explicit relation supplies the evaluation.
  nearest_neighbors:
  - MIN:201
  - MIN:202
  - MIN:000
  - MIN:001
  - MIN:002
  - MIN:100
  - MIN:101
  - MIN:102
  same_family_contrast: Canonical MIN:0xx owns cognitive representations and MIN:1xx
    owns their revision; this triplet owns the cognizer's capacity to allocate processing,
    not content or change.
  cross_family_comparisons: &1
    LIF: LIF owns consciousness, wakefulness, organismic responsiveness, and living
      condition. MIN attention may require consciousness in some beings but does not
      define life or arousal.
    MOV: MOV owns gaze shifts, head turns, approach, and physical orientation. Bodily
      orientation can evidence or serve attention without being the cognitive relation.
    MAT: MAT owns neural substrate, sensory energy, physical stimuli, and resource
      consumption. MIN owns selective cognitive allocation, not its physical implementation.
    CON: CON owns communication, access, assignment, and participant coordination.
      Messages or roles may establish attention but do not guarantee cognitive priority.
    STR: STR owns queues, hierarchies, and external priority structures. An ordered
      task list is not attention unless a cognizer preferentially processes its target.
    WRN: WRN owns distraction as failure, missed signals, ambiguity, and attentional
      lapse when evaluated as problems. Attention itself is neutral about success
      or error.
    REP: REP owns recovery or repair of impaired attention. Refocusing may restore
      attention, but the repair process is not the capacity or relation.
    LOG: LOG owns inference, consistency, truth support, and formal priority rules.
      Attending to a claim neither proves it nor commits the cognizer to it.
    DAT: DAT owns input streams, subscriptions, queues, records, and scheduler state.
      Data selection can implement attention but is not automatically cognitive attention.
    CRE: CRE owns goals, intentions, plans, and designed attention policies. Intended
      or scheduled focus must be compounded rather than encoded in MIN.
    ORI: ORI owns time, modality, existence, certainty, and realization. Potential
      or unresolved attention does not silently encode probability, future time, or
      epistemic truth.
  runtime_state_interpretation:
    '0': Denies that the specified enduring attentional capacity holds for this token.
    '1': Affirms that the specified enduring attentional capacity holds for this token.
    2/num: Marks the current assertion about the enduring attentional capacity as
      dormant or unresolved; it does not select a different lexical capacity/relation
      or add probability, intention, schedule, or future time.
  lexical_runtime_distinction: The third lexical trit permanently selects enduring
    attentional capacity. Runtime `[2]/num` separately marks this token's assertion
    as dormant or unresolved. For lexical `MIN:202`, `MIN:212`, or `MIN:222`, runtime
    `[1]` affirms the latent, unresolved, or potential lexeme; runtime `[2]/num` leaves
    the assertion about that lexeme unresolved. The two layers never collapse.
  examples:
