    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity, referent, or participant associated with the information
        object
      middle: bounded datum, target reference, or shared dataset asserted as the figure
      high: distinct referent, encoding, medium, or owner when separately expressed
      sustained: shared information domain and its multiple participating holders
    use_status: valid
    analysis: ORI supplies time and does not replace data manifestation status.
  - category: cross_family_compound
    semantic_graph: LOG(CRITERION=c)+DAT:000[1](ENTITY=device,DATUM=d)
    literal_gloss: formal criterion plus persistent data representation
    natural_english: The datum represents a criterion without becoming the formal
      rule itself.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity, referent, or participant associated with the information
        object
      middle: bounded datum, target reference, or shared dataset asserted as the figure
      high: distinct referent, encoding, medium, or owner when separately expressed
      sustained: shared information domain and its multiple participating holders
    use_status: valid
    analysis: DAT and LOG remain distinct.
  - category: executable_or_programming
    semantic_graph: DAT:000[1](ENTITY=device,DATUM=d)
    literal_gloss: assert persistent information-object status
    natural_english: A runtime registers information-object status without asserting
      transfer, parsing, mutation, or truth.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: reference entity, referent, or participant associated with the information
        object
      middle: bounded datum, target reference, or shared dataset asserted as the figure
      high: distinct referent, encoding, medium, or owner when separately expressed
      sustained: shared information domain and its multiple participating holders
    use_status: valid
    analysis: Entity identity and data-processing events remain separate.
