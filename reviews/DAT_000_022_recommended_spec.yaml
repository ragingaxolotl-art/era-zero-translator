  - category: temporal_or_sequential
    semantic_graph: DAT:000[1](ENTITY=device,DATUM=d)+ORI(INTERVAL=w)
    literal_gloss: persistent data entity during interval w
    natural_english: During interval w, the information object has the stated lexical
