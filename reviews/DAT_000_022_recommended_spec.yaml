  proposal_status: canonical_by_delegated_approval
  proposed_title: persistent internal datum
  invariant_definition: A persistent bounded information object maintained within
    one reference entity, independently of whether that information object is presently
    manifest.
  semantic_center: 'information entities: internal data, target-referential data,
    and shared datasets'
  address_justification:
    first_trit_0: Selects an information entity rather than a data transformation,
      transmission event, storage/access affordance, or physical medium.
    second_trit: 'Selects inward/self scope: one bounded information object maintained
      within one reference entity and no other Data-family column.'
    third_trit: Selects the persistent/manifestation-neutral member by information-object
      identity or present manifestation while leaving runtime truth status, access,
      observation, transmission, tense, probability, and process phase separate.
  inclusion_boundary: Includes only the persistent internal datum as a substrate-neutral
    information entity at inward scope. The claim is about an information object maintained
    within one reference entity, not the physical medium, an observer's memory, a
    reference to another target, or a shared collection. It is neutral about truth,
    validity, belief, access, observation, transmission, processing, mutation, physical
    realization, ownership, provenance, probability, timing, and cause.
  excluded_meanings:
  - Truth, falsity, validity, evidential support, assertion, belief, understanding,
    memory, or certainty concerning the information.
  - Creation, mutation, computation, parsing, indexing, querying, copying, transmission,
    delivery, reception, or deletion of data.
  - Physical inscription, storage medium, device, energy, signal carrier, file-system
    structure, access path, or network topology.
  - Sender, recipient, communication act, social ownership, authority, privacy policy,
    permission, or responsibility.
  - Formal rule, proposition role, proof status, evaluation, satisfaction, entailment,
    consistency, or semantic correctness.
  - Accessibility, observability, discoverability, provenance, version, schedule,
    future activation, possibility, necessity, probability, or cause.
  nearest_neighbors:
  - DAT:001
  - DAT:002
  - DAT:010
  - DAT:020
  - DAT:100
  - DAT:200
  same_family_contrast: "`DAT:0xx` owns information entities and their persistent,
    manifest, or dormant status. `DAT:1xx` remains reserved for information transformations
    or flow processes, and `DAT:2xx` for storage, access, provenance, transmission,
    or other information affordances and relations. A manifest datum does not entail
    access, observation, truth, transfer, or processing, and an identified datum does
    not entail a usable storage or communication relation. The persistent member is
    manifestation-neutral: it may co-occur with the manifest sibling or the dormant
    sibling at the same reference time. It asserts continuity of information-object
    identity rather than a third mutually exclusive manifestation value."
  cross_family_comparisons: &1
    LIF: LIF owns living identities, biological conditions, agents, and social collectives.
      Data can describe a living bearer or participant, but the information object
      is not the life, role, health, memory bearer, or agency it represents.
    MOV: MOV owns position, path, displacement, and motion affordances. Data may represent
      a position or route, but a reference, record, or dataset neither moves nor constitutes
      the physical route or destination.
    MAT: MAT owns substance, energy, force, contact, media, and material capacities.
      A physical inscription or device may realize data, but DAT identifies the information
      object rather than its material substrate.
    MIN: MIN owns awareness, belief, attention, memory, intention, and subjective
      representation. A datum can persist or be manifest independently of whether
      any observer knows, believes, recalls, or understands it.
    CON: CON owns channels, participants, communication acts, delivery, reception,
      and exchange relations. A message may carry DAT content, but transmission and
      participant linkage are not the information object itself.
    WRN: WRN owns faults, hazards, adverse processes, warnings, susceptibility, and
      propagation. Data may describe or signal a fault, but the information object
      is not the adverse condition or warning act.
    STR: STR owns arrangements, boundaries, interfaces, schemas-as-structure, dependencies,
      and structural capacities. Data can encode a structure, but the information
      object remains distinct from the arrangement it represents.
    REP: REP owns restoration conditions, restorative processes, and restorative affordances.
      Backups and checkpoints are data objects that may support repair, but DAT does
      not assert restoration or recoverability.
    LOG: LOG owns formal constraints, evaluations, and evaluation affordances. Data
      can represent criteria, operands, proofs, or results, but representation is
      not the formal rule, evaluation, or applicability relation.
    CRE: CRE owns creation, transformation, generation, and productive capacities.
      Creating or changing data is a process distinct from the resulting information
      object and its manifest status.
    ORI: ORI owns temporal, modal, causal, and ontological qualification. Data persistence,
      manifestation, and dormancy do not encode past, future, possibility, necessity,
      probability, or origin.
  runtime_state_interpretation:
    '0': Denies that this internal datum persists as the same identified information
      object; it does not select the manifest or dormant sibling and does not erase
      every related datum.
    '1': Affirms the persistent identity of this internal datum while leaving current
      manifestation, accessibility, truth, encoding, medium, and provenance undecided.
    2/num: Leaves unresolved whether this persistent internal datum remains identified;
      uncertainty about the assertion does not change the lexical root into a manifest
      or dormant datum.
  lexical_runtime_distinction: Lexical third trit `0` permanently selects the persistent/manifestation-neutral
    member of this information-entity triplet. Runtime `[2]/num` instead leaves that
    already-selected assertion unresolved; it never changes manifestation status.
    Thus a dormant root affirmed with `[1]` is a confirmed maintained-but-unmanifest
    information object, while a persistent or manifest root carrying `[2]/num` remains
    lexically persistent or manifest but uncertain as a token claim.
  examples:
  - category: ordinary_conversation
    semantic_graph: DAT:000[1](ENTITY=device,DATUM=d)
    literal_gloss: affirm persistent internal datum
    natural_english: That information object remains identified whether or not it
