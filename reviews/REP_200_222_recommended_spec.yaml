  proposal_status: canonical_by_delegated_approval
  proposed_title: persistent internal recoverability
  invariant_definition: A persistent capacity of one reference entity to undergo internally
    originating restoration under qualifying conditions, independently of whether
    that capacity is presently operative.
  semantic_center: 'restorative-transformation affordance: internal recoverability,
    source-target restorative applicability, and systemic restoration pathways'
  address_justification:
    first_trit_2: Selects a restorative capacity or enabling relationship rather than
      a restoration-condition entity or an actual restorative transformation.
    second_trit: 'Selects inward scope: one reference entity and its internally originating
      restorative change; this root names the affordance for internal recoverability
      and no competing family claim.'
    third_trit: Selects persistent independently of current operation expression of
      the same internal recoverability; runtime truth status, tense, probability,
      permission, and process phase remain separate.
  inclusion_boundary: Includes only the persistent independently of current operation
    substrate-neutral restorative affordance for internal recoverability. The recoverability
    belongs to one reference entity and concerns internally originating restoration;
    a distinct restorative source selects the outward column. It may be realized physically,
    biologically, computationally, informationally, socially, or conceptually, but
    it does not assert that the matching REP:1xx transformation occurs, that a REP:0xx
    restoration condition is realized, or that mechanics, evidence, knowledge, protection,
    maintenance, resources, probability, temporal, or modal conditions hold.
  excluded_meanings:
  - The restoration condition, bearer, restorative source, target, participant, or
    shared system as an entity or realized state.
  - An actual internal restoration, source-to-target restoration, or coordinated systemic
    restoration process at any completion phase.
  - Physical force, energy, contact, compatibility, route, biological mechanism, structural
    dependency, communicative channel, data-flow edge, remedy, backup, spare, or caregiver
    as such.
  - Detection, verification, diagnosis, evidence, service messages, belief, confidence,
    attribution, probability, expected success, or recovery score.
  - Resistance, immunity, shielding, filtering, prevention, maintenance, preservation,
    service responsibility, replacement, or other protective or resource affordance.
  - Readiness, plan, schedule, future time, permission, necessity, unrestricted possibility,
    or guaranteed occurrence or success of restoration.
  nearest_neighbors:
  - REP:201
  - REP:202
  - REP:100
  - REP:101
  - REP:102
  - REP:000
  same_family_contrast: 'REP:0xx names restoration-condition entities: internal, target,
    and shared acceptable conditions. REP:1xx names actual restorative transformations:
    internal restoration, source-to-target restoration, and coordinated systemic restoration.
    REP:2xx names only the corresponding restorative affordance: inward recoverability,
    outward source-target restorative applicability, or a systemic restoration pathway.
    An affordance does not entail that its process begins or completes; an actual
    process does not entail that the affordance persists afterward. Persistent 2x0
    identity may co-occur with its operative or latent sibling, while operative and
    latent are mutually exclusive for the same affordance at one reference time.'
  cross_family_comparisons: &1
    LIF: LIF owns living identity, physiology, health, immunity, regeneration mechanisms,
      care roles, and social participants. REP can classify a living bearer as recoverable
      or linked to a restorative source without replacing biological facts.
    MOV: MOV owns position, displacement, routes, approach, traversal, and return.
      A restorative source may travel along a route, but REP:2xx names only the typed
      capacity or relation enabling restoration.
    MAT: MAT owns substance, force, energy, contact, compatibility, material reserves,
      and physical coupling. Those properties may realize repairability or a restoration
      pathway, but REP supplies restorative enablement and scope.
    MIN: MIN owns awareness, expectation, confidence, diagnosis, intention, and belief
      in recovery. Recoverability and restorative applicability may hold without any
      observer knowing or believing that they hold.
    CON: CON owns service relationships, channels, coordination, requests, and participant
      exchange. A communicative or social relation may help realize a restoration
      pathway but is not itself restorative enablement.
    WRN: WRN owns faults, hazards, degradation, impairment, and adverse propagation.
      REP:2xx states capacity for restoration, not the adverse condition or process
      from which restoration may be needed.
    STR: STR owns structural interfaces, compatibility, dependency, topology, redundancy,
      and reconfiguration affordances. Structure may realize a restoration relation
      or pathway, but REP adds typed restorative enablement.
    LOG: LOG owns validity, constraint satisfaction, permission, compatibility rules,
      preconditions, and quantified inference. REP:2xx is not authorization, a probability
      judgment, or a rule saying restoration may occur.
    DAT: DAT owns evidence, measurements, repair records, backups, checkpoints, provenance,
      and information-flow graphs. A record or backup can support or describe a REP
      affordance but is not the recoverability, restorative relation, or pathway itself.
    CRE: CRE owns creation, design, replacement, reconstruction, mutation, and fabrication.
      Creating a remedy or pathway is separate from the resulting REP restorative
      affordance.
    ORI: ORI owns general possibility, necessity, time, manifestation, and modality.
      REP:2xx states a typed restorative affordance or relation; it does not encode
      unrestricted possibility, probability, schedule, or future time.
  runtime_state_interpretation:
    '0': Denies that the persistent internal recoverability persists in the stated
      restoration context; it does not select the operative or latent sibling and
      does not establish a different restorative affordance.
    '1': Affirms that the persistent internal recoverability persists independently
      of current operation, without asserting that internal, target, or systemic restoration
      is occurring.
    2/num: Leaves unresolved whether the persistent internal recoverability persists;
      the lexical root remains the persistent member and does not become latent.
  lexical_runtime_distinction: Lexical third trit 0 permanently selects the persistent
    member of this restorative-affordance triplet. Runtime `[2]/num` instead marks
    a token-level assertion pending, remembered, or unresolved. Thus `REP:200[1]`
    affirms the lexical concept, while a persistent or operative sibling carrying
    `[2]/num` remains that sibling and never becomes a latent root.
  examples:
  - category: ordinary_conversation
    semantic_graph: REP:200[1](ENTITY=e,CAPACITY=r)
    literal_gloss: affirm persistent internal recoverability of one reference entity
    natural_english: This device retains its internal recoverability whether or not
      it is currently operative.
    runtime_state: 1
    contour: level declaration
    role_registers: mid register for the reference entity; low register for its recoverability
    use_status: valid
    analysis: The example asserts only restorative affordance, not a restoration event.
  - category: physical_or_spatial
    semantic_graph: MAT(REALIZATION=m)+REP:200[1](ENTITY=e,CAPACITY=r)
    literal_gloss: material realization plus persistent internal recoverability
    natural_english: The organism has the stated capacity for internally originating
      restoration without asserting that healing is occurring.
    runtime_state: 1
    contour: level declaration
    role_registers: mid register for the reference entity; low register for its recoverability
    use_status: valid
    analysis: MAT/LIF supplies concrete realization; REP supplies restorative enablement
      and scope.
  - category: temporal_or_sequential
    semantic_graph: REP:200[1](ENTITY=e,CAPACITY=r)+ORI(INTERVAL=w)
    literal_gloss: persistent internal recoverability during interval w
    natural_english: During the observation interval, the same device has the stated
      internal-recoverability status.
    runtime_state: 1
    contour: level declaration
    role_registers: mid register for the reference entity; low register for its recoverability
    use_status: valid
    analysis: ORI locates the claim in time; lexical third-trit status is not tense.
  - category: cross_family_compound
    semantic_graph: DAT(RECORD=d)+STR(PATH=p)+REP:200[1](ENTITY=e,CAPACITY=r)
    literal_gloss: record and realization plus persistent internal recoverability
    natural_english: The record and structural path concern the restorative affordance,
      which still must hold independently.
    runtime_state: 1
    contour: level declaration
    role_registers: mid register for the reference entity; low register for its recoverability
    use_status: valid
    analysis: DAT and STR describe evidence or realization; neither substitutes for
      the REP affordance.
  - category: executable_or_programming
    semantic_graph: REP:200[1](ENTITY=e,CAPACITY=r)
    literal_gloss: assert persistent internal recoverability
    natural_english: The service reports whether its self-recovery capacity has the
      stated status without asserting a recovery event.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers: mid register for the reference entity; low register for its recoverability
    use_status: valid
    analysis: The executable test must preserve reference identity and scope roles
      explicitly.
    pseudocode: assert(restorative_affordance.matches?("REP:200"))
  - category: counterexample
    semantic_graph: REP:101[1](ENTITY=e,CONDITION=c)
    literal_gloss: active internal restoration
    natural_english: The service is recovering now.
    runtime_state: 1
    contour: level declaration
    role_registers: mid register for the reference entity; low register for its recoverability
    use_status: must_not_use_this_root
    analysis: Use REP:101 for the ongoing restorative transformation; REP:200 names
      capacity for that transformation, not its occurrence.
  future_compound_examples:
  - REP:200 + REP:0xx identifies the internal, target, or shared restoration condition
    associated with the restorative affordance.
  - REP:200 + REP:1xx distinguishes a restorative affordance from its actual restoration
    process.
  - REP:200 + MAT/MOV/LIF/STR/CON specifies physical, spatial, biological, structural,
    or communicative realization without reducing the REP meaning to that realization.
  - REP:200 + DAT/MIN/LOG specifies evidence, recognition, formal conditions, or probability
    while keeping the restorative affordance independent.
  - REP:200 + CRE/WRN states replacement, reconstruction, or the adverse condition
    from which restoration is needed without importing those meanings into the atom.
  later_era_notes: Later eras may lexicalize recoverable, repairable, healable, treatable,
    remediable, restorable-from-backup, service-compatible, rehabilitable, disaster-recoverable,
    and failover-capable descendants. Era Zero must retain the internal-recoverability
    / one-source-one-target restorative-applicability / shared-multi-participant pathway
    contrast and keep persistent, operative, and latent lexical status separate from
    runtime uncertainty and general modality.
