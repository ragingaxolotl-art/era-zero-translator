    runtime_state: 1
    contour: declarative
    role_registers:
      low: cognizer or cognitive community
      middle: MIN revision predicate
      high: represented target or revised content
      sustained: shared frame, evidence context, or execution environment
    use_status: valid
    analysis: MAT owns the body; MIN owns the changed self-representation.
  - category: temporal_or_sequential
    semantic_graph: MIN:100[1](COGNIZER=agent,BEFORE=self_v1,AFTER=self_v2)
    literal_gloss: agent; self-model revision completed from v1 to v2
    natural_english: The agent finished updating its self-model after the diagnostic.
    runtime_state: 1
    contour: declarative
    role_registers:
      low: cognizer or cognitive community
      middle: MIN revision predicate
      high: represented target or revised content
      sustained: shared frame, evidence context, or execution environment
    use_status: valid
    analysis: Before/after content is graph structure, not hidden in the atom.
  - category: cross_family_compound
    semantic_graph: DAT(EVIDENCE=performance_log)+MIN:100[1](COGNIZER=agent,CONTENT=capability_model)
    literal_gloss: performance log causes completed self-model revision
    natural_english: The log led the agent to revise its model of its own capability.
    runtime_state: 1
    contour: declarative
    role_registers:
      low: cognizer or cognitive community
      middle: MIN revision predicate
      high: represented target or revised content
      sustained: shared frame, evidence context, or execution environment
    use_status: valid
    analysis: DAT supplies evidence; a causal relation must be explicit.
  - category: executable_or_programming
    semantic_graph: MIN:100[1](COGNIZER=agent,CONTENT=self_model,RESULT=version_4)
    literal_gloss: agent; self-model revision completed with version 4
    natural_english: Commit the revised agent self-model as version 4.
    runtime_state: 1
    contour: declarative
    role_registers:
      low: cognizer or cognitive community
      middle: MIN revision predicate
      high: represented target or revised content
      sustained: shared frame, evidence context, or execution environment
    use_status: valid
    analysis: Useful as the semantic event behind a successful self-model update.
