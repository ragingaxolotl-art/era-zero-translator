  - category: counterexample
    semantic_graph: MIN:001[1](COGNIZER=I,CONTENT=current_mood)
    literal_gloss: I; manifest self-representation
    natural_english: I am aware of my mood, but my self-model has not changed.
    runtime_state: 1
    contour: declarative
    role_registers:
      low: cognizer or cognitive community
      middle: MIN revision predicate
      high: represented target or revised content
      sustained: shared frame, evidence context, or execution environment
    use_status: must_not_use_this_root
    analysis: Present self-awareness without representational change uses MIN:001,
