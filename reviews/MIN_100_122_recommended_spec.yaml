  proposal_status: recommended_after_adversarial_review_pending_delegated_approval
  proposed_title: completed self-model revision
  invariant_definition: A completed cognitive process whose result is a change to
    the cognizer's representation of the cognizer's own identity or condition.
  semantic_center: cognitive representational revision
  address_justification:
    first_trit_1: 'Selects a process/action/transformation: a cognitive representation
      changes rather than merely existing or being available.'
    second_trit: 'Selects inward/self scope: the represented subject is the cognizer''s
      own identity or condition.'
    third_trit: 'Selects the completed phase: the revision has reached its bounded
      result.'
  inclusion_boundary: Includes only a cognitive process whose semantic result is a
    change to the cognizer's representation of the cognizer. The change may add, remove,
    reorganize, differentiate, merge, or reweight represented content without asserting
    why, whether it is correct, or how it is physically realized.
  excluded_meanings:
  - Mere persistence, manifestation, or latency of a representation without change;
    canonical MIN:0xx owns the representation entity or condition.
  - Attention allocation, perception, recall, imagination, inference, evaluation,
    learning, or decision when no representational change is asserted.
  - Truth, proof, certainty, probability, belief commitment, or ontological accuracy.
  - Communication, consensus procedure, data storage, physical neural change, structural
    change, error detection, repair, planning, intention, scheduling, queuing, and
    future time.
  - A change to an external record or physical model unless a cognizer's representation
    also changes.
  nearest_neighbors:
  - MIN:101
  - MIN:102
  - MIN:000
  - MIN:001
  - MIN:002
  same_family_contrast: MIN:000–002 owns the representation at the same scope as a
    cognitive entity/condition; MIN:100 owns the completed process that changes it.
    The other two members of this 1x triplet own the identical revision process at
    different lexical phases.
  cross_family_comparisons: &1
    LIF: LIF owns living identity, consciousness, and organismic condition. MIN owns
      only a change in cognitive representation of such content; use a compound when
      both are asserted.
    MOV: MOV owns motion and change of position. MIN may revise a route or position
      model but never performs the physical movement.
    MAT: MAT owns physical bodies, signals, neural substrate, and material change.
      MIN owns representational revision, not the substrate or stimulus.
    CON: CON owns participant linkage, communication, access, and transmission. Communication
      may cause or coordinate revision but is neither necessary nor sufficient for
      it.
    STR: STR owns external arrangement, hierarchy, and structural transition. MIN
      owns a cognizer's revised representation of structure, not the structure itself.
    WRN: WRN owns error, anomaly, hazard, and failure. A mistaken or discrepancy-triggered
      revision requires WRN + MIN; revision itself is neutral about correctness.
    REP: REP owns repair and restoration. Revision can improve, worsen, or neutrally
      alter a representation; it must not imply correction or repair.
    LOG: LOG owns inference validity, proof, consistency, and formal consequence.
      Reasoning may cause cognitive revision, but valid inference and mental change
      are independent.
    DAT: DAT owns external information, records, storage, queues, and data flow. A
      data update is not a cognitive revision unless a cognizer's representation also
      changes.
    CRE: CRE owns generation, design, intention artifacts, and plans. A newly created
      idea may coincide with revision, but ideation and representational change are
      distinct.
    ORI: ORI owns time, existence, ontology, and modality. Possibility, future time,
      certainty, and actualization relations must remain explicit rather than being
      smuggled into MIN.
  runtime_state_interpretation:
    '0': Denies that the specified self-model revision exists in the lexical completed
      phase for this token.
    '1': Affirms that the specified self-model revision exists in the lexical completed
      phase for this token.
    2/num: Leaves the current assertion about the self-model revision dormant or unresolved;
      it does not select another lexical phase or add a plan, schedule, or future
      time.
  lexical_runtime_distinction: The third lexical trit permanently selects the completed
    kind of self-model revision. Runtime `[2]/num` separately marks the current assertion
    token as dormant or unresolved. For a lexical `*2` root, `[1]` affirms that the
    process is nonactualized; `[2]/num` leaves the assertion about that nonactualized
    process unresolved. Neither layer encodes intention or schedule.
  examples:
  - category: ordinary_conversation
    semantic_graph: MIN:100[1](COGNIZER=I,CONTENT=self_as_manager)
    literal_gloss: I; completed revision of my self-model
