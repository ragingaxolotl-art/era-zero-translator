    title: persistent internal recoverability
    invariant_candidate: A persistent capacity of one reference entity to undergo
      internally originating restoration under qualifying conditions, independently
      of whether that capacity is presently operative.
    analysis:
      why_it_fits: It makes first-trit 2 the capacity or qualifying relation for the
        matching canonical REP:10x transformation while preserving inward scope and
        persistent expression.
      useful_coverage: It covers recoverability, repairability, remedy applicability,
        rehabilitative compatibility, restoration channels, disaster-recovery paths,
        and systemic recovery affordances.
      semantic_territory_consumed: Only the substrate-neutral restorative affordance
        that enables internal recoverability. Conditions, actual restoration, mechanics,
        records, resources, service obligations, protection, and modality remain separate.
      conflicts_or_future_limitations: The technical words applicability and pathway
        must be restricted to restorative enablement rather than generic compatibility
        or route identity, but the invariant and compounds make that boundary explicit.
