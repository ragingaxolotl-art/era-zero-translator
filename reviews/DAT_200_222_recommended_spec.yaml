    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity, source context, or participant whose data affordance
        is asserted
      middle: information-process capacity or transfer relation as the asserted figure
      high: represented information, distinct target, or synchronization criterion
      sustained: shared data domain and multiple synchronizable participants
    use_status: valid
    analysis: Information affordance and physical implementation remain separately
      typed.
  - category: temporal_or_sequential
    semantic_graph: DAT:200[1](ENTITY=device,DATA=d)+ORI(INTERVAL=w)
    literal_gloss: persistent information-process affordance during interval w
    natural_english: During interval w, the affordance has the stated lexical status.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity, source context, or participant whose data affordance
        is asserted
      middle: information-process capacity or transfer relation as the asserted figure
      high: represented information, distinct target, or synchronization criterion
      sustained: shared data domain and multiple synchronizable participants
    use_status: valid
    analysis: ORI supplies time and does not replace persistent, operative, or latent
      status.
  - category: cross_family_compound
    semantic_graph: DAT:001[1](DATA=d)+DAT:200[1](ENTITY=device,DATA=d)+CON(CHANNEL=h)
    literal_gloss: manifest datum plus persistent information affordance plus channel
    natural_english: The datum and affordance remain DAT while CON supplies any communication
      channel or access authority.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity, source context, or participant whose data affordance
        is asserted
      middle: information-process capacity or transfer relation as the asserted figure
      high: represented information, distinct target, or synchronization criterion
      sustained: shared data domain and multiple synchronizable participants
    use_status: valid
    analysis: Entity, affordance, and participant relation remain distinct.
  - category: executable_or_programming
    semantic_graph: DAT:200[1](ENTITY=device,DATA=d)
    literal_gloss: assert persistent information-process affordance
    natural_english: A runtime tracks whether the selected data affordance has the
      stated status without asserting process execution or outcome.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: reference entity, source context, or participant whose data affordance
        is asserted
      middle: information-process capacity or transfer relation as the asserted figure
      high: represented information, distinct target, or synchronization criterion
      sustained: shared data domain and multiple synchronizable participants
    use_status: valid
    analysis: Capability, process, and result remain distinct.
    pseudocode: assert(data_affordance.status == "DAT:200")
  - category: counterexample
    semantic_graph: DAT:101[1](ENTITY=device,DATA=d)
    literal_gloss: active internal data transformation
    natural_english: The information transformation is running now.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity, source context, or participant whose data affordance
        is asserted
      middle: information-process capacity or transfer relation as the asserted figure
      high: represented information, distinct target, or synchronization criterion
      sustained: shared data domain and multiple synchronizable participants
    use_status: must_not_use_this_root
    analysis: Use DAT:1xx for the actual process; DAT:200 names only its enabling
      capacity or relation.
  future_compound_examples:
  - DAT:200 + DAT:0xx supplies the datum, target reference, or shared dataset without
