  proposal_status: canonical_by_delegated_approval
  proposed_title: persistent internal data transformability
  invariant_definition: A persistent capacity of represented information within one
    reference entity to undergo bounded internal data transformation, independently
    of whether that capacity is presently operative.
  semantic_center: 'information-process affordances: internal transformability, source-target
    transferability, and systemic synchronizability'
  address_justification:
    first_trit_2: Selects an information-process capacity or qualifying transfer relation
      rather than an information entity, actual data process, physical carrier, result
      value, or unrestricted modality.
    second_trit: 'Selects inward/self scope: represented information within one entity
      and its capacity for bounded internal transformation and no other Data-family
      column.'
    third_trit: Selects the persistent status of the same information-process affordance
      while leaving runtime truth status, actual processing, quality, observer knowledge,
      tense, probability, permission, and scheduling separate.
  inclusion_boundary: Includes only the persistent internal data transformability
    as a substrate-neutral information-process affordance at inward scope. The capacity
    concerns represented information within one entity without requiring a distinct
    external target. The datum, algorithm, medium, actual transformation, and result
    remain separate. It is neutral about information-object identity, storage medium,
    access authority, fidelity, integrity, provenance, bandwidth, resource sufficiency,
    observer belief, scheduling, probability, timing, and cause.
  excluded_meanings:
  - The internal datum, target reference, or shared dataset as an entity, and its
    persistent, manifest, or dormant status.
  - The completed, active, or nonactualized transformation, target transfer, or synchronization
    process and any quality or acknowledgment result.
  - Specific encodings, schemas, algorithms, storage devices, physical carriers, channels,
    credentials, bandwidth, or computational resources.
  - Physical, biological, communicative, cognitive, logical, structural, restorative,
    creative, or adverse capacity or transformation.
  - Access permission, retrieval, reference resolution, integrity, provenance, consistency,
    compatibility, ownership, authority, performance, or resource sufficiency.
  - Observer knowledge, evidence, intention, plan, readiness, queue, schedule, future
    time, unrestricted possibility, necessity, probability, or cause.
  nearest_neighbors:
  - DAT:201
  - DAT:202
  - DAT:210
  - DAT:220
  - DAT:000
  - DAT:100
  same_family_contrast: "`DAT:0xx` owns information entities and their persistent,
    manifest, or dormant status. `DAT:1xx` owns the corresponding completed, active,
    or nonactualized information processes. `DAT:2xx` owns only typed process enablement:
    internal transformability, source-target transferability, and systemic synchronizability.
    A datum does not entail transformability, an affordance does not entail an actual
    process, and a completed process does not entail fidelity, persistence, or acknowledgment.
    Persistent identity may co-occur with operative or latent status; operative and
    latent are mutually exclusive for the same affordance at one reference time. Lexical
    latency affirms an existing but nonoperative affordance; runtime `[2]/num` separately
    marks uncertainty about any selected status."
  cross_family_comparisons: &1
    LIF: LIF owns living identities, biological capacities, agents, and social roles.
      A living bearer may support data processing, but DAT:2xx does not encode life,
      health, intelligence, office, or agency.
    MOV: MOV owns position, routes, displacement, and motion affordances. Physical
      carrier reachability may realize transferability, but information-process enablement
      is not spatial reachability or a route.
    MAT: MAT owns substance, energy, force, contact, material compatibility, and physical
      capacities. Material media may realize a data affordance, but DAT:2xx does not
      encode storage hardware, energy, mechanism, or physical coupling.
    MIN: MIN owns attention, belief, expectation, confidence, understanding, and cognitive
      capacity. Data transformability or transferability can hold without anyone knowing,
      understanding, observing, or intending that it holds.
    CON: CON owns communication, social linkage, participation, access authority,
      and interaction channels. A channel may realize target data transfer, but participant
      reachability, permission, and communicative uptake are not DAT:2xx affordances.
    WRN: WRN owns hazards, faults, adverse processes, susceptibility, exposure, and
      propagation pathways. Lack of a data affordance may be adverse, but DAT:2xx
      does not assert corruption, danger, failure, warning, or vulnerability.
    STR: STR owns arrangements, interfaces, dependencies, structural compatibility,
      and transformation affordances. Structure may realize a data affordance, but
      DAT:2xx adds only typed information-process enablement.
    REP: REP owns restoration conditions, transformations, and affordances. Recovering
      information may use DAT processes, but DAT:2xx is not recoverability, restoration
      applicability, or a recovery pathway.
    LOG: LOG owns formal criteria, evaluations, applicability, and joint evaluability.
      A rule may qualify a data operation, but formal admissibility and data-process
      enablement remain distinct.
    CRE: CRE owns generation, construction, transformation, and productive capacities.
      Creating information or an algorithm is separate from whether existing represented
      information can be transformed, transferred, or synchronized.
    ORI: ORI owns general possibility, necessity, probability, time, cause, and ontological
      qualification. DAT:2xx asserts a typed existing information-process affordance,
      never unrestricted possibility or futurity.
  runtime_state_interpretation:
    '0': Denies that this internal data transformability persists in the stated information
      context; it does not select the operative or latent sibling and does not establish
      a different access or quality relation.
    '1': Affirms that this internal data transformability persists independently of
      current operation, without asserting that a data process is occurring or that
      any result quality holds.
    2/num: Leaves unresolved whether this persistent internal data transformability
      claim holds; runtime uncertainty does not change the lexical root into operative
      or latent status.
  lexical_runtime_distinction: Lexical third trit `0` permanently selects the persistent
    status of this information-process affordance. Runtime `[2]/num` instead leaves
    the already-selected status claim unresolved; it never changes affordance status.
    Thus a latent root affirmed with `[1]` is a confirmed existing-but-nonoperative
    affordance, while a persistent or operative root carrying `[2]/num` remains lexically
    persistent or operative but uncertain as a token claim.
  examples:
  - category: ordinary_conversation
    semantic_graph: DAT:200[1](ENTITY=device,DATA=d)
    literal_gloss: affirm persistent internal data transformability
    natural_english: The internal data transformability for the device persists independently
      of present operation.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity, source context, or participant whose data affordance
        is asserted
      middle: information-process capacity or transfer relation as the asserted figure
      high: represented information, distinct target, or synchronization criterion
      sustained: shared data domain and multiple synchronizable participants
    use_status: valid
    analysis: The root asserts information-process enablement and lexical status,
      not an actual process or result.
