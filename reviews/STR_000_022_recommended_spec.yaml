      sustained: composite structural context
    use_status: valid
    analysis: The root names the structural position, not the object that may occupy
      it.
  - category: physical_or_spatial
    semantic_graph: MAT(CONSTITUENT=part)+STR:000[1](WHOLE=frame,POSITION=slot)
    literal_gloss: material part and persistent structural position
    natural_english: The frame retains a constituent position for the crossbar.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference structure or containing whole
      middle: structural locus or part–whole arrangement
      high: constituent or distinct external target
      sustained: composite structural context
    use_status: valid
    analysis: MAT owns the part; STR owns its position in the whole.
  - category: temporal_or_sequential
    semantic_graph: STR:000[1](WHOLE=hall,POSITION=seat)+ORI(INTERVAL=session)
    literal_gloss: constituent position evaluated during session
    natural_english: The seating position has the stated structural condition during
      the session.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference structure or containing whole
      middle: structural locus or part–whole arrangement
      high: constituent or distinct external target
      sustained: composite structural context
    use_status: valid
    analysis: ORI supplies time; STR does not schedule occupancy.
  - category: cross_family_compound
    semantic_graph: DAT(LABEL=s3)+STR:000(POSITION=s3)+STR:000[1](POSITION=s3)
    literal_gloss: data label plus constituent-position condition
    natural_english: The labeled structural position has the stated condition.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference structure or containing whole
      middle: structural locus or part–whole arrangement
      high: constituent or distinct external target
      sustained: composite structural context
    use_status: valid
    analysis: DAT owns the identifier; STR owns the structural locus.
  - category: executable_or_programming
    semantic_graph: STR:000[1](WHOLE=object_graph,POSITION=field_slot)
    literal_gloss: assert persistent constituent position
    natural_english: The object layout retains a constituent position for one handler.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: reference structure or containing whole
      middle: structural locus or part–whole arrangement
      high: constituent or distinct external target
