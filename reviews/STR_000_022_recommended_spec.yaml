  proposal_status: canonical_by_delegated_approval
  proposed_title: persistent constituent position
  invariant_definition: A position within a structure that remains identified as a
    place for one constituent independently of its present occupancy.
  semantic_center: 'substrate-neutral structural loci and arrangements: constituent
    positions, outward engagement interfaces, and composite part–whole arrangements'
  address_justification:
    first_trit_0: 'Selects an entity or condition: persistent constituent position
      is a structural locus or arrangement, not a construction process, support relation,
      organizational capacity, material object, or information record.'
    second_trit: 'Selects inward/self scope: one constituent position internal to
      a reference structure and no other structural column.'
    third_trit: Selects the stable/persistent entity condition by occupancy, engagement,
      or structural realization while leaving runtime truth status and temporal scheduling
      separate.
  inclusion_boundary: Includes only the persistent constituent position as a substrate-neutral
    claim about one constituent position internal to a reference structure. The claim
    is about the structural place available to or occupied by a constituent, not the
    constituent itself and not a spatial coordinate. It is neutral about substance,
    spatial coordinates, function, purpose, ownership, rules, construction, support
    relations, safety, communication, and social identity.
  excluded_meanings:
  - The constituent, physical component, material surface, body, building, container,
    person, institution, or organization as an independently identified entity.
  - Spatial coordinate, destination, route, physical inside/outside region, movement,
    shape, mass, load, strength, or material integrity.
  - Function, purpose, operation, authority, permission, role obligation, type constraint,
    compatibility, protocol, communication, or cognition.
  - Blueprint, schema record, graph serialization, diagram, label, index, class declaration,
    or other information object describing structure.
  - Building, assembling, rearranging, occupying, attaching, supporting, containing,
    repairing, or governing as a process or relation.
  - Damage, failure, reservation, plan, schedule, probability, intended later use,
    or future realization—especially for third-trit 2.
  nearest_neighbors:
  - STR:001
  - STR:002
  - STR:010
  - STR:020
  - STR:100
  - STR:200
  same_family_contrast: "`STR:0xx` owns structural loci and part–whole arrangements
    as entities or conditions; `STR:1xx` owns structural change processes; `STR:2xx`
    remains reserved for structural capacities and continuing relations such as support,
    containment, dependency, fit, or systemic organization. Occupancy, engagement,
    or realization in 0xx does not itself name the process or relation that produced
    it. The persistent member is realization-neutral: it may co-occur with the occupied/engaged/instantiated
    sibling or with the vacant/unengaged/dormant sibling at the same reference time.
    It asserts continuity of structural identity, not a third mutually exclusive occupancy
    or realization value."
  cross_family_comparisons: &1
    LIF: LIF owns the identity, consciousness, organism, group identity, and social
      status of living participants. STR can describe their arrangement without turning
      organization into life or community identity.
    MOV: MOV owns position in a reference frame, paths, displacement, and traversal.
      A structural position is a role in a part–whole arrangement, not a spatial coordinate
      or destination.
    MAT: MAT owns physical substance, bodies, components as matter, surfaces, and
      load-bearing material. STR owns substrate-neutral positions, interfaces, and
      arrangements that may be realized by MAT objects.
    MIN: MIN owns mental representations, categories, attention, and cognitive schemas.
      A structural arrangement can be conceived mentally, but STR names the arrangement
      rather than a cognizer's model of it.
    CON: CON owns communicative endpoints, channels, exchange processes, capacities,
      and participant relations. A STR interface is for structural engagement and
      does not imply communication or connectivity.
    WRN: WRN owns instability, collapse risk, damage, mismatch, and failure. STR roots
      are neutral about safety and integrity unless a warning or failure claim is
      added.
    REP: REP owns repair, restoration, replacement, and reassembly after loss. A vacant
      position or dormant arrangement is not itself broken and does not imply restoration.
    LOG: LOG owns type rules, permissions, constraints, validity, compatibility, and
      role authority. STR names actual structural loci or arrangements, not the rule
      that permits or constrains them.
    DAT: DAT owns blueprints, schemas, diagrams, records, indexes, and serialized
      graphs as information objects. STR names the structural position, interface,
      or arrangement those records describe.
    CRE: CRE owns designing, building, assembling, and generating structures. STR:0xx
      names structural entities or conditions without asserting their creation process.
    ORI: ORI owns existence, manifestation, time, modality, and ontological instantiation
      generally. STR:021 and STR:022 distinguish realization of a specific part–whole
      arrangement, not existence or possibility in general.
  runtime_state_interpretation:
    '0': Denies that the persistent constituent position remains identified in the
      stated structural context; it does not assert the active or dormant sibling.
    '1': Affirms that the constituent position persists as identified across the stated
      context, without deciding present occupancy, engagement, realization, function,
      or integrity beyond the invariant.
    2/num: Leaves unresolved whether the persistent constituent position remains identified;
      it does not convert the lexeme into its active or dormant sibling.
  lexical_runtime_distinction: Lexical third trit `0` permanently selects the stable/persistent
    member of this structural triplet. Runtime `[2]/num` instead leaves the truth
    or applicability of that already-selected root unresolved; it never changes occupancy,
    engagement, or realization phase.
  examples:
  - category: ordinary_conversation
    semantic_graph: STR:000[1](WHOLE=cabinet,POSITION=slot)
    literal_gloss: persistent constituent position
    natural_english: That cabinet position remains the designated place for the filter
