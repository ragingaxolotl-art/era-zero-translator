    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source entity, creator, or participant associated with the generative entity
      middle: generative pattern, generated artifact, or shared repertoire asserted
        as the figure
      high: distinct product, medium, method, or beneficiary when separately expressed
      sustained: shared production domain and its multiple participating maintainers
    use_status: valid
    analysis: Creative identity and physical realization remain separately typed.
  - category: temporal_or_sequential
    semantic_graph: CRE:000[1](SOURCE=studio,PATTERN=p)+ORI(INTERVAL=w)
    literal_gloss: persistent creation entity during interval w
    natural_english: During interval w, the generative entity has the stated lexical
      status.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source entity, creator, or participant associated with the generative entity
      middle: generative pattern, generated artifact, or shared repertoire asserted
        as the figure
      high: distinct product, medium, method, or beneficiary when separately expressed
      sustained: shared production domain and its multiple participating maintainers
    use_status: valid
    analysis: ORI supplies time and does not replace expression status.
  - category: cross_family_compound
    semantic_graph: DAT(REPRESENTATION=d)+CRE:000[1](SOURCE=studio,PATTERN=p)
    literal_gloss: data representation plus persistent creation entity
    natural_english: The file encodes the generative entity without becoming identical
      to its creative function.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source entity, creator, or participant associated with the generative entity
      middle: generative pattern, generated artifact, or shared repertoire asserted
        as the figure
      high: distinct product, medium, method, or beneficiary when separately expressed
      sustained: shared production domain and its multiple participating maintainers
    use_status: valid
    analysis: DAT and CRE remain distinct.
  - category: executable_or_programming
    semantic_graph: CRE:000[1](SOURCE=studio,PATTERN=p)
    literal_gloss: assert persistent creation-entity status
    natural_english: A runtime registers a template, generated artifact, or repertoire
      without claiming that generation is executing.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: source entity, creator, or participant associated with the generative entity
      middle: generative pattern, generated artifact, or shared repertoire asserted
        as the figure
      high: distinct product, medium, method, or beneficiary when separately expressed
      sustained: shared production domain and its multiple participating maintainers
    use_status: valid
    analysis: Entity identity and productive processes remain separate.
    pseudocode: assert(generative_entity.status == "CRE:000")
  - category: counterexample
    semantic_graph: MIN(IDEA=i,COGNIZER=c)
    literal_gloss: mental conception
    natural_english: She imagined a possible form.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source entity, creator, or participant associated with the generative entity
      middle: generative pattern, generated artifact, or shared repertoire asserted
        as the figure
      high: distinct product, medium, method, or beneficiary when separately expressed
      sustained: shared production domain and its multiple participating maintainers
    use_status: must_not_use_this_root
    analysis: Use MIN for imagination unless a form-specifying production source is
      separately constituted as CRE:000.
  future_compound_examples:
  - CRE:000 + MAT supplies physical medium, material, or energy without reducing the
    Creation entity to matter.
  - CRE:000 + MIN supplies imagination, intention, observation, or appreciation while
