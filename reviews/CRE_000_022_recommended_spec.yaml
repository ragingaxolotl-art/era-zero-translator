  proposal_status: canonical_by_delegated_approval
  proposed_title: persistent internal generative pattern
  invariant_definition: A persistent bounded form-specifying pattern maintained within
    one reference entity as a source for production, independently of whether that
    pattern is presently expressed.
  semantic_center: 'creation entities: internal generative patterns, generated artifacts,
    and shared generative repertoires'
  address_justification:
    first_trit_0: Selects a Creation entity rather than a productive transformation,
      production relation, represented datum, structural arrangement, or physical
      medium.
    second_trit: 'Selects inward/self scope: one bounded form-specifying pattern maintained
      within one reference entity as a source for production and no other Creation-family
      column.'
    third_trit: Selects the persistent/manifestation-neutral member by creation-entity
      identity or present expression while leaving runtime truth status, completion,
      quality, use, tense, probability, and process phase separate.
  inclusion_boundary: Includes only the persistent internal generative pattern as
    a substrate-neutral creation entity at inward scope. The claim is about a form-specifying
    source for production maintained within one reference entity, not a mere idea,
    a stored description, a formal rule, the production act, or its product. It is
    neutral about mental awareness, representation, formal validity, arrangement,
    material realization, production activity, completion, quality, value, authorship,
    provenance, probability, timing, and cause.
  excluded_meanings:
  - Mental inspiration, imagination, intention, belief, memory, attention, or subjective
    appreciation of a possible form.
  - Actual generation, transformation, revision, assembly, testing, publication, copying,
    distribution, or consumption of a product.
  - Physical material, energy, tool, inscription, storage medium, device, workshop,
    or mechanical production capacity.
  - Structural arrangement alone, formal rule, schema, represented description, algorithm,
    encoded file, or dataset that lacks a production-source or generated-product role.
  - Creator identity, recipient, ownership, authorship, originality, permission, responsibility,
    quality, beauty, value, success, or completion.
  - Accessibility, observability, discoverability, provenance, version, schedule,
    future realization, possibility, necessity, probability, or cause.
  nearest_neighbors:
  - CRE:001
  - CRE:002
  - CRE:010
  - CRE:020
  - CRE:100
  - CRE:200
  same_family_contrast: "`CRE:0xx` owns generative entities and their persistent,
    manifest, or dormant status. `CRE:1xx` remains reserved for actual productive
    transformations, and `CRE:2xx` for generative capacities, dependencies, provenance,
    or other production relations. A manifest pattern does not entail active generation,
    and a manifest artifact does not entail completion, quality, use, ownership, or
    value. The persistent member is manifestation-neutral: it may co-occur with the
    manifest sibling or the dormant sibling at the same reference time. It asserts
    continuity of creation-entity identity rather than a third mutually exclusive
    manifestation value."
  cross_family_comparisons: &1
    LIF: LIF owns living identities, biological conditions, agency, and social collectives.
      A creator may bear a generative pattern or produce an artifact, but CRE does
      not identify the living agent or its social role.
    MOV: MOV owns position, path, displacement, and motion affordances. An artifact
      may move and a pattern may guide a trajectory, but creation identity neither
      locates nor transports anything.
    MAT: MAT owns substance, energy, force, contact, and material capacities. A physical
      object may realize an artifact, but CRE identifies its status as a generated
      product rather than its substance or mechanics.
    MIN: MIN owns awareness, imagination, belief, attention, memory, and intention.
      A mental idea may contribute to a generative pattern, but CRE requires a form-specifying
      production source rather than merely subjective content.
    CON: CON owns channels, participants, communication acts, delivery, and exchange.
      A pattern or artifact may be communicated, but its creation-domain identity
      is independent of transmission and participant linkage.
    WRN: WRN owns faults, hazards, adverse processes, and warnings. A defective artifact
      may instantiate WRN, but defectiveness and risk are not entailed by generated-product
      identity.
    STR: STR owns arrangements, boundaries, interfaces, schemas-as-structure, and
      dependencies. A template has structure, but CRE owns its function as a source
      for production rather than arrangement alone.
    REP: REP owns restoration conditions, restorative processes, and restorative affordances.
      Reconstructing an artifact may use CRE, but recoverability and repair remain
      REP meanings.
    LOG: LOG owns formal constraints, evaluations, and formal relations. A generative
      pattern may contain rules, but its production-guiding creative identity is not
      reducible to admissibility or inference.
    DAT: DAT owns represented information, references, datasets, transformations,
      transfers, and synchronization. A pattern may be encoded as data, but CRE owns
      what functions as a source or product of generation, not its representation.
    ORI: ORI owns temporal, modal, causal, and ontological qualification. Persistence,
      manifestation, and dormancy do not encode past, future, possibility, necessity,
      probability, or causal origin.
  runtime_state_interpretation:
    '0': Denies that this internal generative pattern persists as the same identified
      creation entity; it does not select the manifest or dormant sibling and does
      not erase every related pattern or product.
    '1': Affirms the persistent identity of this internal generative pattern while
      leaving current expression, medium, use, authorship, value, and production history
      undecided.
    2/num: Leaves unresolved whether this persistent internal generative pattern remains
      identified; uncertainty about the assertion does not change the lexical root
      into a manifest or dormant creation entity.
  lexical_runtime_distinction: Lexical third trit `0` permanently selects the persistent/manifestation-neutral
    member of this Creation-entity triplet. Runtime `[2]/num` instead leaves that
    already-selected assertion unresolved; it never changes manifestation status.
    Thus a dormant root affirmed with `[1]` is a confirmed maintained-but-unmanifest
    generative entity, while a persistent or manifest root carrying `[2]/num` remains
    lexically persistent or manifest but uncertain as a token claim.
  examples:
  - category: ordinary_conversation
    semantic_graph: CRE:000[1](SOURCE=studio,PATTERN=p)
    literal_gloss: affirm persistent internal generative pattern
    natural_english: That creative source or product remains the same identified thing
      whether or not it is expressed now.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source entity, creator, or participant associated with the generative entity
      middle: generative pattern, generated artifact, or shared repertoire asserted
        as the figure
      high: distinct product, medium, method, or beneficiary when separately expressed
      sustained: shared production domain and its multiple participating maintainers
    use_status: valid
    analysis: The root asserts a Creation entity and its expression status, not the
      act of producing it.
  - category: physical_or_spatial
