  - category: executable_or_programming
    semantic_graph: WRN:100[1](ENTITY=service,CONDITION=state)
    literal_gloss: assert completed internal degradation
    natural_english: The service completed an internally originating degradation into
      a less acceptable state.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: reference entity or impaired target
      middle: adverse transformation
      high: distinct source or affected participant
      sustained: shared system and correlated adverse context
    use_status: valid
    analysis: The adverse transformation originates within one reference entity and
