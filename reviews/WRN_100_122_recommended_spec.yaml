    transformations toward less acceptable conditions. WRN:2xx remains reserved for
    susceptibility, exposure, and systemic propagation-enabling capacities or relations.
    Internal degradation has no required distinct external source. Target impairment
    preserves one source and one target as distinct roles. Systemic propagation requires
    one correlated adverse condition to become distributed across multiple participants.
    A completed WRN:1xx root entails only that the stated adverse transformation reached
    completion at the reference time; it does not entail persistent fault identity,
    present manifestation, evidence, detection, severity, containment, repair need,
    or a continuing WRN:2xx relation unless separately asserted.'
  cross_family_comparisons: *1
  runtime_state_interpretation:
    '0': Denies that this systemic-propagation process holds even as a valid nonactualized
      transformation in the stated context; it does not assert activity or completion.
    '1': Affirms this systemic-propagation process as nonactualized—neither ongoing
      nor completed—without adding plan, intention, queue, schedule, permission, readiness,
      probability, or future time.
    2/num: Leaves unresolved even the assertion that this systemic-propagation process
      is a valid nonactualized transformation; lexical nonactualization and runtime
      uncertainty remain distinct.
  lexical_runtime_distinction: The lexical third trit permanently selects the nonactualized
    member of this process triplet. Runtime `[2]/num` instead qualifies the truth,
    applicability, or resolution of a token of that already-selected root; it never
    changes the root into a planned, future, or different-phase process.
  catalogue_title_guard: The word `nonactualized` in the concise catalogue title denotes
    a valid adverse process that is neither ongoing nor completed. It does not assert
    capability, readiness, probability, permission, intention, schedule, future time,
    or eventual realization.
  examples:
