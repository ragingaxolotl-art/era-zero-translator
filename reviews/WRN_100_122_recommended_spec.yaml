  proposal_status: canonical_by_delegated_approval
  proposed_title: completed internal degradation
  invariant_definition: Completion of an adverse transformation originating within
    one reference entity by which that entity enters a less acceptable condition.
  semantic_center: 'substrate-neutral adverse transformation: internal degradation,
    source-to-target impairment, and systemic propagation'
  address_justification:
    first_trit_1: Selects an adverse process, action, or transformation rather than
      an adverse-condition entity, susceptibility or exposure relation, evidence record,
      warning message, or response.
    second_trit: 'Selects inward/self scope: this root originates within one reference
      entity and changes that entity toward a less acceptable condition without requiring
      a distinct external source; no competing family or temporal phase is added by
      this axis.'
    third_trit: Selects the completed phase of the same internal-degradation process;
      planning, queueing, schedule, futurity, permission, probability, and runtime
      truth status remain separate.
  inclusion_boundary: Includes only a completed substrate-neutral adverse transformation
    that originates within one reference entity and changes that entity toward a less
    acceptable condition without requiring a distinct external source. If a distinct
    external source causes the change, use target impairment; if one condition distributes
    across several participants, use systemic propagation. The transformation may
    be realized physically, biologically, computationally, informationally, socially,
    or conceptually, but it does not itself assert the bearer, concrete mechanics,
    movement path, evidence, observer knowledge, formal invalidity, blame, warning
    communication, response, repair, probability, schedule, or causal history beyond
    the scope roles required by the invariant.
  excluded_meanings:
  - The fault, hazard, distributed incident, bearer, source, target, participant,
    material object, organism, software component, institution, or data record as
    an entity or condition.
  - Spatial movement, route traversal, physical force, collision, fracture, heating,
    biological mechanism, data mutation, destruction, or generation as such without
    the WRN adverse transformation claim.
  - Planning, intention, staging, queueing, scheduling, permission, readiness, probability,
    futurity, obligation, or specification—especially for lexical 1x2.
  - Detection, observation, diagnosis, classification, monitoring, evidence collection,
    belief revision, attribution, or measurement of an adverse condition.
  - Warning, signaling, alerting, broadcasting, blocking, isolation, containment,
    shutdown, evacuation, coordination, repair, restoration, stabilization, or recovery.
  - Susceptibility, vulnerability, exposure, exploitability, dependency, propagation
    pathway, probability, severity, blame, intention, or other continuing capacity
    or relation.
  nearest_neighbors:
  - WRN:101
  - WRN:102
  - WRN:110
  - WRN:120
  - WRN:000
  - WRN:200
  same_family_contrast: 'WRN:0xx owns adverse-condition entities: intrinsic faults,
    distinct external hazards, and correlated distributed faults. WRN:1xx owns adverse
    transformations toward less acceptable conditions. WRN:2xx remains reserved for
    susceptibility, exposure, and systemic propagation-enabling capacities or relations.
    Internal degradation has no required distinct external source. Target impairment
    preserves one source and one target as distinct roles. Systemic propagation requires
    one correlated adverse condition to become distributed across multiple participants.
    A completed WRN:1xx root entails only that the stated adverse transformation reached
    completion at the reference time; it does not entail persistent fault identity,
    present manifestation, evidence, detection, severity, containment, repair need,
    or a continuing WRN:2xx relation unless separately asserted.'
  cross_family_comparisons: &1
    LIF: LIF owns living identity, health, injury, illness, and social participants.
      WRN may classify an adverse transformation affecting life, but physiological
      change, pain, death, and social harm require LIF semantics.
    MOV: MOV owns location, displacement, approach, traversal, and redirection. Motion
      may deliver an adverse source, but WRN names deterioration, target impairment,
      or propagation rather than the path traveled.
    MAT: MAT owns physical force, energy, collision, fracture, heating, and material
      change. WRN abstracts the adverse significance and scope of a transformation;
      material mechanics remain separately asserted.
    MIN: MIN owns perception, attention, belief revision, intention, fear, and assessment
      by a cognizer. Adverse transformations can occur without detection or awareness,
      and diagnosis is not the transformation itself.
    CON: CON owns warnings, alarms, messages, coordination, and information exchange.
      Communicating about harm does not produce the adverse transformation, and propagation
      of a fault is not automatically communicative transmission.
    REP: REP owns repair, stabilization, restoration, recovery, and replacement after
      loss. WRN:1xx moves toward a less acceptable condition; REP moves toward a restored
      condition, and neither process entails the other.
    STR: STR owns structural reconfiguration, incorporation, integration, and their
      affordances. Structure can change without adversity, while WRN asserts adverse
      transformation without specifying structural organization unless compounded.
    LOG: LOG owns invalidation, rule failure, contradiction, permission, and formal
      non-satisfaction. A computation may become invalid without harm, and a harmful
      transformation may obey every rule; LOG and WRN remain independent.
    DAT: DAT owns corruption or transformation of records, encodings, observations,
      and provenance as information. WRN adds adverse significance and scope; editing
      a diagnostic record is not degradation, impairment, or propagation of the underlying
      condition.
    CRE: CRE owns generation, fabrication, mutation, destruction, and other artifact
      transformations. WRN does not claim creation or destruction as such; it selects
      only a transformation toward a contextually less acceptable condition.
    ORI: ORI owns tense, duration, modality, possibility, necessity, and general transition.
      Lexical WRN:1x2 selects a nonactualized adverse process and does not encode
      plan, schedule, queue, probability, future time, or eventual realization.
  runtime_state_interpretation:
    '0': Denies that this internal-degradation process reached completion in the stated
      warning context; it does not assert that the active or nonactualized sibling
      holds.
    '1': Affirms that this internal-degradation process reached its completed phase,
      without asserting evidence, attribution, severity, permanent damage, ongoing
      manifestation, containment, repairability, or recovery.
    2/num: Leaves unresolved whether this internal-degradation process reached completion
      or whether that completed result remains applicable; the lexical root stays
      completed.
  lexical_runtime_distinction: The lexical third trit permanently selects the completed
    member of this process triplet. Runtime `[2]/num` instead qualifies the truth,
    applicability, or resolution of a token of that already-selected root; it never
    changes the root into a planned, future, or different-phase process.
  catalogue_title_guard: The concise catalogue title is controlled by the invariant
    definition and must not be broadened with unstated mechanics, evidence, severity,
    response, result persistence, or temporal semantics.
