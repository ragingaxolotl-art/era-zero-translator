  - WRN:122 + MAT/MOV/LIF specifies physical mechanics, delivery path, or living effects
    without reducing adverse transformation to those domains.
  - WRN:122 + DAT/MIN/CON specifies evidence, recognition, diagnosis, or warning communication
    while keeping the adverse process independent.
  - WRN:122 + REP/STR/LOG distinguishes repair, containment or isolation, and formal
    control from degradation, impairment, or propagation.
