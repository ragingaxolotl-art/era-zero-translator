  - category: cross_family_compound
    semantic_graph: DAT(EVIDENCE=d)+MIN(AWARE=a)+WRN:100[1](ENTITY=appliance,CONDITION=condition)
    literal_gloss: evidence and awareness plus completed internal degradation
    natural_english: The observations and awareness concern an adverse transformation
      with the stated phase.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: reference entity or impaired target
      middle: adverse transformation
      high: distinct source or affected participant
      sustained: shared system and correlated adverse context
