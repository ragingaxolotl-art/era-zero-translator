  - candidate_id: current_phase2
    title: stable decidability
    invariant_candidate: An inward question has a dependable capacity to be resolved
      under the available rules.
    analysis:
      why_it_fits: The provisional titles use central Logic vocabulary—decidability,
        computability, applicability, implication, entailment, consistency, recursion,
        and possibility—and roughly reflect inward scope and persistent status.
      useful_coverage: They reach theorem proving, calculation, dependency, constraint
        solving, program execution, and formal-system design.
      semantic_territory_consumed: Across the block they mix evaluability, actual
        derivation, implication, result validity, computational resources, recursive
        processes, observer uncertainty, and unrestricted modality.
      conflicts_or_future_limitations: The three triplets have no shared invariant
        center and the third trit shifts among stability, activity, missing conditions,
        unresolved truth, and mere possibility.
    scores:
