  - candidate_id: formal_evaluability_affordances
    title: persistent internal formal evaluability
    invariant_candidate: A persistent capacity of one reference entity to undergo
      formal evaluation under its applicable internal criterion, independently of
      whether that capacity is presently operative.
    analysis:
      why_it_fits: First-trit 2 becomes the capacity or qualifying relation enabling
        the matching LOG:1xx evaluation; the second trit changes only inward, target,
        or systemic scope; and the third changes only persistent, operative, or latent
        status.
      useful_coverage: It supports evaluable, checkable, decidable-in-context, applicable
        constraint, type applicability, joint evaluability, interoperable validation,
        and capability-aware programming.
      semantic_territory_consumed: Only typed enablement for formal evaluation. Rule
        identity, actual evaluation, result polarity, algorithms, resource bounds,
        entailment, consistency, permission, evidence, and modality remain separate.
      conflicts_or_future_limitations: The English words decidable and computable
        have stronger technical senses, so the permanent title uses evaluability and
        those stronger claims require compounds or later specialization.
    scores:
      atomicity: 10
      address_fit: 10
