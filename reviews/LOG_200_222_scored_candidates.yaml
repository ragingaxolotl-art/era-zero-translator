  - candidate_id: consequence_entailment_relations
    title: persistent internal consequence relation
    invariant_candidate: A persistent formal consequence or entailment relation at
      inward logical scope.
    analysis:
      why_it_fits: Implication and entailment are core formal relations and can be
        framed at inward, target, or systemic scope with persistent, operative, or
        latent status.
      useful_coverage: It would cover implies, entails, follows from, depends formally
        on, proves, derives, and guarantees.
