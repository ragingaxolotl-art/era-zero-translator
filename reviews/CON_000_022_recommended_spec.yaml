  proposal_status: canonical_by_delegated_approval
  proposed_title: persistent source endpoint
  invariant_definition: A bounded communicative locus that remains identified as the
    source-side endpoint of an exchange context.
  semantic_center: 'communicative loci: source endpoint, target endpoint, or shared
    channel'
  address_justification:
    first_trit_0: 'Selects an entity or condition: persistent source endpoint is a
      communicative endpoint locus, not the act of communicating and not the relationship
      or capacity connecting participants.'
    second_trit: 'Selects inward/source scope: the originating side is the locus named
      by the root.'
    third_trit: 'Selects stable or persistent lexical expression: the endpoint or
      channel is retained as a persistent identity.'
  inclusion_boundary: Includes only a communicative locus at this exact source, target,
    or shared scope and this exact persistent, active, or dormant lexical expression.
    The bearer may be a person, device, service, port, room, session, medium, or other
    entity, but this root names its place in an exchange context rather than the bearer
    itself.
  excluded_meanings:
  - The identity, life, consciousness, location, physical composition, or structure
    of the endpoint bearer.
  - A message, signal payload, symbol, record, protocol, language rule, or stored
    address as an information object.
  - Sending, receiving, delivering, broadcasting, negotiating, acknowledging, or otherwise
    performing a communication process.
  - A bond, agreement, compatibility relation, reachability capacity, permission,
    access right, or possible network relation.
  - Online/offline runtime status, success, failure, schedule, intention, attention,
    comprehension, or future participation unless another root or grammar supplies
    it.
  nearest_neighbors:
  - CON:001
  - CON:002
  - CON:010
  - CON:020
  - CON:100
  - CON:200
  - DAT:000
  - STR:000
  same_family_contrast: CON:0xx owns communicative endpoint and channel loci; CON:1xx
    must own communication processes such as transmission or receipt; CON:2xx must
    own capacities, bonds, compatibility, and unrealized relational possibilities.
  cross_family_comparisons: &1
    LIF: LIF identifies living or conscious participants. A person or organism can
      bear a CON endpoint, but biological identity is not the communicative locus.
    MOV: MOV owns physical position, approach, routes, and shared reference frames.
      Spatial proximity can support communication without constituting an endpoint
      or channel.
    MAT: MAT owns cables, radios, bodies, sound waves, and other physical substrates.
      CON names the communicative locus or environment realized through them.
    MIN: MIN owns representations, revision, and attention. Understanding, noticing,
      or jointly attending is not the same as occupying an endpoint or channel.
    STR: STR owns topology, containment, organization, and system architecture. A
      structure can implement a channel, but organization alone does not make it communicative.
    WRN: WRN owns communication failure, loss, corruption, spoofing, and unavailability
      when evaluated as danger or error. CON remains neutral about success.
    REP: REP owns reconnecting, restoring, or healing damaged communication. A repaired
      channel may again satisfy CON, but repair is not the endpoint or channel itself.
    LOG: LOG owns protocol rules, typing, validity, permissions, and formal coordination.
      Rule compatibility may govern a channel without being that channel.
    DAT: DAT owns messages, symbols, records, payloads, and signals as information
      objects. CON owns where communicative participation and shared exchange occur.
    CRE: CRE owns designing or instantiating communication systems and artifacts.
      A created interface becomes a CON endpoint only when assigned a communicative
      locus.
    ORI: ORI owns existence, manifestation, modality, time, and universal conditions.
      Persistent, active, and dormant CON lexemes do not silently encode tense or
      possibility.
  runtime_state_interpretation:
    '0': Denies that the persistent identification of this source-endpoint locus currently
      holds in the exchange context; it does not assert either active participation
      or dormant retention.
    '1': Affirms that this source-endpoint locus remains persistently identified across
      the stated exchange context, whether or not a particular exchange act is occurring.
    2/num: Leaves unresolved whether the persistent identification of this source-endpoint
      locus currently holds; it does not change source/target/shared scope or select
      an active or dormant sibling.
  lexical_runtime_distinction: The third lexical trit permanently selects stable or
    persistent endpoint/channel character. Runtime `[2]/num` separately marks the
    status of this token's assertion. Thus CON:000[1] affirms the persistent source
    endpoint lexeme, while CON:000[2]/num leaves the assertion about that same lexeme
    unresolved.
  examples:
  - category: ordinary_conversation
    semantic_graph: CON:000[1](ENDPOINT=me,CONTEXT=call)
    literal_gloss: me as persistent source endpoint of call
    natural_english: I remain the identified source endpoint for this call.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source endpoint or originating participant
      middle: CON endpoint or shared channel
      high: target endpoint or addressed participant
      sustained: shared communicative environment or exchange context
    use_status: valid
    analysis: The assertion affirms the persistent source endpoint.
  - category: physical_or_spatial
    semantic_graph: MAT(RADIO=device)+CON:000[1](ENDPOINT=device)
    literal_gloss: physical radio bearing persistent source endpoint
    natural_english: The radio is the identified transmitting-side endpoint.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source endpoint or originating participant
      middle: CON endpoint or shared channel
      high: target endpoint or addressed participant
      sustained: shared communicative environment or exchange context
    use_status: valid
    analysis: MAT owns the radio; CON owns its communicative locus.
  - category: temporal_or_sequential
    semantic_graph: CON:000[1](ENDPOINT=station,ACROSS=sessions)
    literal_gloss: station remains source endpoint across sessions
    natural_english: The station keeps the same source-endpoint identity between sessions.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source endpoint or originating participant
      middle: CON endpoint or shared channel
      high: target endpoint or addressed participant
      sustained: shared communicative environment or exchange context
    use_status: valid
    analysis: Persistence spans sessions without asserting current transmission.
  - category: cross_family_compound
    semantic_graph: LIF:000[1](BEARER=person)+CON:000[1](ENDPOINT=person)
    literal_gloss: continuous person plus persistent source endpoint
    natural_english: The same person remains the source-side participant point.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source endpoint or originating participant
      middle: CON endpoint or shared channel
      high: target endpoint or addressed participant
      sustained: shared communicative environment or exchange context
    use_status: valid
    analysis: LIF supplies identity; CON supplies the endpoint.
  - category: executable_or_programming
    semantic_graph: CON:000[1](ENDPOINT=service_A,CONTEXT=request)
    literal_gloss: service A as persistent request source endpoint
    natural_english: Service A is registered as the source endpoint.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source endpoint or originating participant
      middle: CON endpoint or shared channel
      high: target endpoint or addressed participant
      sustained: shared communicative environment or exchange context
    use_status: valid
    analysis: This is endpoint identity, not a send operation.
    pseudocode: assert(communication_context.matches?("CON:000"))
  - category: counterexample
    semantic_graph: DAT(MESSAGE=payload)
    literal_gloss: information payload
    natural_english: The payload is data, not the source endpoint.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source endpoint or originating participant
      middle: CON endpoint or shared channel
      high: target endpoint or addressed participant
      sustained: shared communicative environment or exchange context
    use_status: must_not_use_this_root
    analysis: DAT must be used for message content.
  future_compound_examples:
  - CON:000 + LIF/MAT/STR identifies the living, physical, or structural bearer of
    the communicative locus without redefining that bearer.
  - CON:000 + DAT supplies a message, signal, record, address, or payload associated
    with the endpoint or channel.
  - CON:000 + CON:1xx supplies sending, receiving, delivery, broadcast, or another
    exchange process through the locus.
  - CON:000 + CON:2xx/LOG/WRN/REP supplies bond, compatibility, permission, failure,
    or restoration while preserving the entity/process/relation boundary.
  later_era_notes: Later eras may lexicalize speaker, listener, caller, callee, account,
    mailbox, port, socket, room, forum, frequency, topic, bus, session, and medium
    as compounds or descendants. The Era Zero invariant must remain neutral about
    bearer identity, content, protocol, success, and physical implementation.
