  proposal_status: canonical_by_delegated_approval
  proposed_title: completed internal restoration
  invariant_definition: Completion of a restorative transformation originating within
    one reference entity by which that entity enters its applicable internal restoration
    condition.
  semantic_center: 'substrate-neutral restorative transformation: internal restoration,
    source-to-target restoration, and coordinated systemic restoration'
  address_justification:
    first_trit_1: Selects a restorative process, action, or transformation rather
      than a restoration-condition entity, recoverability affordance, resource, record,
      rule, or schedule.
    second_trit: 'Selects inward/self scope: this root originates within one reference
      entity and changes that entity toward its applicable internal restoration condition
      without requiring a distinct external source; no competing family or temporal
      phase is added by this axis.'
    third_trit: Selects the completed phase of the same internal-restoration process;
      planning, queueing, schedule, futurity, permission, probability, and runtime
      truth status remain separate.
  inclusion_boundary: Includes only a completed substrate-neutral restorative transformation
    that originates within one reference entity and changes that entity toward its
    applicable internal restoration condition without requiring a distinct external
    source. If a distinct external source causes the change, use target restoration;
    if one shared condition is realized across several participants, use systemic
    restoration. The transformation may be realized physically, biologically, computationally,
    informationally, socially, or conceptually, but it does not itself assert the
    bearer, concrete mechanics, movement path, record, observer knowledge, validation,
    maintenance, replacement, resource, recoverability, probability, schedule, or
    causal history beyond the scope roles required by the invariant.
  excluded_meanings:
  - The restoration condition, bearer, restorative source, target, participant, material
    object, organism, software component, institution, checkpoint, or data record
    as an entity.
  - Spatial movement, return, route traversal, physical force, biological mechanism,
    data copying, structural reconfiguration, creation, replacement, or reconstruction
    as such without the REP restorative transformation claim.
  - Planning, intention, staging, queueing, scheduling, permission, readiness, probability,
    futurity, obligation, or specification—especially for lexical 1x2.
  - Inspection, validation, verification, certification, evidence collection, belief
    revision, diagnosis, recognition, or measurement of a restoration condition.
  - Maintenance, preservation, routine servicing, warning, containment, neutral coordination,
    fabrication, replacement, reconstruction, or mere communication about restoration.
  - Recoverability, repairability, restorative capacity, remedy availability, caregiver
    relation, service contract, resource readiness, probability, or other continuing
    capacity or relation.
  nearest_neighbors:
  - REP:101
  - REP:102
  - REP:110
  - REP:120
  - REP:000
  - REP:200
  same_family_contrast: REP:0xx owns internal, target, and shared restoration-condition
    entities. REP:1xx owns restorative transformations toward realizing those conditions.
    REP:2xx remains reserved for recoverability, repairability, and enabling restoration
    relations. Internal restoration has no required distinct external source. Target
    restoration preserves one source and one target as distinct roles. Systemic restoration
    requires one coordinated transformation that realizes one shared restoration condition
    across multiple participants. A completed REP:1xx root entails that the applicable
    restoration condition was realized by the stated transformation at completion;
    it does not entail that the result persists, that it was recorded or validated,
    that maintenance continues, or that a continuing REP:2xx affordance holds unless
    separately asserted.
  cross_family_comparisons: &1
    LIF: LIF owns living identity, physiology, health, injury, illness, and care roles.
      REP can classify healing as restoration, but it does not define the biological
      mechanism or the living bearer.
    MOV: MOV owns location, displacement, approach, traversal, and return. Moving
      something back can serve restoration, but REP names transformation toward an
      applicable restoration condition rather than the path traveled.
    MAT: MAT owns substance, force, energy, fracture, contact, shape, and physical
      change. REP abstracts restorative direction and scope; material repair mechanics
      remain separately asserted.
    MIN: MIN owns perception, attention, belief, memory, intention, satisfaction,
      and recognition. Restoration can occur without awareness, and believing something
      repaired does not perform the transformation.
    CON: CON owns care communication, service requests, coordination, and participant
      exchange. Coordination may support systemic restoration but is not itself the
      restorative transformation.
    WRN: WRN owns faults, hazards, degradation, impairment, and adverse propagation.
      REP:1xx moves toward realizing an applicable restoration condition; WRN moves
      toward a less acceptable condition, and neither process entails the other.
    STR: STR owns reconfiguration, incorporation, integration, and structural affordances.
      A structural change can implement restoration, but REP does not specify topology
      or constituent arrangement.
    LOG: LOG owns correctness, validity, rule satisfaction, permission, and constraints.
      Correction can be one result of restoration, but checking or satisfying a rule
      is not automatically a restorative transformation.
    DAT: DAT owns records, checkpoints, backups, schemas, measurements, and information
      transformation. Restoring data may use a checkpoint, but the record and copy
      operation do not replace the REP transformation claim.
    CRE: CRE owns generation, fabrication, replacement, reconstruction, and destruction.
      Replacement or rebuilding may realize restoration, but creation and substitution
      are not identical to movement toward a restoration condition.
    ORI: ORI owns tense, duration, possibility, necessity, and general transition.
      Lexical REP:1x2 selects a nonactualized restorative process and does not encode
      plan, schedule, queue, probability, future time, or eventual realization.
  runtime_state_interpretation:
    '0': Denies that this internal-restoration process reached completion in the stated
      restoration context; it does not assert that the active or nonactualized sibling
      holds.
    '1': Affirms that this internal-restoration process reached completion and realized
      the applicable restoration condition, without asserting the concrete mechanism,
      record, validation, permanence, maintenance, replacement, or continuing recoverability.
    2/num: Leaves unresolved whether this internal-restoration process reached completion
      or whether that completed result remains applicable; the lexical root stays
      completed.
  lexical_runtime_distinction: The lexical third trit permanently selects the completed
    member of this process triplet. Runtime `[2]/num` instead qualifies the truth,
    applicability, or resolution of a token of that already-selected root; it never
    changes the root into a planned, future, or different-phase process.
  catalogue_title_guard: The concise catalogue title is controlled by the invariant
    definition and must not be broadened with unstated mechanics, records, validation,
    maintenance, replacement, result persistence, or temporal semantics.
