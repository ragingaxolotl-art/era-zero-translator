  proposal_status: canonical_by_delegated_approval
  proposed_title: persistent internal susceptibility
  invariant_definition: A persistent susceptibility of one reference entity to undergo
    internally originating degradation under qualifying conditions, independently
    of whether that susceptibility is presently operative.
  semantic_center: 'adverse-transformation affordance: internal susceptibility, source-to-target
    exposure, and systemic propagation pathways'
  address_justification:
    first_trit_2: Selects an adverse capacity or enabling relationship rather than
      an adverse-condition entity or an actual adverse transformation.
    second_trit: 'Selects inward scope: one reference entity and its internally originating
      adverse change; this root names the affordance for internal susceptibility and
      no competing family claim.'
    third_trit: Selects persistent independently of current operation expression of
      the same internal susceptibility; runtime truth status, tense, probability,
      permission, and process phase remain separate.
  inclusion_boundary: Includes only the persistent independently of current operation
    substrate-neutral adverse affordance for internal susceptibility. The susceptibility
    belongs to one reference entity and concerns internally originating degradation;
    a distinct hazard source selects the outward column. It may be realized physically,
    biologically, computationally, informationally, socially, or conceptually, but
    it does not assert that the matching WRN:1xx transformation occurs, that a WRN:0xx
    adverse condition manifests, or that mechanics, evidence, knowledge, severity,
    probability, control, recovery, temporal, or modal conditions hold.
  excluded_meanings:
  - The intrinsic fault, external hazard, distributed fault, bearer, source, target,
    participant, or system as an entity or adverse condition.
  - An actual internal degradation, source-to-target impairment, or systemic propagation
    process at any completion phase.
  - Physical force, energy, contact, permeability, route, biological mechanism, structural
    dependency, communicative channel, or data-flow edge as such.
  - Detection, observability, diagnosis, evidence, warning messages, belief, confidence,
    attribution, severity, probability, expected loss, or risk score.
  - Resistance, immunity, shielding, filtering, isolation, containment, blocking,
    repairability, recovery, or other protective affordance.
  - Readiness, plan, schedule, future time, permission, necessity, unrestricted possibility,
    or guaranteed occurrence of harm.
  nearest_neighbors:
  - WRN:201
  - WRN:202
  - WRN:100
  - WRN:101
  - WRN:102
  - WRN:000
  same_family_contrast: 'WRN:0xx names adverse-condition entities: intrinsic faults,
    distinct external hazards, and correlated distributed faults. WRN:1xx names actual
    adverse transformations: internal degradation, source-to-target impairment, and
    systemic propagation. WRN:2xx names only the corresponding adverse affordance:
    inward susceptibility, outward source-target exposure, or a systemic propagation
    pathway. An affordance does not entail that its process begins or completes; an
    actual process does not entail that the affordance persists afterward. Persistent
    2x0 identity may co-occur with its operative or latent sibling, while operative
    and latent are mutually exclusive for the same affordance at one reference time.'
  cross_family_comparisons: &1
    LIF: LIF owns living identity, health, injury, illness, immunity as a biological
      mechanism, and social participants. WRN can classify a living bearer as susceptible,
      exposed, or connected by a propagation pathway, but it does not replace biological
      facts.
    MOV: MOV owns position, displacement, routes, approach, traversal, and delivery.
      A hazard may travel along a route, but WRN:2xx names only the adverse affordance
      or pathway that makes degradation, impairment, or propagation possible.
    MAT: MAT owns physical force, energy, contact, porosity, conductivity, fracture,
      and material coupling. Those properties may realize vulnerability or exposure,
      but WRN supplies the adverse significance and scope relation.
    MIN: MIN owns awareness, fear, expectation, diagnosis, confidence, and perceived
      risk. Susceptibility and exposure may hold without any observer knowing or believing
      that they hold.
    CON: CON owns channels, reachability for expressions, alerts, and participant
      exchange. A communicative channel may realize a propagation pathway, but neutral
      message reachability is not itself a WRN pathway.
    REP: REP owns resistance, protection, repairability, stabilization, restoration,
      recovery, and maintenance. A WRN susceptibility or pathway states what adverse
      process can occur; it does not state capacity to prevent or reverse it.
    STR: STR owns structural interfaces, dependency, containment, topology, and incorporation
      or integration affordances. Structural connectivity may realize exposure or
      propagation, but it does not become Warning-family semantics unless adverse
      enablement is asserted.
    LOG: LOG owns validity, constraint satisfaction, permission, exploit preconditions
      as formal rules, and quantified inference. WRN:2xx is not invalidity, authorization,
      a probability judgment, or a rule saying that harm may occur.
    DAT: DAT owns evidence, measurements, risk records, vulnerability reports, provenance,
      and information-flow graphs. A record can describe a WRN affordance but is not
      the susceptibility, exposure, or pathway itself.
    CRE: CRE owns creation, design, destruction, mutation, and fabrication. Creating
      a vulnerability or pathway is a separate process from the resulting WRN adverse
      affordance.
    ORI: ORI owns general possibility, necessity, time, manifestation, and modality.
      WRN:2xx states a typed adverse affordance or relation; it does not encode unrestricted
      possibility, probability, schedule, or future time.
  runtime_state_interpretation:
    '0': Denies that the persistent internal susceptibility persists in the stated
      warning context; it does not select the operative or latent sibling and does
      not assert safety.
    '1': Affirms that the persistent internal susceptibility persists independently
      of current operation, without asserting that degradation, impairment, or propagation
      is occurring.
    2/num: Leaves unresolved whether the persistent internal susceptibility persists;
      the lexical root remains the persistent member and does not become latent.
  lexical_runtime_distinction: Lexical third trit 0 permanently selects the persistent
    member of this adverse-affordance triplet. Runtime `[2]/num` instead marks a token-level
    assertion pending, remembered, or unresolved. Thus `WRN:200[1]` affirms the lexical
    concept, while a persistent or operative sibling carrying `[2]/num` remains that
    sibling and never becomes a latent root.
  examples:
  - category: ordinary_conversation
    semantic_graph: WRN:200[1](ENTITY=e,SUSCEPTIBILITY=v)
    literal_gloss: affirm persistent internal susceptibility of one reference entity
    natural_english: This account retains an internal susceptibility whether or not
      it is currently operative.
    runtime_state: 1
    contour: level declaration
    role_registers: mid register for the reference entity; low register for its susceptibility
    use_status: valid
    analysis: The example asserts only adverse affordance, not an adverse event.
  - category: physical_or_spatial
    semantic_graph: MAT(REALIZATION=m)+WRN:200[1](ENTITY=e,SUSCEPTIBILITY=v)
    literal_gloss: material realization plus persistent internal susceptibility
    natural_english: The battery has the stated susceptibility to internally originating
      thermal degradation without asserting that degradation is occurring.
    runtime_state: 1
    contour: level declaration
    role_registers: mid register for the reference entity; low register for its susceptibility
    use_status: valid
    analysis: MAT supplies physical realization; WRN supplies adverse significance
      and scope.
  - category: temporal_or_sequential
    semantic_graph: WRN:200[1](ENTITY=e,SUSCEPTIBILITY=v)+ORI(INTERVAL=w)
    literal_gloss: persistent internal susceptibility during interval w
    natural_english: During the observation interval, the same device has the stated
      internal-susceptibility status.
    runtime_state: 1
    contour: level declaration
    role_registers: mid register for the reference entity; low register for its susceptibility
    use_status: valid
    analysis: ORI locates the claim in time; lexical third-trit status is not tense.
  - category: cross_family_compound
    semantic_graph: DAT(EVIDENCE=d)+STR(PATH=p)+WRN:200[1](ENTITY=e,SUSCEPTIBILITY=v)
    literal_gloss: evidence and realization plus persistent internal susceptibility
    natural_english: The evidence and structural path concern the adverse affordance,
      which still must hold independently.
    runtime_state: 1
    contour: level declaration
    role_registers: mid register for the reference entity; low register for its susceptibility
    use_status: valid
    analysis: DAT and STR describe evidence or realization; neither substitutes for
      the WRN affordance.
  - category: executable_or_programming
    semantic_graph: WRN:200[1](ENTITY=e,SUSCEPTIBILITY=v)
    literal_gloss: assert persistent internal susceptibility
    natural_english: The service reports whether an internally originating failure
      mode has the stated susceptibility status without asserting a failure event.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers: mid register for the reference entity; low register for its susceptibility
    use_status: valid
    analysis: The executable test must preserve reference identity and scope roles
      explicitly.
    pseudocode: assert(adverse_affordance.matches?("WRN:200"))
  - category: counterexample
    semantic_graph: WRN:101[1](ENTITY=e,CONDITION=c)
    literal_gloss: active internal degradation
    natural_english: The service is degrading now.
    runtime_state: 1
    contour: level declaration
    role_registers: mid register for the reference entity; low register for its susceptibility
    use_status: must_not_use_this_root
    analysis: Use WRN:101 for the ongoing adverse transformation; WRN:200 names susceptibility
      to that transformation, not its occurrence.
  future_compound_examples:
  - WRN:200 + WRN:0xx identifies the intrinsic fault, external hazard, or distributed
    fault associated with the adverse affordance.
  - WRN:200 + WRN:1xx distinguishes an adverse affordance from its actual degradation,
    impairment, or propagation process.
  - WRN:200 + MAT/MOV/LIF/STR/CON specifies physical, spatial, biological, structural,
    or communicative realization without reducing the WRN meaning to that realization.
  - WRN:200 + DAT/MIN/LOG specifies evidence, recognition, formal conditions, severity,
    or probability while keeping the adverse affordance independent.
  - WRN:200 + REP/CRE states protection, repair, recovery, or creation of the affordance
    without importing those processes into the atom.
  later_era_notes: Later eras may lexicalize weak, vulnerable, exposed, attackable,
    infectable, permeable, exploitable, contagious, cascade-prone, or blast-radius
    descendants. Era Zero must retain the internal-susceptibility / one-source-one-target
    exposure / correlated-multi-participant pathway contrast and keep persistent,
