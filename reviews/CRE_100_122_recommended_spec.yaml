    literal_gloss: completed productive process during interval w
    natural_english: During interval w, the productive transformation has the stated
      lexical phase.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source entity, creator, or participant in the productive transformation
      middle: productive transformation as the asserted figure
      high: generative pattern, generated artifact, or jointly constituted result
      sustained: shared production domain and multiple participants coordinated together
    use_status: valid
    analysis: ORI supplies time and does not replace process phase.
  - category: cross_family_compound
    semantic_graph: CRE:001[1](PATTERN=p)+CRE:100[1](ENTITY=studio,PATTERN=p)+DAT(REPRESENTATION=d)
    literal_gloss: manifest generative pattern plus productive process plus data representation
    natural_english: The pattern, productive process, and encoded representation remain
      separately typed.
    runtime_state: 1
    contour: level declaration
    role_registers:
      low: source entity, creator, or participant in the productive transformation
      middle: productive transformation as the asserted figure
      high: generative pattern, generated artifact, or jointly constituted result
      sustained: shared production domain and multiple participants coordinated together
    use_status: valid
    analysis: Entity, process, and representation remain distinct.
  - category: executable_or_programming
    semantic_graph: CRE:100[1](ENTITY=studio,PATTERN=p)
    literal_gloss: assert completed productive transformation
    natural_english: A runtime tracks generation phase without folding in scheduler
      state, implementation medium, output quality, or ownership.
    runtime_state: 1
    contour: level assertion or sharply falling execution
    role_registers:
      low: source entity, creator, or participant in the productive transformation
      middle: productive transformation as the asserted figure
      high: generative pattern, generated artifact, or jointly constituted result
