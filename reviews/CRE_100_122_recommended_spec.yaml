  proposal_status: canonical_by_delegated_approval
  proposed_title: completed internal pattern formation
  invariant_definition: Completion of a bounded productive transformation within one
    reference entity that forms or modifies a generative pattern while retaining it
    within that entity.
  semantic_center: 'productive processes: internal pattern formation, outward artifact
    generation, and systemic co-generation'
  address_justification:
    first_trit_1: Selects a productive transformation rather than a Creation entity,
      cognitive act, data transformation, physical mechanism, structural transition,
      or generative affordance.
    second_trit: 'Selects inward/self scope: one generative pattern formed or modified
      while retained within one reference entity and no other Creation-family column.'
    third_trit: Selects the completed phase of the same productive transformation
      while leaving runtime truth status, quality, value, authorship, acceptance,
      tense, probability, and scheduling separate.
  inclusion_boundary: Includes only the completed internal pattern formation as a
    substrate-neutral form-producing process at inward scope. The process forms or
    modifies a production-guiding pattern within one entity and does not itself produce
    an outward artifact. Mental conception, encoding, algorithm, and physical realization
    remain separate. It is neutral about mental awareness, encoded representation,
    physical medium, structural mechanics, creator identity, quality, value, ownership,
    persistence, scheduling, probability, timing, and cause.
  excluded_meanings:
  - The generative pattern, generated artifact, or shared repertoire as an entity,
    and its persistent, manifest, or dormant status.
  - Mental imagination, inspiration, intention, planning, belief, understanding, attention,
    or subjective creative experience.
  - Encoded data transformation, formal algorithm, physical substance, energy, tool,
    spatial displacement, or structural mechanics realizing the process.
  - Communicative intent, social collaboration alone, sender or recipient role, message
    uptake, dialogue, authority, ownership, or authorship.
  - Restoration to an acceptable prior state, warning, fault, aesthetic quality, originality,
    success, completion criterion, acceptance, or use.
  - Capability, access, permission, intention, plan, readiness, queue, schedule, future
    time, possibility, necessity, probability, or cause.
  nearest_neighbors:
  - CRE:101
  - CRE:102
  - CRE:110
  - CRE:120
  - CRE:000
  - CRE:200
  same_family_contrast: "`CRE:0xx` owns generative patterns, generated artifacts,
    and shared generative repertoires as entities. `CRE:1xx` owns only pattern formation,
    artifact generation, and systemic co-generation as actual productive transformations.
    `CRE:2xx` remains reserved for generative affordances or relations. A manifest
    pattern does not entail formation, and a manifest artifact does not entail that
    generation is active or complete. Completed, active, and nonactualized are mutually
    exclusive phases for the same bounded productive transformation at one reference
    time. Lexical nonactualization states only that the typed process is not actualized;
    runtime `[2]/num` separately marks uncertainty about any selected phase."
  cross_family_comparisons: &1
    LIF: LIF owns living identities, biological conditions, agency, and social collectives.
      A living creator may perform a productive process, but CRE:1xx does not identify
      the agent, role, organism, or institution.
    MOV: MOV owns position, path, displacement, and movement. Production may move
      inputs or outputs, but CRE:1xx asserts generation rather than spatial displacement.
    MAT: MAT owns substance, energy, force, contact, and physical transformation.
      Fabrication may physically realize generation, but CRE:1xx remains substrate-neutral
      and does not assert material mechanics.
    MIN: MIN owns imagination, attention, intention, belief, and cognitive change.
      Mental ideation may guide pattern formation, but CRE:1xx requires productive
      transformation rather than subjective thought alone.
    CON: CON owns linkage, communication, interaction, and exchange. Co-generation
      may involve connected participants, but CRE:1xx requires one jointly constituted
      productive result rather than interaction alone.
    WRN: WRN owns faults, hazards, warnings, and adverse processes. Failed or dangerous
      production may ground WRN claims, but CRE:1xx does not entail error, danger,
      failure, or harm.
    STR: STR owns arrangements, boundaries, component relations, and structural transitions.
      Production may reconfigure structure, but CRE:1xx requires form-producing function
      rather than arrangement change alone.
    REP: REP owns restoration conditions, restorative processes, and restorative affordances.
      Reconstruction may generate an artifact, but CRE:1xx does not entail return
      to a prior acceptable state or repair success.
    LOG: LOG owns formal constraints, evaluations, and evaluation affordances. A generative
      process may execute rules, but it does not itself judge admissibility, truth,
      consistency, or validity.
    DAT: DAT owns represented information and its transformation, transfer, and synchronization.
      A productive process may be data-driven or generate data, but CRE:1xx requires
      form-producing creation rather than information-state change alone.
    ORI: ORI owns temporal, modal, causal, and ontological orientation. Scheduling,
      intention, future placement, possibility, necessity, probability, and causal
      explanation remain separate from lexical process phase.
  runtime_state_interpretation:
    '0': Denies that this internal pattern formation completed; it does not assert
      that the active sibling is still running, that the nonactualized sibling holds,
      or that the result had either polarity.
    '1': Affirms completion of this internal pattern formation, without asserting
      quality, value, originality, persistence, acceptance, authorship, physical mechanism,
      or later use.
    2/num: Leaves unresolved whether this completed internal pattern formation claim
      holds; runtime uncertainty does not change the lexical root into active or nonactualized
      phase.
  lexical_runtime_distinction: Lexical third trit `0` permanently selects the completed
    phase of this productive transformation. Runtime `[2]/num` instead leaves the
    already-selected phase claim unresolved; it never changes process phase. Thus
    a nonactualized root affirmed with `[1]` is a confirmed typed-but-nonactualized
    productive process, while a completed or active root carrying `[2]/num` remains
    lexically completed or active but uncertain as a token claim.
  examples:
