boundary:
  purpose: A deterministic, auditable input language for canonical labels and explicit
    semantic operators; not unrestricted English.
  accepted_lexemes: 'Exact quoted canonical atom and approved compound labels whose
    sense record has controlled_input_allowed: true.'
  normalization: Unicode NFC, lowercase lookup, collapsed internal whitespace; output
    retains canonical target identity.
  no_guessing: Unknown, non-controlled, ambiguous, or underspecified input returns
    one structured error and no IR.
  excluded:
  - synonym inference
  - pronouns or implicit coreference
  - implicit tense
  - implicit roles
  - unquoted free phrases
  - ranked candidate selection
  - general-English parsing
grammar:
  terminal: Every input ends in exactly one period.
  speech_act: ASSERT | QUESTION | COMMAND | DEFINE | POSSIBILITY
  lexical: '"<controlled label>" [0|1|2]'
  simple: ACT [NOT] [MODAL mode] [ASPECT aspect] LEXICAL {ROLE role (LEXICAL | REF
    earlier_role)} [TIME relation SPEECH_TIME] [MEASURE decimal unit] [QUANTIFIER
    kind [decimal]] .
  sequence: ACT SEQUENCE LEXICAL THEN LEXICAL {THEN LEXICAL} .
  parallel: ACT PARALLEL LEXICAL AND LEXICAL {AND LEXICAL} .
  repetition: ACT REPEAT positive_integer TIMES LEXICAL .
  conditional: ACT IF LEXICAL THEN LEXICAL .
  ordering_rule: Keywords and modifiers occur only in the documented order; reordering
    is an error, not an alternative parse.
  role_reference: REF reuses the exact argument occurrence of an earlier role in the
    same clause; it does not infer identity from equal lexical labels.
inventories:
