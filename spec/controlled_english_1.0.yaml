mapping:
  lexical: The unique controlled sense supplies target_type and target_id.
  roles: ROLE creates an explicit fills_role edge from argument occurrence to head
    occurrence.
  operators: NOT, MODAL, ASPECT, and QUANTIFIER create explicit nested scope_operator
    nodes in written order.
  time: TIME creates a speech_time anchor and explicit time_relation to the root clause.
  measurement: MEASURE creates a measurement node filling quantity.
  compound_slots: Every open slot declared by an approved compound must be supplied
    by a matching ROLE binding.
  composition: SEQUENCE, PARALLEL, REPEAT, and IF create the canonical coordination,
    repetition, and conditional IR structures.
