anchor: Utterance anchor, independent of the role registers inside the scope
boundary_after_beats: 0.5
rules:
  - Opening and closing frames surround exactly the negated subtree
  - All-of, any-of and exactly-one coordination have distinct frames and explicit member separators
  - Unordered coordination playback order is presentational and does not assert temporal sequence
  - Modal frames surround exactly their scoped subtree and do not change runtime state
  - Explicit confidence uses confidence-open, exact decimal digits, confidence-close before the scoped proposition
  - Confidence supports possible, necessary and predicted modes; it never substitutes for deontic force
  - Confidence strings must be canonical decimals from 0 through 1, with at most 1024 characters
  - Nested negation remains nested; no silent double-negation cancellation
  - Markers are grammar events, not atoms, compounds, names or recognition checksums
  - Runtime zero means inactive; it never substitutes for the negation frame
  - Before/at/after speech-time frames enclose the time-related clause without changing lexical or runtime state
  - Calendar-day interval frames use during relations and day offsets -1, 0 or 1 relative to the contextual speech date
  - Calendar days require the discourse calendar and timezone; they do not assert fixed 24-hour durations
  - Quantifier frames enclose their exact scope; exact/at-least/at-most cardinalities use canonical nonnegative integer digits after the opening
  - All/some/none quantifiers carry no numeric value and do not replace clause negation or lexical runtime
  - Measurement frames enclose optional minus, exact decimal digits, and an explicit unit frame
  - Measurement digits reuse decimal digit frames; no runtime state is used for magnitude or sign
  - Unsupported anchors and extra anchor parameters must not be silently omitted
  - Existing root melodies, runtime notes, and speech-act contours remain unchanged
  - No carrier syllables are invented for grammar frames; mouth animation is neutral
compatibility:
  positive_output: Unchanged
  negative_output: New scoped markers replace the previously indistinguishable positive performance
  semantic_ir: Existing negation nodes retain their identities
  consumers: Ruby and browser MIDI, SVG, browser sound and viseme schedules
remaining:
  - Musical conventions for range/proportional quantifiers, aspect and other unsounded operators
  - Independent listener recognition and broader end-to-end semantic decoding

