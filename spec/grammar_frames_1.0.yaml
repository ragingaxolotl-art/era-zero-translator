profile: EZGRAM-1
status: versioned_implementation_convention
authority: User-directed translator completion goal, October 28, 2026
provenance: New explicit grammar convention; not recovered from the original language source
purpose: Sound grammatical scope without changing lexical roots or runtime endings
frames:
  negation_open:
    relative_semitones: [0, -1, -1, 0]
    note_duration_beats: 0.25
  negation_close:
    relative_semitones: [0, 1, 1, 0]
    note_duration_beats: 0.25
