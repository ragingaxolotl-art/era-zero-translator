routing_tests:
- english_concept: person
  route: atomic
  rationale: LIF:010 when a particular other being is intended; discourse roles belong
    to later IR
- english_concept: destination
  route: atomic
  rationale: MOV:010
- english_concept: route
  route: atomic
  rationale: MOV:020
- english_concept: tool
  route: compound
  rationale: CMP:111b772027accab2054f0415
- english_concept: machine
  route: compound
  rationale: CMP:8e5ae722d9e5e31f85ac3c5b
- english_concept: program
  route: compound
  rationale: CMP:2f350e7d8e5dfba4a802d82d
- english_concept: injury
  route: compound
  rationale: CMP:f1abd5eccdf06d92d5690a32
- english_concept: message
  route: compound
  rationale: CMP:608ecb4f3c515a9c9a3443ec
- english_concept: road
  route: compound
  rationale: CMP:919b714e6201a462756224a2
- english_concept: body
  route: compound
  rationale: CMP:3122dedcff0f85ad293e2580
- english_concept: backup
  route: compound
  rationale: CMP:33c135410b0deef525b6770d
- english_concept: water
  route: unresolved_gap
  rationale: No canonical atom distinguishes liquid phase or H2O composition.
- english_concept: food
  route: unresolved_gap
  rationale: No canonical atom states nutritional suitability or consumption.
- english_concept: home
  route: defer_to_gate4c_and_ir
  rationale: English home conflates structure, habitual location, social bond, possession,
    and affect.
- english_concept: shelter
  route: unresolved_gap
  rationale: Protection function is not safely entailed by structure plus care.
- english_concept: run a program
  route: defer_to_semantic_ir
  rationale: Program definition plus execution occurrence requires clause-level event
    binding.
- english_concept: send a message
  route: defer_to_semantic_ir
  rationale: Message datum and source expression/target transfer are independent occurrence
    assertions.
- english_concept: repairing
  route: atomic_or_ir
  rationale: REP:101/111/121 by locus; domain compounds may qualify the process.
- english_concept: transport
  route: compound_plus_ir
  rationale: MOV movement, a bearer, and a moved target require role binding in utterance
    IR.
- english_concept: friend
  route: unresolved_gap
  rationale: LIF:210 establishes a life-bond but does not encode friendship's social
    convention.
rejection_tests:
- case_id: duplicate_atom
  input: MOV:010 alone renamed destination compound
  expected_error: atomic_collision
- case_id: runtime_in_identity
  input: runtime_state field in compound payload
  expected_error: forbidden_lexical_field
- case_id: event_as_lexeme
  input: send a message stored as one lexical compound
  expected_error: multiple_independent_assertions
- case_id: unsupported_water
  input: MAT:000 relabeled water
  expected_error: unsupported_semantic_narrowing
- case_id: unsupported_food
  input: MAT:010 plus LIF:200 relabeled food
  expected_error: missing_nutrition_relation
