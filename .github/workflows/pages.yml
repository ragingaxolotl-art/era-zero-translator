name: Deploy Era Zero Translator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install HTTP smoke dependency
        run: gem install webrick --no-document
      - name: Build deterministic browser release
        run: ruby tools/build_pages_release.rb
      - name: Verify full passage playback and song export
        run: |
          node tests/pages_artifact_visibility_test.mjs
          node tests/passive_sentences_test.mjs
          node tests/story_time_test.mjs
          node tests/ordinary_quantifiers_test.mjs
          node tests/story_requirements_test.mjs
          node tests/browser_loading_test.mjs
          node tests/sentence_gap_guidance_test.mjs
          node tests/ordinary_comparatives_test.mjs
          node tests/ordinary_comparatives_ui_test.mjs
          ruby tests/ordinary_comparative_pins_test.rb
          node tests/song_lines_test.mjs
          node tests/sentence_word_choices_test.mjs
          node tests/dictionary_clauses_test.mjs
          node tests/sentence_diagnostics_test.mjs
          node tests/partial_word_scope_test.mjs
          node tests/compact_song_chords_test.mjs
          node tests/story_readings_test.mjs
          node tests/state_adjective_sentences_test.mjs
          node tests/physical_vocabulary_test.mjs
          node tests/information_erasure_sentences_test.mjs
          node tests/information_vocabulary_test.mjs
          node tests/information_storage_test.mjs
          ruby tests/information_storage_pins_test.rb
          node tests/physical_holding_surface_test.mjs
          node tests/physical_placement_test.mjs
          ruby tests/placement_dictionary_test.rb
          node tests/container_actions_test.mjs
          ruby tests/container_actions_pins_test.rb
          node tests/physical_closing_test.mjs
          ruby tests/physical_closing_pins_test.rb
          node tests/contextual_width_test.mjs
          node tests/contextual_group_inverse_test.mjs
          node tests/contextual_modifiers_test.mjs
          node tests/contextual_state_complements_test.mjs
          node tests/sentence_scope_reliability_test.mjs
          node tests/love_semantic_inverse_test.mjs
          node tests/field_repair_regression.mjs
          node tools/audit_story_readings.mjs
          node tools/audit_story_followup.mjs initial
          node tools/audit_story_followup.mjs reserve
          git diff --exit-code -- reports/story_followup_current_initial.json reports/story_followup_current_reserve.json
      - name: Audit browser release
        run: node tools/validate_pages_release.mjs
      - name: Validate saved compound builder and sentence integration
        run: node tools/validate_local_compound_release.mjs
      - name: Test compound vocabulary growth
        run: ruby tools/test_compound_extension.rb
      - name: Audit approved love compound
        run: node tools/validate_love_compound.mjs
      - name: Audit phrases, dictionary, and documents
        run: node tools/audit_full_translator.mjs
      - name: Audit canonical product
        run: ruby tools/validate_product_application.rb
      - name: Audit project completeness and provenance
        run: ruby tools/audit_project_completeness.rb
      - name: Run complete historical regression
        run: ruby tools/regress_current_state.rb
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages-upload
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages
      - name: Wait for uploaded Pages artifact
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-upload.outputs.artifact_id }}
        with:
          script: |
            const waitForArtifact = require('./.github/scripts/wait-for-pages-artifact.cjs');
            await waitForArtifact({github, context, core,
              name: process.env.PAGES_ARTIFACT_NAME,
              artifactId: process.env.PAGES_ARTIFACT_ID});
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
