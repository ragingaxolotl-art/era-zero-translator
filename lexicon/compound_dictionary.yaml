    sense_key: ongoing_bodily_swimming
    sound_code: 21
    added_definition: The same actor performs bodily locomotor activity whose coordinated
      movements generate swimming propulsion against surrounding water. Water and
      the propulsion-producing interaction are part of this conventional meaning,
      not inferred from a noun label. Limb, fin, tail or body movements may contribute;
      assistance or equipment is not excluded. The activity need not produce net ground-relative
      progress, as when opposing a current. Mere floating, passive drifting, riding
      in a boat, or being carried through water does not suffice. No destination,
      crossing completion, speed, voluntary intention or absence of assistance is
      asserted.
    excludes:
    - Passive floating, drifting or transport alone
    - Machine operation, figurative swimming or unspecified fluid movement
    - Completed crossing, arrival or unassisted activity inferred from swimming
