    sense_key: ongoing_bodily_running
    sound_code: 23
    added_definition: 'The same actor performs a bodily running gait: a repeated leg-support
      and recovery pattern of the running class, characterized by bouncing or compressive
      support rather than the vaulting progression characteristic of walking. This
      is a conventional gait category, not a speed threshold or an inference from
      arbitrary body movement. Grounded forms without an airborne interval and running
      in place are included. The actor need not be human or biological. No particular
      speed, net ground-relative displacement, destination, arrival, conscious intention
      or unassisted performance is asserted.'
    excludes:
    - Walking, passive carriage or fast displacement without running gait
    - Running a program, operating a machine or liquid flowing
    - Arrival, mandatory flight phase or a speed threshold inferred from running
