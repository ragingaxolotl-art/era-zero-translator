      toward the bound destination position in that same event. The running activity
      constitutes this approach, not a separate simultaneous action or movement by
      another actor. The destination can be the contextual location of a named referent.
      The approach is ongoing; arrival, completed travel, receipt, ownership transfer,
      deliberate intention and continued presence at the destination are not asserted.
    excludes:
