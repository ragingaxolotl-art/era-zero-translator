  english_glosses:
  - active physical load support
  invariant_definition: The same material source bears at least part of the distinct
    material target load through physical influence that resists displacement under
    an applied force. This load-bearing support may be contact-mediated or field-mediated,
    need not bear the entire load, and does not require rest, movement, intention
    or consciousness.
  boundaries:
    includes: A person, structure or device physically bearing all or part of a distinct
      material load, through contact or a field.
    excludes: Physical influence without load-bearing support; Emotional, evidential,
      financial or computational support; Carrying or transport inferred from support
      alone; Grasping or holding without the load-bearing commitment
  collision_audit: MAT:211 supplies physical influence and MAT:010 constrains the
    bound load. Neither entails load bearing. Convention code 3 contributes that additional
    commitment without changing either root.
  confidence: high
  approval_record: migrations/physical_support_2026_10_28.yaml
  approval_basis: Delegated semantic approval under the user-directed translator-completion
    goal; reviews/physical_support_foundation.md
  examples:
    ordinary: Ada is physically supporting the box.
    technical: The supporting source bears part of the target load through physical
      influence resisting displacement under an applied force.
    future_compound: Reuse the exact versioned support relation for carrying, with
      explicit movement and shared participant constraints.
    counterexample: A lamp heats a box without bearing its load; a shelf supports
      a box without transporting it.
