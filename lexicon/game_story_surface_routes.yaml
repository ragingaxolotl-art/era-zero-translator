---
metadata:
  title: Era Zero Game and Story English Surface Routes
  version: 0.1.0
  status: translator_profile
  semantic_authority_changes: 0
  purpose: >-
    Give story dialogue and Cyber Pet phrases conservative routes into existing
    canonical meanings without adding roots or pretending that a generalized
    paraphrase is an exact English definition.
policy:
  noun_labels: >-
    An unmatched common noun or proper name may receive an EZNAME label. When a
    broad class such as person is known, the class and label remain separate.
  predicates: >-
    An unmatched verb or descriptor must be reported as unresolved semantic
    content. It must never silently become an EZNAME label.
  generalized_routes: >-
    A generalized route is permitted only when the source phrase entails the
    selected canonical meaning. The interface must disclose the lost detail.
  gaps: >-
    A gap may carry a phonemic noun label for reference, but that label does not
    resolve or conceal the semantic gap.
