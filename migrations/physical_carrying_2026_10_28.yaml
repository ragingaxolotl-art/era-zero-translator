  sense_key: ongoing_physical_carrying
  sound_code: 4
  added_definition: A material source conveys the same distinct material load that
    it physically supports, relative to the contextually relevant movement frame during
    the same ongoing interval. The load is borne upon, within, or suspended from a
    moving supporting part or field maintained by the source; that load-bearing engagement
    is the means of conveyance. The whole source need not translate, as with a conveyor
    belt. No intention, destination or recipient is asserted.
  excludes:
  - Stationary support without conveyance
  - Support and unrelated simultaneous movement
  - Pushing or dragging a load across an independently supporting surface without
    bearing it upon, within or suspended from the carrier
  - Throwing or falling after support ends
  - Abstract carrying of information, responsibility or disease
