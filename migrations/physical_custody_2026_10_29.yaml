convention:
  profile: EZLEX-1
  sense_key: practical_physical_custody
  sound_code: 7
  added_definition: An established material relation in which a holder has effective
    practical control over access to and physical handling of a distinct material
    object, through an arrangement the holder can operate directly or through a controlled
    physical intermediary. Mere ability to approach, touch, influence or seize the
    object does not establish this relation. Control need not be exclusive, lawful,
    conscious, voluntary, continuously exercised or accompanied by ownership, load
    bearing, movement or a prior transfer.
  excludes:
  - Ownership, permission or entitlement without practical control
  - Proximity, touch, load support or physical influence alone
  - Hypothetical ability to seize an object not already under practical control
  - Legal guardianship, information access or ownership of an abstract asset
  - Receipt or transfer inferred from a custody state alone
