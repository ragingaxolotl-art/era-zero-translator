  sound_code: 8
  added_definition: 'Completion of one bounded transition in which the specified practical
    physical custody relation comes to obtain: the same holder lacks that control
    of the same distinct material object immediately before the transition and has
    it at culmination. The actualized referent is this holder-object custody relation,
    not the material object. The nested custody relation describes the culmination
    state, not an independent assertion of custody at speech time. No prior custodian,
    sourced transfer, loss of another holder''s control, ownership, willingness, displacement,
    creation of the object or persistence after culmination is asserted.'
  excludes:
